<title>Bristol EPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
/* Bristol EPS — app épurée : barre latérale (ordinateur) ou onglets en bas (téléphone), une colonne de 720px.
   Un vert « gymnase » pour l'action, l'or réservé à la série et aux succès. */
:root{
  --paper:#f3f5f2; --surface:#ffffff; --ink:#13201a; --muted:#5a6861; --line:#dde4df; --chip:#e8ede9;
  --accent:#0b7a53; --accent-ink:#ffffff; --soft:#e1f2e9; --accent-text:#09694a;
  --hero:#0b7a53; --hero-ink:#ffffff; --hero-sub:rgba(255,255,255,.8); --hero-tint:rgba(255,255,255,.14); --hero-lane:rgba(255,255,255,.25); --hero-fill:#ffffff;
  --gold:#e5a00d; --gold-ink:#3b2900; --gold-text:#8a5c00;
  --ok:#0b7a53; --ok-soft:#e1f2e9; --mid:#955900; --mid-soft:#fcecd2; --bad:#b53a2d; --bad-soft:#fbe4e0;
  --warn:#955900;
  --seg-m:#0b7a53; --seg-c:#8fd0b2; --seg-e:#dde4df;
  --hm0:#e5ebe7; --hm1:#bfe3d1; --hm2:#7cc7a4; --hm3:#2f9c6e; --hm4:#0b6b47;
  --shadow:rgba(19,32,26,.10);
  --f-display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:var(--f-display);
  --r-xl:28px; --r-l:20px; --r-m:14px; --r-s:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1412; --surface:#17201c; --ink:#e6eeea; --muted:#9aa9a1; --line:#28332e; --chip:#1f2925;
    --accent:#3dcb92; --accent-ink:#04130c; --soft:#163a2b; --accent-text:#5fdaa7;
    --hero:#163a2b; --hero-ink:#e6eeea; --hero-sub:#a9c4b7; --hero-tint:rgba(255,255,255,.07); --hero-lane:rgba(255,255,255,.12); --hero-fill:#3dcb92;
    --gold:#f1be4a; --gold-ink:#2a1d00; --gold-text:#f1be4a;
    --ok:#3dcb92; --ok-soft:#163a2b; --mid:#e8a94f; --mid-soft:#3a2c14; --bad:#f07d70; --bad-soft:#3d1d19; --warn:#e8a94f;
    --seg-m:#3dcb92; --seg-c:#2a6b50; --seg-e:#28332e;
    --hm0:#1f2925; --hm1:#1e4535; --hm2:#2a6b50; --hm3:#36a277; --hm4:#5fdaa7;
    --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1412; --surface:#17201c; --ink:#e6eeea; --muted:#9aa9a1; --line:#28332e; --chip:#1f2925;
  --accent:#3dcb92; --accent-ink:#04130c; --soft:#163a2b; --accent-text:#5fdaa7;
  --hero:#163a2b; --hero-ink:#e6eeea; --hero-sub:#a9c4b7; --hero-tint:rgba(255,255,255,.07); --hero-lane:rgba(255,255,255,.12); --hero-fill:#3dcb92;
  --gold:#f1be4a; --gold-ink:#2a1d00; --gold-text:#f1be4a;
  --ok:#3dcb92; --ok-soft:#163a2b; --mid:#e8a94f; --mid-soft:#3a2c14; --bad:#f07d70; --bad-soft:#3d1d19; --warn:#e8a94f;
  --seg-m:#3dcb92; --seg-c:#2a6b50; --seg-e:#28332e;
  --hm0:#1f2925; --hm1:#1e4535; --hm2:#2a6b50; --hm3:#36a277; --hm4:#5fdaa7;
  --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.ic{width:22px;height:22px;flex:none}

/* ---------- Cadre : en-tête et navigation ---------- */
.side{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;font-weight:800;letter-spacing:-.04em}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tool{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px;min-width:40px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;cursor:pointer}
.tool svg.ic{width:20px;height:20px}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-text)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0 6px;white-space:nowrap}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.status[data-mode="cloud"] .dot{background:var(--ok)}
.status[data-mode="saving"] .dot{background:var(--gold)}
@media (max-width:959px){ .tool .tlab,.status .tlab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap} .tool{padding:0} }

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-btn{appearance:none;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:12px;font-weight:700;cursor:pointer;min-height:54px;min-width:0}
.nav-btn .ni{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.nav-btn .nl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-btn[aria-selected="true"]{color:var(--accent-text)}
.nav-btn[aria-selected="true"] .ni{background:var(--soft)}
.main{max-width:760px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom,0px))}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .side{flex-direction:column;align-items:stretch;gap:0;height:100vh;padding:28px 16px 20px;border-bottom:0;border-right:1px solid var(--line)}
  .brand{padding:0 10px 28px;font-size:22px}
  .nav{position:static;display:flex;flex-direction:column;gap:4px;border:0;padding:0;background:none}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:0 12px;min-height:48px;border-radius:var(--r-m)}
  .nav-btn .ni{width:auto;height:auto;background:none!important}
  .nav-btn:hover{background:var(--chip);color:var(--ink)}
  .nav-btn[aria-selected="true"]{background:var(--soft)}
  .tools{margin:auto 0 0;flex-direction:column;align-items:stretch;gap:2px;padding-top:16px;border-top:1px solid var(--line)}
  .tool{justify-content:flex-start;border:0;background:none;color:var(--muted);padding:0 12px;border-radius:var(--r-s);font-weight:400}
  .tool:hover{background:var(--chip);color:var(--ink)}
  .status{padding:6px 12px 10px}
  .main{width:100%;max-width:1200px;padding:44px 48px 72px}
  .seg{max-width:560px}
  #area-train > section,#area-train > .intro{max-width:880px}
  .welcome{padding:32px 36px}
}
/* Grand écran : deux colonnes */
.home-grid,.rev-grid,.stats-grid{display:grid;gap:0 32px}
.rev-side{display:none}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 18px 16px;margin:0 0 20px}
.side-card h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 12px}
.rd .kpi{background:var(--paper);border:0;padding:12px 14px}
.rd .kpi b{font-size:26px}
.stats-grid .rd-row{grid-template-columns:minmax(0,1.3fr) minmax(60px,1.2fr) 3em}
.side-card .rd-row{grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 3em}
.side-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 4px}
.side-stats div{background:var(--paper);border-radius:var(--r-m);padding:10px 12px}
.side-stats b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.side-stats span{font-size:13px;color:var(--muted)}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.keys li{display:flex;gap:10px;align-items:center}
.keys .k{min-width:52px;text-align:center;padding:4px 6px;color:var(--ink)}
@media (min-width:1100px){
  .home-grid{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);align-items:start}
  .rev-grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
  .rev-side{display:block;position:sticky;top:44px}
  .stats-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .stats-grid .span2{grid-column:1 / -1}
  .hero{padding:30px 32px 28px}
}

/* ---------- Typographie des pages ---------- */
.page-h{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:0 0 20px;text-wrap:balance}
.page-sub{color:var(--muted);margin:-14px 0 22px}
.sect{margin:0 0 36px}
.sect h3,.group h3{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.015em;line-height:1.2;margin:0 0 12px}
.lead,.intro{color:var(--muted);margin:0 0 16px;max-width:62ch}
.lead strong{color:var(--ink)}
.hint{color:var(--muted);font-size:14px;margin:12px 0 0}
.opt{font-weight:400;color:var(--muted)}

/* ---------- Boutons et contrôles ---------- */
.btn{appearance:none;font-weight:700;font-size:16px;line-height:1.2;border-radius:var(--r-m);padding:12px 18px;min-height:48px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:17px;border-radius:var(--r-l)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px;border-radius:var(--r-s)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.k{font-family:var(--f-body);font-weight:700;font-size:11px;line-height:1;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,currentColor 15%,transparent)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.actions{margin-top:16px}
.linkbtn{appearance:none;background:none;border:0;padding:4px 0;color:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.85}
.back{appearance:none;background:none;border:0;padding:8px 0;color:var(--accent-text);font-weight:700;cursor:pointer;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;padding:6px 14px;min-height:40px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .n{font-size:12px;opacity:.7;margin-left:4px}
.seg{display:flex;gap:4px;padding:4px;margin:0 0 22px;background:var(--chip);border-radius:var(--r-m)}
.seg button{appearance:none;flex:1 1 0;min-width:0;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 8px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
form{display:grid;gap:16px;max-width:600px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
label{font-weight:700;display:block;margin-bottom:6px}
input,textarea,select{width:100%;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;min-height:46px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:96px;resize:vertical;line-height:1.55}
.err{color:var(--bad);font-size:14px;margin:0}

/* ---------- Accueil « Aujourd'hui » ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r-xl);padding:24px 24px 22px;margin:0 0 28px;display:grid;gap:20px}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px 24px}
.hero-j{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,14vw,96px);line-height:.85;letter-spacing:-.045em;font-variation-settings:"wdth" 80;margin:0;font-variant-numeric:tabular-nums}
[data-theme="dark"] .hero-j{color:var(--accent-text)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero-j{color:var(--accent-text)} }
.hero-j .jd{margin:0 -.06em 0 -.04em}
.hero-date{color:var(--hero-sub);margin:10px 0 0;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.hero-date .linkbtn{color:var(--hero-ink)}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap}
.hstat{background:var(--hero-tint);border-radius:var(--r-l);padding:10px 16px 12px;min-width:118px}
.hstat b{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hstat b svg.ic{width:22px;height:22px;color:var(--gold)}
.hstat span{display:block;font-size:13px;color:var(--hero-sub)}
.lane-lab{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin:0 0 8px}
.lane-lab b{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.lane{height:14px;border-radius:999px;background:var(--hero-lane);overflow:hidden;position:relative}
.lane span{display:block;height:100%;background:var(--hero-fill);border-radius:999px}
.hero-note{margin:8px 0 0;font-size:14px;color:var(--hero-sub)}
.hero .goal-form{display:flex;flex-wrap:wrap;gap:8px;max-width:none;margin-top:14px}
.hero .goal-form input{width:auto;flex:0 1 220px;border:0}
.hero .goal-form .btn{border:0}
.hero .goal-form .btn.primary{background:var(--hero-fill);color:var(--hero)}
[data-theme="dark"] .hero .goal-form .btn.primary{color:var(--accent-ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero .goal-form .btn.primary{color:var(--accent-ink)} }
.hero .goal-form .btn:not(.primary){background:var(--hero-tint);color:var(--hero-ink)}

.today{list-style:none;margin:0 0 36px;padding:0;display:grid;gap:10px}
.task{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 14px 14px 16px}
.task-ic{flex:none;width:44px;height:44px;border-radius:var(--r-m);background:var(--soft);color:var(--accent-text);display:grid;place-items:center}
.task.done .task-ic{background:var(--accent);color:var(--accent-ink)}
.task-tx{flex:1;min-width:0}
.task-tx b{display:block;font-size:17px;line-height:1.3}
.task-tx span{display:block;color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.task.done .task-tx b{color:var(--muted)}
.task .btn{flex:none;min-height:44px;padding:10px 16px}
.task.lead-task{padding:18px 18px 18px 18px;border-width:2px;border-color:var(--accent)}
.sess-task{align-items:flex-start}
.grp-rows{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.grp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border-radius:var(--r-m);padding:8px 8px 8px 14px;min-height:52px}
.gr-t{min-width:0}
.gr-t b{display:inline;font-size:15px;margin-right:8px}
.gr-t span{display:inline;color:var(--muted);font-size:14px}
.grp-row.done .gr-t b{color:var(--muted)}
.gr-ok{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none}
.gr-ok svg.ic{width:18px;height:18px}
.seg-n{display:inline-block;min-width:22px;padding:1px 7px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:18px}
.grp-seg{margin-bottom:14px}
@media (max-width:520px){ .task{gap:12px;padding:12px} .task-ic{width:40px;height:40px} .task .btn{padding:10px 14px} .sess-task .task-ic{display:none} .gr-t b,.gr-t span{display:block} }

.next-ach{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.next-ach > div{flex:1;min-width:0}
.next-ach b{display:block}
.next-ach p{margin:2px 0 8px;color:var(--muted);font-size:14px}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.recent li{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;font-size:14px;font-weight:700}
.medal{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.medal svg.ic{width:18px;height:18px}
.medal.off{background:none;border:2px dashed var(--line);color:var(--muted)}
.more{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px}
.more h3{margin:0}
.more .linkbtn{color:var(--accent-text);font-weight:700;opacity:1}

/* ---------- Réviser ---------- */
.fdd{margin:-6px 0 18px}
.fdd summary{list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:700;cursor:pointer;max-width:100%}
.fdd summary::-webkit-details-marker{display:none}
.fdd summary svg.ic{width:18px;height:18px}
.fdd summary .fsum{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fdd[open] summary{border-color:var(--ink)}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px;margin:12px 0 0}
.fbar label{font-size:14px}
.sess{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;margin:0 0 8px}
.sess b{font-family:var(--f-display);font-weight:700}
.sess span{color:var(--muted);font-variant-numeric:tabular-nums}
.sess-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 16px}
.band-r{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px;white-space:nowrap}
.sess-bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.bristol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 24px 30px;box-shadow:0 22px 44px -32px var(--shadow);min-height:260px;margin:0}
.band{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 22px}
.period{font-size:13px;font-weight:700;color:var(--accent-text);background:var(--soft);padding:5px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.q{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.28;letter-spacing:-.015em;margin:0;text-wrap:pretty}
.reveal{margin-top:24px;padding-top:22px;border-top:2px dashed var(--line);animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.reveal{animation:none}.sess-bar span{transition:none}}
.a{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.3;color:var(--accent-text);margin:0}
.x{color:var(--muted);margin:10px 0 0;max-width:62ch}
.boxes{display:inline-flex;gap:4px;align-items:center;flex:none}
.boxes i{width:16px;height:6px;border-radius:3px;background:var(--line);display:block}
.boxes i.on{background:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grade{min-height:64px;border:0;flex-direction:column;gap:4px;font-size:17px}
.grade.bad{background:var(--bad-soft);color:var(--bad)}
.grade.mid{background:var(--mid-soft);color:var(--mid)}
.grade.good{background:var(--ok-soft);color:var(--ok)}
.grade:hover{filter:brightness(.97)}
.first-hint{background:var(--soft);border-radius:var(--r-m);padding:12px 16px;margin:0 0 16px;font-size:15px;max-width:none}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:28px 24px}
.empty h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 18px;max-width:60ch}
.meta{color:var(--muted);font-size:14px;margin:0 0 10px}

/* ---------- Listes (paquet) ---------- */
.group{margin:0 0 32px}
.group .gsub{color:var(--muted);font-size:14px;margin:-6px 0 8px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ip{grid-column:1;font-size:13px;font-weight:700;color:var(--accent-text)}
.item .iq{grid-column:1;font-weight:700;min-width:0}
.item .ia{grid-column:1;color:var(--muted);font-size:15px;min-width:0}
.item .is{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.due{font-size:13px;color:var(--muted);white-space:nowrap}
.due.now{color:var(--bad);font-weight:700}
.confirm{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.src{display:grid;gap:4px;margin-top:12px;font-size:13px;color:var(--muted);max-width:65ch}
.src a{color:var(--accent-text)}
.src .unv{color:var(--warn)}
.src .linkbtn{font-size:13px;margin-left:4px;min-height:24px}
.ref-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ref-edit input{flex:1 1 220px;width:auto;padding:8px 10px;min-height:38px;font-size:14px}
.item .ia .src{margin-top:6px}

/* ---------- S'entraîner ---------- */
.scoreline{color:var(--muted);font-size:14px;margin:0 0 12px}
.era-chips{margin-bottom:16px}
.frise-list{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.fr-item{appearance:none;width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--ink);cursor:pointer;min-height:56px}
.fr-item[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.badge{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}
.fr-item[aria-pressed="true"] .badge{border:0;background:var(--accent);color:var(--accent-ink)}
.fr-res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.yr{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent-text);grid-row:1 / span 2;font-variant-numeric:tabular-nums}
.verdict{font-size:13px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--bad)}
.bristol.qui{min-height:180px}
.qui-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.qopt{justify-content:flex-start;text-align:left}
.qopt:disabled{opacity:1;cursor:default}
.qopt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.sj-notes{min-height:140px;margin-top:16px}
.sj-notes.intro{min-height:240px}
.sj-help{color:var(--muted);font-size:14px;margin:12px 0 0;max-width:62ch}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:18px 0 6px}
.tmr{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:4.5ch}
.tmr.over{color:var(--bad)}
fieldset.grid-chk{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:10px 16px 12px;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px}
fieldset.grid-chk legend{font-weight:700;padding:0 6px}
label.chk{display:flex;gap:10px;align-items:center;min-height:42px;font-weight:400;margin:0;cursor:pointer}
label.chk input{width:20px;height:20px;min-height:0;flex:none;margin:0;padding:0;accent-color:var(--accent)}
.code-form{display:grid;gap:6px;max-width:520px}
.code-form label{font-size:15px}
.code-form input{flex:1 1 200px;width:auto}
.fb{margin-top:16px}
.fb-out{margin-top:14px;max-width:65ch}
.fb-label{color:var(--muted);font-size:14px;font-weight:700;margin:0 0 8px}
.fb-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.fb-body h4{font-family:var(--f-display);font-weight:700;font-size:18px;margin:14px 0 4px}
.fb-body h4:first-child{margin-top:0}
.fb-body ul{margin:0;padding-left:20px}
.fb-body li{margin:3px 0}
.fb-body p{margin:4px 0}
.fb-note{color:var(--muted);font-size:14px;margin:8px 0 0}

/* ---------- Apprendre : fils rouges ---------- */
.fil-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fil-card{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-l);padding:18px;cursor:pointer;display:grid;gap:8px;align-content:start}
.fil-card:hover{border-color:var(--accent)}
.fil-card h3{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.015em;line-height:1.2;margin:0}
.fil-card p{margin:0;color:var(--muted);font-size:15px}
.fil-card .num{font-size:13px;color:var(--accent-text);font-weight:700}
.fil-head h3{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:4px 0 8px;text-wrap:balance}
.fil-q{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.3;color:var(--accent-text);margin:0 0 12px;max-width:60ch}
.fil-intro{margin:0 0 24px;max-width:65ch}
.tl{list-style:none;margin:0 0 28px;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:4.6em;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:0 18px;align-items:start;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:calc(4.6em - 5px);top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl .yr{grid-row:auto;font-size:16px;padding-top:2px}
.tl .tx{padding-left:6px}
.fil-sect{margin:0 0 24px;max-width:65ch}
.fil-sect h4{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 8px}
.fil-sect ul{margin:0;padding-left:20px}
.fil-sect li{margin:4px 0}

/* ---------- Références ---------- */
.rf-bar{display:grid;gap:12px;margin:0 0 10px}
.rf-bar input{max-width:560px}
.rf-count{color:var(--muted);font-size:14px;margin:0 0 14px}
.ref-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.ref-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ref-h b{font-size:17px}
.ref-y{font-family:var(--f-display);font-weight:800;color:var(--accent-text);font-variant-numeric:tabular-nums}
.ref-t{font-style:italic;margin:2px 0 8px}
.ref p{max-width:72ch}
.ref > p:not(.ref-t){margin:0 0 6px;color:var(--muted)}
.ref-us span{font-weight:700;color:var(--ink)}
.quote{margin:12px 0 10px;padding:12px 16px;background:var(--soft);border-radius:var(--r-m)}
.quote blockquote{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.4}
.quote figcaption{margin-top:6px;font-size:13px;color:var(--muted)}
.quote figcaption a{color:var(--accent-text)}
.quote .opt{margin:6px 0 0;font-size:14px}
.deck-actions{margin:0 0 18px}
.sect-h{font-family:var(--f-display);font-weight:700;font-size:22px;margin:4px 0 16px}
.qod blockquote{margin:0 0 8px;font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.4}
.qod-a{margin:0;font-size:13px;color:var(--muted)}
@media (min-width:1100px){ .ref-list{grid-template-columns:repeat(2,minmax(0,1fr))} }

.sj-epr{max-width:600px}
.sj-epr button{white-space:nowrap}
.sj-ctx{margin:16px 0 0;display:grid;gap:4px 14px;grid-template-columns:auto minmax(0,1fr);font-size:15px}
.sj-ctx dt{font-weight:700;color:var(--accent-text);white-space:nowrap}
.sj-ctx dd{margin:0 0 6px;color:var(--ink)}
@media (max-width:520px){ .sj-ctx{grid-template-columns:1fr} .sj-ctx dd{margin-bottom:10px} }
/* ---------- Favoris, notes, recherche, premier lancement ---------- */
.star{appearance:none;border:0;background:none;color:var(--muted);width:40px;height:40px;margin:-8px -8px -8px 0;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.star svg.ic{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--gold)}
.star[aria-pressed="true"] svg.ic{fill:currentColor}
.star:hover{background:var(--chip)}
.item .is .star{margin:-8px -8px 0 0}
.cn-edit{display:grid;gap:6px;max-width:560px}
.cn-edit textarea{min-height:70px;font-size:14px}
.cn-txt{color:var(--ink);white-space:pre-line}
.deck-search{margin:0 0 14px}
.deck-search input{max-width:560px}
.w-onb{margin:0 0 18px}
.w-conc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 10px}
.w-conc .btn{flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px}
.w-conc .btn span{font-weight:400;font-size:13px;color:var(--muted)}
.w-mine{margin:0 0 16px;font-size:15px}
/* ---------- Méthode ---------- */
.steps{list-style:none;counter-reset:st;margin:0 0 28px;padding:0;display:grid;gap:10px}
.step{counter-increment:st;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px 14px 64px}
.step::before{content:counter(st);position:absolute;left:18px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.step b{display:block;font-size:17px;margin-bottom:4px}
.step p{margin:0 0 6px;max-width:75ch}
.step-p{color:var(--bad);font-size:14px}
.me-fam{margin:4px 0 16px}
.jury-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.jury-list li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px}
.jury-list p{margin:0 0 4px;max-width:78ch}
.jury-list span{font-size:13px;color:var(--accent-text);font-weight:700}
.time-list{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px}
.time-list li{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px}
.time-list span{color:var(--muted);font-size:15px}
@media (max-width:520px){ .step{padding:14px 14px 12px 56px} .step::before{left:14px} }
#panel-methode > .chips:first-child{margin-bottom:18px}
/* ---------- Annales ---------- */
.ann-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ann{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.ann-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 10px}
.ann-y{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.ann-e{font-size:13px;font-weight:700;color:var(--muted)}
.ann-t{margin:0 0 8px;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.45;max-width:78ch;white-space:pre-line}
.ann-more summary,.ann-jury summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent-text);margin:4px 0}
.ann-jury ul{margin:8px 0 4px;padding-left:20px;color:var(--muted);max-width:78ch}
.ann-jury li{margin:4px 0}
.ann-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px;font-size:14px}
.ann-f a{color:var(--accent-text)}
.ann-f .btn{margin-left:auto}
@media (max-width:520px){ .ann-f .btn{margin-left:0;width:100%} }

/* ---------- Concours ---------- */
.conc-card{position:relative}
.conc-card.is-mine{border-color:var(--accent);border-width:2px}
.mine-badge{justify-self:start;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:999px}
.conc-maj{color:var(--muted);font-size:13px;margin:16px 0 0;max-width:70ch}
.conc-note{background:var(--soft);border-radius:var(--r-m);padding:12px 16px;margin:0 0 16px;max-width:none}
.conc-actions{margin:0 0 20px}
.conc-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 32px}
.conc-facts div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px}
.conc-facts dt{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 4px}
.conc-facts dd{margin:0;font-size:15px}
.ep-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;display:grid;gap:4px;justify-items:start}
.ep b{font-size:17px;line-height:1.3}
.ep-m{font-size:14px;font-weight:700;color:var(--accent-text)}
.ep p{margin:2px 0 6px;color:var(--muted);max-width:70ch}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.prog h4{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3;margin:0 0 8px}
.prog ol{margin:0;padding-left:22px}
.prog li{margin:3px 0}
.apsa{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 16px}
.apsa summary{font-weight:700;cursor:pointer}
.apsa p{margin:10px 0 0;color:var(--muted)}
.conc-src{margin:0;padding-left:20px}
.conc-src li{margin:4px 0}
.conc-src a{color:var(--accent-text)}
.hero-c{margin:0 0 10px;font-weight:700;font-size:15px;color:var(--hero-sub)}
@media (min-width:1100px){ .ep-list{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- Progrès ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;background:var(--surface)}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px}
.rd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px 22px 20px}
.rd-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.rd-pct b{display:block;font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rd-pct span{color:var(--accent-text);font-weight:700}
.rd-main{flex:1 1 240px;min-width:0}
.rd .goal-bar{height:10px;border-radius:999px;background:var(--seg-e);overflow:hidden;margin:0 0 8px}
.rd .goal-bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.goal-sub{font-size:14px;color:var(--muted);margin:0}
.rd-rows{display:grid;gap:8px}
.rd-h{margin:14px 0 2px;font-family:var(--f-display);font-weight:700;font-size:15px}
.rd-rows .rd-h:first-child,.sect > .rd-h:first-of-type{margin-top:0}
.rd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,2fr) 3.5em;gap:12px;align-items:center;font-size:14px}
.rd-row b{font-family:var(--f-display);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rd-bar,.ach-bar{display:block;height:6px;border-radius:999px;background:var(--seg-e);overflow:hidden}
.rd-bar span,.ach-bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.ach-n{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--muted);margin-left:8px}
.ach-h{margin:18px 0 8px;font-size:15px;color:var(--muted);font-weight:700}
.ach-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ach{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px;background:var(--surface)}
.ach > div{flex:1;min-width:0}
.ach b{display:block}
.ach p{margin:2px 0 6px;font-size:14px;color:var(--muted)}
.ach-ic{flex:0 0 30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.ach.on{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.ach.on .ach-ic{border:0;background:var(--gold);color:var(--gold-ink)}
.ach:not(.on) b{color:var(--muted)}
.ach-st{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.ach.on .ach-st{color:var(--gold-text);font-weight:700}
.hm-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hm-days{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10px;color:var(--muted);line-height:14px}
.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.hm-cell{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--hm0)}
.hm-1{background:var(--hm1)} .hm-2{background:var(--hm2)} .hm-3{background:var(--hm3)} .hm-4{background:var(--hm4)}
.hm-out{background:transparent}
.hm-legend{align-items:center;gap:4px 6px;margin-top:10px}
.hm-legend .hm-cell{width:12px;height:12px}
.hm-kpis{margin-bottom:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 16px}
.legend{color:var(--muted);font-size:13px;margin:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.sw.m{background:var(--seg-m)} .sw.c{background:var(--seg-c)} .sw.e{background:var(--seg-e)}
.srow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 0}
.srow .lab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:15px}
.srow .num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:2px;height:10px}
.bar span{display:block;min-width:4px;height:100%}
.bar span:first-child{border-radius:999px 0 0 999px} .bar span:last-child{border-radius:0 999px 999px 0} .bar span:only-child{border-radius:999px}

/* ---------- Bienvenue, aide et compte ---------- */
.welcome{margin:0 0 28px;padding:24px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface)}
.welcome h2{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.welcome .w-lead{margin:0 0 18px;color:var(--muted);max-width:62ch}
.w-spaces{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 20px;padding:0;list-style:none}
.w-space{display:grid;gap:4px;align-content:start;padding:14px 16px;border-radius:var(--r-m);background:var(--paper)}
.w-space b{font-size:16px}
.w-space span{color:var(--muted);font-size:14px}
.w-steps{margin:0 0 20px;padding-left:22px;max-width:62ch}
.w-steps li{margin:4px 0}
.w-sub{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 10px}
.w-cols{display:grid;gap:0 40px}
@media (min-width:1100px){ .w-cols{grid-template-columns:1fr 1fr} .w-spaces{grid-template-columns:repeat(5,minmax(0,1fr))} }
.w-note{font-size:14px;color:var(--muted);margin:0 0 18px;max-width:62ch}
.acct-form{display:grid;gap:14px;max-width:440px;margin-top:4px}
.acct-msg{margin:0;font-size:15px}
.acct-msg.bad{color:var(--bad)} .acct-msg.ok{color:var(--ok)}
.rk{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;padding:14px 16px;border:2px dashed var(--accent);border-radius:var(--r-m);margin:0 0 16px;word-break:break-all;user-select:all}
.g-wrap{max-width:440px;margin:4px 0 6px}
a.g-btn{text-decoration:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-m);font-size:15px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px var(--shadow)}
@media (min-width:960px){ .toast{bottom:24px;left:calc(50% + 124px)} }

/* ---------- Texte plus grand ---------- */
html.big body{font-size:18px}
html.big .q{font-size:29px} html.big .a{font-size:24px} html.big .x{font-size:18px}
html.big .lead,html.big .intro,html.big .hint,html.big .item .ia,html.big .task-tx span,html.big .hero-date{font-size:17px}
html.big .chip,html.big .fbar label,html.big .nav-btn{font-size:15px}
@media (min-width:960px){ html.big .nav-btn{font-size:18px} }

@media (max-width:520px){
  .page-h{font-size:30px}
  .bristol{padding:18px 18px 24px;border-radius:var(--r-l)}
  .q{font-size:22px} .a{font-size:20px}
  html.big .q{font-size:24px} html.big .a{font-size:21px}
  .grades .k{display:none}
  .seg button{font-size:14px;padding:6px 4px;white-space:nowrap}
  .band{align-items:flex-start}
  .period{white-space:normal;border-radius:12px}
  .hero{padding:20px 18px 18px}
}

<script>
const BASE = [
/* ---------- Avant 1880 ---------- */
{id:"n02",th:"R",p:"Avant 1880",q:"Que prévoit la loi Falloux (1850) pour la gymnastique ?",a:"Elle en fait une matière facultative de l'enseignement primaire.",x:"Première inscription de la gymnastique dans les textes scolaires, sans obligation."},
{id:"n03",th:"R",p:"Avant 1880",q:"Quel décret de 1869 rend la gymnastique obligatoire dans l'enseignement secondaire ?",a:"Le décret Duruy du 3 février 1869.",x:"Victor Duruy, ministre de l'Instruction publique, agit dans un contexte de rivalité avec la Prusse."},
{id:"n04",th:"R",p:"Avant 1880",q:"Quel certificat, créé en 1869, devient obligatoire en 1908 pour enseigner la gymnastique en collège et lycée ?",a:"Le CAEG, certificat d'aptitude à l'enseignement de la gymnastique.",x:"Premier diplôme d'État pour les maîtres de gymnastique."},
{id:"b03",th:"R",p:"Avant 1880",q:"Quelle école, fondée en 1852, devient le centre de la gymnastique militaire en France ?",a:"L'École normale militaire de gymnastique de Joinville-le-Pont.",x:"Elle devient l'École supérieure d'éducation physique (ESEP) en 1925 et élabore la « méthode française »."},
{id:"b04",th:"G",p:"Avant 1880",q:"Qui fonde en France, au début du XIXe siècle, une gymnastique à visée militaire et morale ?",a:"Francisco Amoros.",x:"Gymnastique utilitaire et patriotique, avec agrès et chants, développée à Paris sous la Restauration."},
{id:"b05",th:"G",p:"Avant 1880",q:"Quel courant étranger fonde la gymnastique sur l'anatomie et la physiologie ?",a:"La gymnastique suédoise de Pehr Henrik Ling.",x:"Institut central de gymnastique de Stockholm (1813) ; exercices analytiques et correctifs, diffusés en France notamment par Philippe Tissié."},
{id:"n01",th:"D",p:"Avant 1880",q:"Quel modèle de gymnastique est associé à Friedrich Ludwig Jahn ?",a:"Le Turnen allemand, une gymnastique aux agrès à visée patriotique.",x:"Après 1870, ce modèle « de l'ennemi » est discuté en France face à la gymnastique suédoise."},

/* ---------- 1880-1918 ---------- */
{id:"b01",th:"R",p:"1880-1918",q:"Quelle loi rend la gymnastique obligatoire dans tous les établissements publics d'enseignement de garçons en 1880 ?",a:"La loi George (27 janvier 1880).",x:"Après la défaite de 1870, l'école doit former des citoyens-soldats ; la loi s'inscrit dans l'œuvre scolaire de Jules Ferry."},
{id:"n05",th:"T",p:"1880-1918",q:"Quelle loi de 1882 inscrit la gymnastique parmi les matières de l'enseignement primaire obligatoire ?",a:"La loi Ferry du 28 mars 1882.",x:"La gymnastique et, pour les garçons, les exercices militaires figurent au programme de l'école primaire."},
{id:"b02",th:"T",p:"1880-1918",q:"Que sont les bataillons scolaires créés en 1882 ?",a:"Des unités d'élèves pratiquant l'exercice militaire et le maniement d'armes.",x:"Visée patriotique de revanche ; ils déclinent rapidement dans les années 1890."},
{id:"n08",th:"T",p:"1880-1918",q:"Que prévoit le décret du 18 janvier 1882 pour les filles ?",a:"Il rend l'éducation physique obligatoire pour elles, mais reste peu appliqué.",x:"Il faut attendre le décret du 25 mars 1924 pour aligner l'enseignement des filles sur celui des garçons."},
{id:"n103",th:"T",p:"1880-1918",q:"Que crée la loi Camille Sée (1880) ?",a:"Les lycées de jeunes filles.",x:"Point de départ de l'enseignement secondaire public pour les filles."},
{id:"n06",th:"T",p:"1880-1918",q:"Comment évoluent les manuels officiels de gymnastique scolaire entre 1880 et 1891 ?",a:"D'un manuel de gymnastique et d'exercices militaires (1880) à un manuel qui fait une place aux jeux scolaires (1891).",x:"La gymnastique scolaire s'éloigne du modèle militaire pour une visée plus hygiénique et ludique."},
{id:"n81",th:"G",p:"1880-1918",q:"Quel objectif hygiéniste domine l'éducation physique de la fin du XIXe siècle ?",a:"Préserver et fortifier la santé de l'enfant face au surmenage scolaire.",x:"Des médecins comme Fernand Lagrange et Philippe Tissié veulent doser l'effort."},
{id:"n13",th:"G",p:"1880-1918",q:"Quel ouvrage de Fernand Lagrange (1888) fonde la physiologie de l'exercice en France ?",a:"Physiologie des exercices du corps.",x:"Le médecin étudie la fatigue, l'essoufflement et les effets de l'exercice, et défend les jeux de plein air."},
{id:"n14",th:"G",p:"1880-1918",q:"Quel physiologiste italien publie La fatigue (1891) ?",a:"Angelo Mosso.",x:"Il mesure la fatigue musculaire avec un appareil qu'il a conçu, l'ergographe."},
{id:"n15",th:"G",p:"1880-1918",q:"Quel ouvrage de Philippe Tissié (1897) relie fatigue et entraînement ?",a:"La fatigue et l'entraînement physique.",x:"L'hygiéniste cherche à doser l'effort pour éviter le surmenage."},
{id:"b08",th:"G",p:"1880-1918",q:"Quelle technique Étienne-Jules Marey met-il au point pour analyser le mouvement ?",a:"La chronophotographie.",x:"À la Station physiologique (1882), le mouvement devient un objet d'étude scientifique."},
{id:"b07",th:"G",p:"1880-1918",q:"Quel collaborateur de Marey défend une éducation physique rationnelle, fondée sur la science ?",a:"Georges Demenÿ.",x:"Auteur des Bases scientifiques de l'éducation physique (1902) ; il dirige à partir de 1903 un cours supérieur d'éducation physique."},
{id:"n12",th:"G",p:"1880-1918",q:"Que reproche Demenÿ à la gymnastique suédoise ?",a:"D'être trop statique et analytique ; il prône des mouvements complets, continus et arrondis.",x:"Il recherche l'économie de l'effort et la beauté du geste."},
{id:"n16",th:"G",p:"1880-1918",q:"Quelle est la première grande œuvre de Georges Hébert (1907) ?",a:"L'Éducation physique raisonnée.",x:"Officier de marine, Hébert s'inspire de la vigueur de peuples vivant au contact de la nature, observés lors de ses voyages."},
{id:"n17",th:"G",p:"1880-1918",q:"Que propose Hébert dans Le Code de la force (1911) ?",a:"Une mesure pratique de la force physique et de ses éléments constitutifs.",x:"Il veut évaluer la valeur physique globale par des épreuves concrètes."},
{id:"b10",th:"G",p:"1880-1918",q:"Quelle méthode Georges Hébert propose-t-il, et quelle est sa devise ?",a:"La méthode naturelle ; devise : « Être fort pour être utile ».",x:"Exposée dès 1912 et développée au collège d'athlètes de Reims, fondé en 1913 par le marquis de Polignac."},
{id:"b11",th:"G",p:"1880-1918",q:"Citez les dix familles d'exercices de la méthode naturelle.",a:"Marche, course, saut, quadrupédie, grimper, équilibrisme, lever, lancer, défense, natation.",x:"Des gestes utiles, pratiqués de préférence en milieu naturel."},
{id:"n18",th:"G",p:"1880-1918",q:"Pourquoi le collège d'athlètes de Reims est-il créé en 1913 ?",a:"Pour préparer des athlètes français aux Jeux olympiques de Berlin prévus en 1916.",x:"Le collège est détruit pendant la Première Guerre mondiale."},
{id:"n84",th:"D",p:"1880-1918",q:"Quelles grandes options s'affrontent en France vers 1890 ?",a:"La gymnastique (militaire ou suédoise), les sports athlétiques anglais (Coubertin) et les jeux traditionnels (Grousset, Tissié).",x:"Un débat sur la meilleure façon d'éduquer physiquement la jeunesse française."},
{id:"n83",th:"D",p:"1880-1918",q:"Pourquoi la gymnastique suédoise séduit-elle les hygiénistes français ?",a:"Parce qu'elle se veut fondée sur l'anatomie et la physiologie, avec des exercices dosés et correctifs.",x:"Elle s'oppose à la gymnastique aux agrès, jugée acrobatique, et à la compétition sportive."},
{id:"b06",th:"D",p:"1880-1918",q:"Quel médecin bordelais promeut la gymnastique suédoise et fonde la Ligue girondine d'éducation physique (1888) ?",a:"Philippe Tissié.",x:"Il s'oppose à la compétition et au surmenage ; ses lendits, lancés en 1890, sont interdits par le ministère en 1907."},
{id:"n82",th:"T",p:"1880-1918",q:"Qu'est-ce qu'un lendit ?",a:"Une grande rencontre scolaire de jeux et d'exercices physiques.",x:"Philippe Tissié organise le premier en 1890 dans la région bordelaise."},
{id:"n09",th:"D",p:"1880-1918",q:"Qui fonde en 1888 la Ligue nationale de l'éducation physique ?",a:"Paschal Grousset, ancien communard.",x:"Il défend des jeux traditionnels français, contre les sports anglais promus par Coubertin."},
{id:"n10",th:"D",p:"1880-1918",q:"Sur quoi porte l'opposition entre Tissié et Coubertin ?",a:"Sur la compétition : Tissié, hygiéniste, la juge dangereuse ; Coubertin défend le sport et sa liberté d'excès.",x:"Leur correspondance s'étend de 1889 à 1915."},
{id:"n11",th:"T",p:"1880-1918",q:"Quel comité Coubertin crée-t-il en 1888 ?",a:"Un comité pour la propagation des exercices physiques dans l'éducation.",x:"Objectif : introduire les sports athlétiques dans les lycées français."},
{id:"b09",th:"D",p:"1880-1918",q:"Quel rôle joue Pierre de Coubertin à la fin du XIXe siècle ?",a:"Il rénove les Jeux olympiques : projet annoncé à la Sorbonne (1892), CIO créé en 1894, premiers Jeux à Athènes (1896).",x:"Il s'inspire du sport scolaire anglais de Thomas Arnold (collège de Rugby) et préside le CIO de 1896 à 1925."},

/* ---------- 1918-1945 ---------- */
{id:"n20",th:"R",p:"1918-1945",q:"À quel ministère le service de l'éducation physique est-il rattaché en 1922 ?",a:"Au ministère de l'Instruction publique.",x:"Entre les deux guerres, l'éducation physique oscille entre tutelles militaire, sanitaire et scolaire."},
{id:"n96",th:"T",p:"1918-1945",q:"Quel texte de 1923 officialise la pratique sportive à l'école ?",a:"La circulaire du 13 janvier 1923.",x:"Le sport fait son entrée officielle dans les établissements scolaires."},
{id:"n95",th:"T",p:"1918-1945",q:"Quels textes organisent l'éducation physique à l'école primaire en 1923 et 1938 ?",a:"Des Instructions officielles pour l'enseignement primaire (1923), prolongées en 1938.",x:"En 1938, le plein air prend une place importante dans l'horaire."},
{id:"n23",th:"T",p:"1918-1945",q:"Que décide le décret du 25 mars 1924 ?",a:"Il aligne l'enseignement de l'éducation physique des filles sur celui des garçons.",x:"Il reprend une obligation posée en 1882 mais restée peu appliquée."},
{id:"n24",th:"T",p:"1918-1945",q:"Quel ouvrage d'Hébert (1919) porte sur l'éducation physique des femmes ?",a:"L'Éducation physique féminine. Muscle et beauté plastique.",x:"Il applique la méthode naturelle aux femmes, en y associant santé et esthétique."},
{id:"n25",th:"T",p:"1918-1945",q:"Quelle pionnière promeut une gymnastique féminine dite harmonique ?",a:"Irène Popard.",x:"Une gymnastique en musique, qui mêle rythme, souplesse et expression."},
{id:"n21",th:"T",p:"1918-1945",q:"Quel texte de 1925 constitue la « méthode française » ?",a:"Le Règlement général d'éducation physique, élaboré à Joinville.",x:"Une méthode éclectique, issue de projets publiés de 1919 à 1922 par le ministère de la Guerre."},
{id:"n22",th:"T",p:"1918-1945",q:"Quel horaire l'arrêté de 1925 fixe-t-il dans le secondaire ?",a:"Deux heures d'éducation physique par semaine, plus une après-midi de plein air.",x:"Le plein air devient une composante régulière de l'horaire."},
{id:"b12",th:"D",p:"1918-1945",q:"Quel ouvrage d'Hébert (1925) critique les dérives du sport ?",a:"Le Sport contre l'Éducation physique.",x:"Il reproche au sport la spécialisation, la recherche du record et le spectacle."},
{id:"n26",th:"R",p:"1918-1945",q:"Où est créé en 1927 le premier institut régional d'éducation physique (IREP) ?",a:"À Bordeaux, rattaché à la faculté de médecine.",x:"Les IREP forment des enseignants dans une approche dominée par la médecine."},
{id:"n97",th:"R",p:"1918-1945",q:"Quelle fédération sportive laïque naît des amicales laïques à la fin des années 1920 ?",a:"L'UFOLEP.",x:"Une fédération multisport liée à la Ligue de l'enseignement."},
{id:"n27",th:"R",p:"1918-1945",q:"Quelle école et quel diplôme sont créés en 1933 pour former les professeurs ?",a:"L'École normale d'éducation physique (ENEP) et le CAPEP.",x:"Le CAPEPS lui succède en 1941 ; à la Libération, l'école devient deux ENSEP (garçons et filles)."},
{id:"b13",th:"T",p:"1918-1945",q:"Qui est sous-secrétaire d'État aux Sports et à l'Organisation des loisirs sous le Front populaire ?",a:"Léo Lagrange (1936).",x:"Il démocratise le sport et les loisirs et crée le Brevet sportif populaire (1937)."},
{id:"n101",th:"R",p:"1918-1945",q:"Quelles mesures sociales de 1936 favorisent l'essor des loisirs sportifs ?",a:"Les congés payés et la semaine de 40 heures.",x:"Le temps libre ouvre le sport et le plein air aux classes populaires."},
{id:"n29",th:"G",p:"1918-1945",q:"Qu'est-ce que le Brevet sportif populaire (1937) ?",a:"Un brevet d'épreuves physiques accessible à tous, symbole du sport de masse du Front populaire.",x:"Vichy le transforme en Brevet sportif national en 1941."},
{id:"b14",th:"T",p:"1918-1945",q:"Quel ministre lance en 1937 l'expérience des loisirs dirigés à l'école ?",a:"Jean Zay.",x:"Un arrêté de 1937 ajoute une demi-journée de plein air à l'horaire hebdomadaire."},
{id:"n31",th:"R",p:"1918-1945",q:"Que décide Jean Zay en 1938 pour le sport scolaire du secondaire ?",a:"Il ouvre l'Office du sport universitaire aux élèves du secondaire et du technique : c'est l'OSSU.",x:"Le sport scolaire du secondaire se structure à l'échelle nationale."},
{id:"n30",th:"R",p:"1918-1945",q:"Quel ministre crée l'USEP en 1939 ?",a:"Jean Zay, par décret du 1er février 1939.",x:"L'Union sportive de l'enseignement du premier degré organise le sport à l'école primaire."},
{id:"b15",th:"R",p:"1918-1945",q:"Sous Vichy, qui dirige l'éducation générale et sportive (EGS) ?",a:"Jean Borotra, commissaire général (1940-1942).",x:"L'EGS sert un projet de « redressement » moral et physique ; le colonel Pascot lui succède en 1942."},
{id:"n32",th:"R",p:"1918-1945",q:"Qu'est-ce que la Charte des sports (décembre 1940) ?",a:"Le texte par lequel Vichy place le mouvement sportif sous le contrôle de l'État.",x:"Les fédérations doivent être agréées par le pouvoir."},
{id:"n33",th:"T",p:"1918-1945",q:"Quelle épreuve est introduite au baccalauréat en 1941 ?",a:"Une épreuve facultative d'éducation physique.",x:"Elle devient obligatoire en 1959."},
{id:"n34",th:"D",p:"1918-1945",q:"Quelle conception défend Maurice Baquet ?",a:"L'éducation sportive : faire du sport, enseigné méthodiquement, le moyen de l'éducation physique.",x:"Les stages de la FSGT lancés en 1965 à Sète portent son nom."},
{id:"n75",th:"G",p:"1918-1945",q:"Que montre Marcel Mauss dans « Les techniques du corps » (1934) ?",a:"Que les façons d'utiliser son corps (marcher, nager, courir) sont apprises et varient selon les sociétés.",x:"Le geste est un fait culturel transmis par l'éducation."},

/* ---------- 1945-1967 ---------- */
{id:"n35",th:"R",p:"1945-1967",q:"Quelle obligation pèse sur chaque établissement à partir de 1945 ?",a:"Créer une association sportive.",x:"En 1950, les enseignants obtiennent un forfait de trois heures pour l'animer."},
{id:"n36",th:"T",p:"1945-1967",q:"Quel horaire prévoient les Instructions officielles de 1945 ?",a:"Deux heures d'éducation physique et une demi-journée de plein air par semaine.",x:"Le plein air reste au cœur du projet éducatif de l'après-guerre."},
{id:"n37",th:"T",p:"1945-1967",q:"Qu'est-ce que l'expérience de Vanves (1950) ?",a:"Le mi-temps pédagogique et sportif du Dr Max Fourestier : la classe le matin, l'activité physique l'après-midi.",x:"Elle inspire plus tard le tiers-temps pédagogique à l'école primaire."},
{id:"n38",th:"R",p:"1945-1967",q:"Quelle revue professionnelle naît en 1950 à l'initiative de Jean Vivès ?",a:"Éducation physique et sport (la revue EP&S).",x:"Elle diffuse les savoirs techniques et pédagogiques des enseignants."},
{id:"n39",th:"T",p:"1945-1967",q:"Quand l'épreuve d'éducation physique devient-elle obligatoire au baccalauréat ?",a:"En 1959.",x:"Elle était facultative depuis 1941."},
{id:"n40",th:"T",p:"1945-1967",q:"Que change la circulaire du 1er juin 1961 ?",a:"La demi-journée de plein air devient une demi-journée de sport.",x:"Un signe de la sportivisation de l'EPS au début des années 1960."},
{id:"b16",th:"R",p:"1945-1967",q:"Quel événement sportif de 1960 déclenche une politique volontariste du sport en France ?",a:"Les Jeux olympiques de Rome, où la France ne remporte aucune médaille d'or.",x:"Maurice Herzog, haut-commissaire à la Jeunesse et aux Sports, développe le sport et les équipements."},
{id:"n41",th:"R",p:"1945-1967",q:"Que permettent les lois-programmes d'équipement des années 1960 ?",a:"Un vaste plan de construction d'équipements sportifs.",x:"La France devient l'un des pays les mieux équipés d'Europe, ce qui facilite l'entrée du sport à l'école."},
{id:"n42",th:"R",p:"1945-1967",q:"Quel organisme succède à l'OSSU en 1962 ?",a:"L'ASSU, Association du sport scolaire et universitaire.",x:"Elle sera remplacée par l'UNSS en 1975."},
{id:"n43",th:"D",p:"1945-1967",q:"Quelle commission publie en 1964 un Essai de doctrine du sport ?",a:"La Commission de la doctrine, présidée par Jean Borotra.",x:"Le texte défend une conception éducative du sport."},
{id:"n85",th:"D",p:"1945-1967",q:"Que désigne la « sportivisation » de l'EPS ?",a:"L'adoption des activités et des logiques sportives (règles, performance, compétition) comme contenus de l'EPS.",x:"Le mouvement s'accélère dans les années 1960 et culmine avec les Instructions de 1967."},
{id:"b18",th:"D",p:"1945-1967",q:"Quelle méthode Jean Le Boulch défend-il ?",a:"La psychocinétique (L'éducation par le mouvement, 1966).",x:"Il refuse le sport comme contenu exclusif et vise le développement psychomoteur global."},

/* ---------- 1967-1981 ---------- */
{id:"b17",th:"T",p:"1967-1981",q:"Quel texte de 1967 fait des activités sportives le support privilégié de l'EPS ?",a:"Les Instructions officielles du 19 octobre 1967.",x:"Le sport devient le contenu principal de l'EPS, avec une visée éducative."},
{id:"n44",th:"T",p:"1967-1981",q:"Quel horaire prévoient les Instructions officielles de 1967 ?",a:"Cinq heures : deux heures d'EP et une demi-journée de trois heures de sport.",x:"Un horaire ambitieux, rarement appliqué faute d'enseignants et d'équipements."},
{id:"n45",th:"T",p:"1967-1981",q:"Quel conseil Robert Mérand crée-t-il à la FSGT en 1967 ?",a:"Le Conseil pédagogique et scientifique (CPS) de la FSGT.",x:"Avec les stages Maurice Baquet, il porte une rénovation pédagogique des sports collectifs fondée sur l'activité de l'enfant."},
{id:"n51",th:"T",p:"1967-1981",q:"Qu'est-ce que le tiers-temps pédagogique (1969) ?",a:"Une organisation de l'école primaire : 15 h de disciplines fondamentales, 6 h d'éveil et 6 h d'éducation physique et sportive.",x:"Elle s'inscrit dans le prolongement de l'expérience de Vanves."},
{id:"n50",th:"T",p:"1967-1981",q:"Que fixe la circulaire Comiti de 1971 ?",a:"Trois heures d'EPS dans le premier cycle et deux heures dans le second cycle.",x:"Bien en deçà des cinq heures prévues en 1967."},
{id:"b19",th:"D",p:"1967-1981",q:"Quelle discipline Pierre Parlebas fonde-t-il ?",a:"La praxéologie motrice, science de l'action motrice.",x:"Concepts-clés : conduite motrice, logique interne, sociomotricité et psychomotricité."},
{id:"n47",th:"D",p:"1967-1981",q:"Quelle opposition structure le débat entre Parlebas et Le Boulch ?",a:"Sociomotricité (action en interaction avec autrui) contre psychomotricité centrée sur l'individu.",x:"Parlebas reproche à la psychomotricité d'ignorer la dimension relationnelle de l'action."},
{id:"b20",th:"D",p:"1967-1981",q:"Quel auteur porte la critique radicale du sport dans les années 1970 ?",a:"Jean-Marie Brohm.",x:"Avec la revue Quel corps ? (1975) et Sociologie politique du sport (1976), il analyse le sport comme un appareil idéologique au service du capitalisme."},
{id:"n49",th:"D",p:"1967-1981",q:"Que désigne la « crise d'identité » de l'EPS dans les années 1960-1970 ?",a:"Le débat sur sa place face au sport : se confondre avec l'initiation sportive ou garder une spécificité éducative.",x:"S'y affrontent conceptions sportive, psychomotrice, sociomotrice et critique."},
{id:"n86",th:"D",p:"1967-1981",q:"Quelle critique les défenseurs de la spécificité de l'EPS adressent-ils au sport ?",a:"Il sélectionne les meilleurs, spécialise trop tôt et ne garantit pas, à lui seul, une visée éducative.",x:"Au cœur des débats qui suivent les Instructions de 1967."},
{id:"b21",th:"R",p:"1967-1981",q:"Quelle loi de 1975 organise le développement de l'EPS et du sport ?",a:"La loi Mazeaud (29 octobre 1975).",x:"Elle crée notamment l'UNSS et l'INSEP."},
{id:"b22",th:"R",p:"1967-1981",q:"Quel organisme du sport scolaire est créé en 1975 ?",a:"L'UNSS, créée par la loi Mazeaud, qui succède à l'ASSU.",x:"Le sport scolaire du second degré s'organise autour des associations sportives d'établissement."},
{id:"n98",th:"R",p:"1967-1981",q:"Quel institut national est créé en 1975 pour le sport de haut niveau ?",a:"L'INSEP.",x:"Créé par la loi Mazeaud, comme l'UNSS."},
{id:"n52",th:"R",p:"1967-1981",q:"Quel diplôme universitaire est créé en 1975 ?",a:"Le DEUG STAPS.",x:"La formation à l'EPS entre à l'université ; la licence STAPS suit en 1977."},
{id:"b23",th:"T",p:"1967-1981",q:"Quelle réforme de 1975 crée le collège unique ?",a:"La réforme Haby.",x:"Le collège accueille tous les élèves : l'hétérogénéité devient un enjeu central pour l'EPS."},
{id:"n53",th:"T",p:"1967-1981",q:"Quelle loi de 1975 généralise la mixité dans les établissements scolaires ?",a:"La loi Haby.",x:"En EPS, la mixité s'impose progressivement et pose la question de l'égalité filles-garçons."},
{id:"n54",th:"D",p:"1967-1981",q:"Que provoque le plan Soisson de 1978 ?",a:"Une forte contestation : il réduit le forfait d'association sportive et impose des heures supplémentaires aux enseignants.",x:"Le forfait de trois heures est rétabli en 1981."},

/* ---------- 1981-2000 ---------- */
{id:"b24",th:"R",p:"1981-2000",q:"Quel changement institutionnel majeur concerne l'EPS en 1981 ?",a:"Son intégration au ministère de l'Éducation nationale (décret du 28 mai 1981).",x:"Elle relevait jusque-là de la Jeunesse et des Sports ; l'EPS devient une discipline scolaire à part entière."},
{id:"b25",th:"R",p:"1981-2000",q:"Quand l'agrégation d'EPS est-elle créée ?",a:"Par un arrêté de 1982 ; la première session a lieu en 1983.",x:"L'agrégation interne est créée en 1986, le CAPEPS interne en 1989."},
{id:"n55",th:"R",p:"1981-2000",q:"Que deviennent les UEREPS avec la loi Savary de 1984 ?",a:"Des UFR STAPS.",x:"La formation des enseignants d'EPS s'ancre dans l'université."},
{id:"b26",th:"R",p:"1981-2000",q:"Quelle loi de 1984 organise et promeut les activités physiques et sportives ?",a:"La loi Avice (16 juillet 1984).",x:"Elle structure notamment le mouvement sportif ; Edwige Avice est alors ministre de la Jeunesse et des Sports."},
{id:"n57",th:"T",p:"1981-2000",q:"Quand l'EPS devient-elle une épreuve obligatoire du premier groupe au baccalauréat ?",a:"En 1983.",x:"À partir de 1984, l'évaluation repose sur un contrôle en cours de formation."},
{id:"n56",th:"T",p:"1981-2000",q:"Quel texte de 1985 fixe les programmes et instructions du collège ?",a:"Les Instructions officielles de 1985 (arrêté du 14 novembre 1985).",x:"Elles prévoient 3 heures d'EPS au collège et 2 heures au lycée."},
{id:"n59",th:"T",p:"1981-2000",q:"Quels chercheurs de l'INRP développent la didactique de l'EPS dans les années 1980 ?",a:"Robert Mérand et Jacqueline Marsenach.",x:"Ils publient L'évaluation formative en EPS dans les collèges (1987)."},
{id:"n79",th:"G",p:"1981-2000",q:"Quelle publication de Mérand et Dhellemmes (1988) porte sur la santé ?",a:"Éducation à la santé : endurance aérobie, contribution de l'EPS.",x:"L'effort d'endurance devient un objet d'enseignement au service de la santé."},
{id:"n58",th:"T",p:"1981-2000",q:"Que précise le décret du 11 octobre 1988 ?",a:"Un certificat médical est nécessaire pour justifier une inaptitude à l'EPS ; dès 1989, il doit préciser si elle est totale ou partielle.",x:"La logique de l'inaptitude partielle ouvre la voie à une EPS adaptée plutôt qu'à la dispense."},
{id:"b27",th:"T",p:"1981-2000",q:"Quelle loi de 1989 place l'élève au centre du système éducatif ?",a:"La loi d'orientation Jospin (10 juillet 1989).",x:"Elle installe les cycles et les projets d'établissement."},
{id:"n60",th:"T",p:"1981-2000",q:"Quel horaire hebdomadaire les programmes de 1996 fixent-ils en 6e ?",a:"Quatre heures.",x:"Trois heures restent la norme de la 5e à la 3e."},
{id:"n61",th:"T",p:"1981-2000",q:"Quelle circulaire de 1996 encadre les sections sportives scolaires ?",a:"La circulaire du 13 décembre 1996.",x:"Une charte des sections sportives scolaires suit en 2002."},

/* ---------- Depuis 2000 ---------- */
{id:"n63",th:"T",p:"Depuis 2000",q:"Quel texte de 2000 promeut l'égalité filles-garçons à l'école ?",a:"Un texte intitulé « De la mixité à l'égalité », publié au Bulletin officiel en 2000.",x:"La mixité ne suffit pas : l'égalité devient un objectif explicite."},
{id:"b30",th:"T",p:"Depuis 2000",q:"Combien de domaines compte le socle commun de connaissances, de compétences et de culture (2015) ?",a:"Cinq.",x:"Il succède au socle commun de 2005, issu de la loi Fillon du 23 avril 2005."},
{id:"n64",th:"T",p:"Depuis 2000",q:"Quelles lois fondent l'école inclusive ?",a:"La loi du 11 février 2005 pour l'égalité des droits et des chances des personnes handicapées, puis la loi de refondation de l'école de 2013.",x:"En EPS, les élèves en situation de handicap sont scolarisés et évalués avec des adaptations."},
{id:"n65",th:"T",p:"Depuis 2000",q:"Combien de compétences propres à l'EPS comptent les programmes du collège de 2008 ?",a:"Quatre, auxquelles s'ajoutent des compétences méthodologiques et sociales.",x:"Au lycée, une cinquième compétence propre porte sur l'entretien de soi."},
{id:"n66",th:"T",p:"Depuis 2000",q:"Quelles sont les cinq compétences générales des programmes d'EPS de 2015 ?",a:"Développer sa motricité et s'exprimer avec son corps ; s'approprier des méthodes et outils ; partager des règles, assumer des rôles et responsabilités ; apprendre à entretenir sa santé ; s'approprier une culture physique sportive et artistique.",x:"Chacune contribue à un domaine du socle commun."},
{id:"b28",th:"T",p:"Depuis 2000",q:"Combien de champs d'apprentissage les programmes d'EPS du collège de 2015 comptent-ils ?",a:"Quatre.",x:"Produire une performance optimale ; adapter ses déplacements à des environnements variés ; s'exprimer devant les autres par une prestation artistique et/ou acrobatique ; conduire et maîtriser un affrontement collectif ou interindividuel."},
{id:"n67",th:"T",p:"Depuis 2000",q:"Que désignent les AFC dans les programmes de 2015 ?",a:"Les attendus de fin de cycle, définis pour chaque champ d'apprentissage.",x:"Ils servent de repères pour construire et évaluer les apprentissages."},
{id:"n70",th:"T",p:"Depuis 2000",q:"À quels parcours éducatifs l'EPS contribue-t-elle depuis la réforme du collège ?",a:"Le parcours Avenir, le parcours citoyen, le parcours d'éducation artistique et culturelle et le parcours éducatif de santé.",x:"Le parcours éducatif de santé concerne directement l'EPS."},
{id:"b29",th:"T",p:"Depuis 2000",q:"Quel champ d'apprentissage les programmes du lycée de 2019 ajoutent-ils ?",a:"Le CA5 : réaliser une activité physique pour développer ses ressources et s'entretenir.",x:"Il s'ajoute aux quatre champs du collège (arrêté du 17 janvier 2019)."},
{id:"n68",th:"T",p:"Depuis 2000",q:"Quels sont les cinq objectifs généraux de l'EPS au lycée (2019) ?",a:"Développer sa motricité ; savoir se préparer et s'entraîner ; exercer sa responsabilité individuelle et au sein d'un collectif ; construire durablement sa santé ; accéder au patrimoine culturel.",x:"Ils sont communs à tous les champs d'apprentissage."},
{id:"n69",th:"T",p:"Depuis 2000",q:"Que désignent les AFL dans les programmes du lycée ?",a:"Les attendus de fin de lycée, propres à chaque champ d'apprentissage.",x:"Ils structurent l'évaluation au baccalauréat."},
{id:"n72",th:"R",p:"Depuis 2000",q:"Quelle structure est obligatoire dans chaque collège et lycée pour le sport scolaire ?",a:"Une association sportive affiliée à l'UNSS.",x:"Chaque enseignant d'EPS y consacre 3 heures de son service."},
{id:"n73",th:"T",p:"Depuis 2000",q:"Quelle mesure d'activité physique est généralisée à l'école élémentaire à la rentrée 2022 ?",a:"30 minutes d'activité physique quotidienne.",x:"Une mesure liée à l'héritage des Jeux de Paris 2024."},
{id:"n74",th:"T",p:"Depuis 2000",q:"Quelle mesure est lancée au collège à la rentrée 2022, en lien avec Paris 2024 ?",a:"Deux heures de sport supplémentaires par semaine pour des élèves volontaires.",x:"Une expérimentation en partenariat avec les clubs et l'association sportive."},

/* ---------- Historiens et sociologues ---------- */
{id:"n87",th:"H",p:"1967-1981",q:"Quel ouvrage de Jacques Thibault (1972) est une référence de l'histoire de l'EPS ?",a:"Sport et éducation physique 1870-1970.",x:"Il retrace un siècle de rapports entre sport et éducation physique."},
{id:"n91",th:"H",p:"1967-1981",q:"Quelle notion Michel Foucault développe-t-il dans Surveiller et punir (1975) ?",a:"Les corps dociles, produits par les disciplines (école, armée, atelier).",x:"Une grille de lecture des gymnastiques disciplinaires du XIXe siècle."},
{id:"n76",th:"H",p:"1967-1981",q:"Quel ouvrage de Georges Vigarello (1978) étudie l'histoire des postures et du maintien ?",a:"Le corps redressé.",x:"Il montre comment la pédagogie a cherché à redresser et contrôler le corps de l'enfant."},
{id:"n93",th:"H",p:"1967-1981",q:"Quelle question pose Pierre Bourdieu dans une conférence de 1978 ?",a:"« Comment peut-on être sportif ? »",x:"Il analyse l'offre et la demande de pratiques sportives selon les classes sociales."},
{id:"n90",th:"H",p:"1981-2000",q:"Quel ouvrage de Jacques Defrance (1987) étudie la naissance des activités physiques modernes ?",a:"L'excellence corporelle.",x:"Il couvre la formation des activités physiques et sportives modernes de la fin du XVIIIe siècle à 1914."},
{id:"n88",th:"H",p:"1981-2000",q:"Qui écrit Le militaire, l'écolier, le gymnaste (1991) ?",a:"Pierre Arnaud.",x:"Il étudie la naissance de l'éducation physique en France au XIXe siècle."},
{id:"n92",th:"H",p:"1981-2000",q:"Quelle thèse Norbert Elias défend-il à propos du sport ?",a:"Le sport participe au processus de civilisation : il permet une violence maîtrisée et réglée.",x:"Avec Eric Dunning, Sport et civilisation (traduction française 1994)."},
{id:"n89",th:"H",p:"1981-2000",q:"Quel ouvrage de Jacques Gleyse (1995) relie l'éducation physique à la rationalisation ?",a:"L'instrumentalisation du corps.",x:"Il lit l'histoire de l'éducation physique à la lumière de la rationalité industrielle."},
{id:"n77",th:"G",p:"1880-1918",q:"Quel ingénieur américain publie en 1911 ses principes d'organisation scientifique du travail ?",a:"Frederick Taylor.",x:"La rationalisation du geste et de l'effort nourrit la réflexion sur le rendement corporel au XXe siècle."}
/* ---------- Ajouts v2 : Le geste et l'effort ---------- */
,{id:"n201",th:"G",p:"Avant 1880",q:"Quel ouvrage d'Étienne-Jules Marey (1873) étudie la locomotion humaine et animale ?",a:"La machine animale. Locomotion terrestre et aérienne.",x:"Avant la chronophotographie, Marey enregistre déjà le mouvement avec des appareils graphiques."}
,{id:"n202",th:"G",p:"Avant 1880",q:"Quel photographe décompose en 1878 le galop d'un cheval en une série d'images ?",a:"Eadweard Muybridge.",x:"Ses séries photographiques nourrissent les travaux de Marey sur l'analyse du mouvement."}
,{id:"n215",th:"G",p:"1880-1918",q:"Quelles conceptions de l'effort opposent les hygiénistes aux partisans du sport à la fin du XIXe siècle ?",a:"Un effort dosé et modéré pour préserver la santé, contre un effort intense recherché pour se dépasser.",x:"D'un côté Tissié ou Lagrange, de l'autre Coubertin et le modèle sportif anglais."}
,{id:"n203",th:"G",p:"1918-1945",q:"Quel physiologiste britannique, prix Nobel en 1922, étudie l'énergétique musculaire ?",a:"Archibald Vivian Hill.",x:"Avec Hartley Lupton, il décrit au début des années 1920 la consommation maximale d'oxygène (VO2 max)."}
,{id:"n204",th:"G",p:"1945-1967",q:"Quelle méthode d'entraînement alterne efforts intenses et récupérations courtes, popularisée par Emil Zátopek ?",a:"L'entraînement fractionné (interval training).",x:"Formalisé en Allemagne par l'entraîneur Woldemar Gerschler et le cardiologue Herbert Reindell."}
,{id:"n205",th:"G",p:"1967-1981",q:"Quel médecin américain popularise en 1968 l'endurance au service de la santé, avec un test de course de 12 minutes ?",a:"Kenneth Cooper (Aerobics, 1968).",x:"Le test de Cooper devient un classique de l'évaluation de l'endurance, y compris en EPS."}
,{id:"n207",th:"G",p:"1967-1981",q:"Quels sont les trois stades de l'apprentissage moteur décrits par Fitts et Posner (1967) ?",a:"Cognitif, associatif, autonome.",x:"L'élève passe de la compréhension de la tâche à l'automatisation du geste."}
,{id:"n209",th:"G",p:"1967-1981",q:"Quel problème du contrôle moteur Nikolaï Bernstein a-t-il mis en évidence ?",a:"Celui des degrés de liberté : coordonner un très grand nombre d'articulations et de muscles.",x:"Son ouvrage, traduit en anglais en 1967, influence durablement les théories de l'apprentissage moteur."}
,{id:"n208",th:"G",p:"1967-1981",q:"Quelle théorie Richard Schmidt propose-t-il en 1975 ?",a:"La théorie du schéma moteur.",x:"L'apprentissage construit des règles générales qui permettent d'adapter un programme moteur à des situations variées : d'où l'intérêt de varier la pratique."}
,{id:"n206",th:"G",p:"1981-2000",q:"Quel test d'endurance en aller-retour sur 20 mètres, à vitesse progressive, a été mis au point par Luc Léger ?",a:"Le test navette (course navette de 20 m).",x:"Conçu au Canada au début des années 1980, il estime la VO2 max et s'utilise largement à l'école."}
,{id:"n214",th:"G",p:"1981-2000",q:"Que désigne la VMA, utilisée en EPS pour individualiser le travail d'endurance ?",a:"La vitesse maximale aérobie : la plus petite vitesse de course qui sollicite la consommation maximale d'oxygène.",x:"Elle permet de fixer des allures en pourcentage de VMA, par exemple en demi-fond."}
,{id:"n210",th:"G",p:"1981-2000",q:"Quel ouvrage de Jean-Pierre Famose (1990) relie l'apprentissage à la difficulté des situations proposées ?",a:"Apprentissage moteur et difficulté de la tâche (INSEP).",x:"Il aide l'enseignant à doser la difficulté des situations pour favoriser l'apprentissage."}
,{id:"n211",th:"G",p:"Depuis 2000",q:"Quel programme national lancé en 2001 recommande l'équivalent d'au moins 30 minutes de marche rapide par jour ?",a:"Le Programme national nutrition santé (PNNS).",x:"L'activité physique devient un enjeu de santé publique, que l'école relaie."}
,{id:"n212",th:"G",p:"Depuis 2000",q:"Quelle loi de 2016 permet au médecin de prescrire une activité physique adaptée ?",a:"La loi de modernisation de notre système de santé (26 janvier 2016).",x:"On parle de « sport sur ordonnance » pour les patients atteints d'une affection de longue durée."}
,{id:"n213",th:"T",p:"Depuis 2000",q:"Quelle attestation, dont la version de 2015 a été refondue en 2022, certifie qu'un élève sait nager ?",a:"L'attestation du savoir-nager, devenue en 2022 l'attestation du savoir-nager en sécurité (ASNS).",x:"Elle se prépare de préférence au cycle 3 et conditionne la pratique d'activités nautiques comme la voile ou le canoë-kayak."}

/* ---------- Ajouts v2 : Débats et controverses ---------- */
,{id:"n223",th:"D",p:"1880-1918",q:"Sur quoi porte l'opposition entre médecins hygiénistes et militaires dans l'éducation physique de la fin du XIXe siècle ?",a:"Sur ses finalités : préserver la santé de l'enfant ou préparer le futur soldat.",x:"Le déclin des bataillons scolaires dans les années 1890 traduit l'influence croissante des hygiénistes."}
,{id:"n220",th:"D",p:"1918-1945",q:"Quelle pionnière fonde en 1917 une fédération sportive féminine, qu'elle préside à partir de 1919 ?",a:"Alice Milliat.",x:"Elle se bat pour l'ouverture des compétitions, et notamment des Jeux olympiques, aux femmes."}
,{id:"n221",th:"D",p:"1918-1945",q:"Où et quand se tiennent les premiers Jeux mondiaux féminins organisés autour d'Alice Milliat ?",a:"À Paris, en août 1922.",x:"Ils répondent au refus d'ouvrir l'athlétisme olympique aux femmes ; d'autres éditions suivent jusqu'en 1934."}
,{id:"n222",th:"D",p:"1918-1945",q:"Quelle position Pierre de Coubertin défend-il sur la participation des femmes aux Jeux olympiques ?",a:"Il y est opposé.",x:"Sous la pression du mouvement sportif féminin, le CIO ouvre cinq épreuves d'athlétisme aux femmes en 1928."}
,{id:"n224",th:"D",p:"1967-1981",q:"Quelle place Pierre Parlebas accorde-t-il aux jeux traditionnels ?",a:"Il les valorise comme des pratiques motrices aussi éducatives que les sports institutionnalisés.",x:"Le sport n'est pour lui qu'une forme parmi d'autres de l'action motrice."}
,{id:"n230",th:"D",p:"1967-1981",q:"Que reproche la critique radicale des années 1970 à la compétition sportive ?",a:"De reproduire les valeurs de rendement et de sélection de la société capitaliste.",x:"Critique portée notamment par Jean-Marie Brohm et la revue Quel corps ?"}
,{id:"n226",th:"D",p:"1981-2000",q:"Pourquoi les enseignants d'EPS revendiquaient-ils le rattachement à l'Éducation nationale, obtenu en 1981 ?",a:"Pour que l'EPS soit reconnue comme une discipline scolaire à part entière, et non comme une annexe de la politique sportive.",x:"Sous la tutelle de la Jeunesse et des Sports, la discipline était souvent confondue avec le développement du sport."}
,{id:"n228",th:"D",p:"1981-2000",q:"Inaptitude partielle ou dispense : quel principe s'impose à partir de la fin des années 1980 ?",a:"Adapter l'enseignement plutôt que dispenser l'élève.",x:"Le certificat d'inaptitude partielle (1988-1989) ouvre la voie à une EPS adaptée."}
,{id:"n227",th:"D",p:"Depuis 2000",q:"Quel débat soulèvent les barèmes de performance différenciés entre filles et garçons ?",a:"Celui de l'équité : compenser des écarts physiques moyens, au risque d'entretenir des stéréotypes.",x:"La question traverse l'évaluation au baccalauréat et la réflexion sur l'égalité à l'école."}
,{id:"n229",th:"D",p:"Depuis 2000",q:"Santé ou performance : comment les programmes du lycée de 2019 traitent-ils ce débat ?",a:"Ils font coexister les deux : performance maximale mesurable (CA1) et entretien de soi (CA5).",x:"« Construire durablement sa santé » devient un objectif général à part entière."}

/* ---------- Ajouts v2 : Historiens et sociologues ---------- */
