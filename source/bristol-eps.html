Sous « Les six éléments attendus », écris une puce par élément, dans cet ordre, qui commence par "- " puis le nom de l'élément, puis « présent », « à améliorer » ou « absent », et une courte justification : accroche ; définition des termes ; bornes chronologiques justifiées ; contexte et enjeu ; problématique ; annonce du plan. Sous les deux autres titres, 1 à 3 puces qui commencent par "- ". Ne réécris pas l'introduction à sa place et ne donne pas de note chiffrée. Si tu mentionnes un fait absent de la liste, précise qu'il est à vérifier.`
    : head + `
Voici ses notes de préparation (problématique, plan, idées) :
"""
${notes.slice(0, 6000)}
"""

Voici des faits vérifiés de son paquet de révision, utiles pour ce sujet :
${facts}

Donne-lui un retour exigeant, bienveillant et concret, en français, en 300 mots maximum, avec exactement ces quatre titres, chacun sur une ligne qui commence par "## " :
## Ce qui fonctionne
## Problématique
## Plan et périodisation
## À ajouter ou corriger
Sous chaque titre, 1 à 3 puces qui commencent par "- ". Évalue si la problématique répond vraiment au sujet (termes, bornes, tension), si le plan est démonstratif plutôt que descriptif, et si la périodisation est justifiée. Signale les faits de la liste qu'il n'utilise pas et qui renforceraient sa démonstration. Ne donne pas de note chiffrée et ne rédige pas de plan complet à sa place. Appuie-toi sur les faits fournis ; si tu mentionnes un autre fait, précise qu'il est à vérifier. Si les notes sont trop minces pour juger, dis-le simplement et indique quoi ajouter.`;
  const ctl = new AbortController();
  Object.assign(fb, { sid: key, status: "thinking", text: "", note: "", ctl });
  render();
  const opts = { signal: ctl.signal, cache: false, onText: ({ text }) => {
    if (fb.ctl !== ctl) return;
    fb.status = "streaming"; fb.text = text;
    const el = document.getElementById("sj-fb");
    if (el && sj.cur && fbKey(sj.cur, sj.mode) === key) el.innerHTML = fbInner(s, kind);
  } };
  /* Sur ton site, le serveur construit lui-même le prompt à partir de ces données. */
  if (STANDALONE) opts.payload = { kind, epreuve: isE2(s) ? "e2" : "e1", contexte: isE2(s) ? ctxText(s).slice(0, 3000) : "", subject: s.t, axe: s.axe || THEMES[s.th], notes: notes.slice(0, 6000), facts: cards.map(c => `[${pLabel(c)}] ${c.q} → ${c.a}${c.x ? " (" + c.x + ")" : ""}`) };
  try {
    const res = await sampleFn(prompt, opts);
    if (fb.ctl !== ctl) return;
    fb.status = "done"; fb.text = res.text;
    fb.note = res.truncated ? "Retour coupé avant la fin. Raccourcis ton texte, puis redemande."
      : (typeof res.quotaLeft === "number" ? `Il te reste ${res.quotaLeft} retour${res.quotaLeft > 1 ? "s" : ""} ce mois-ci.` : "");
    fbSave(key, res.text);
    ach.f++; persist();
  } catch (e) {
    if (fb.ctl !== ctl) return;
    fb.status = "error"; fb.text = (e && e.text) || ""; fb.note = fbErr(e && e.code, e && e.detail);
  }
  fb.ctl = null;
  render();
}

/* ---------- Chronomètre de l'introduction ---------- */
const tm = { dur: 20 * 60, left: 20 * 60, running: false, end: 0, iv: null };
function fmtT(s){ s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function tmStop(){ tm.running = false; if (tm.iv) { clearInterval(tm.iv); tm.iv = null; } }
function tick(){
  if (!tm.running) return;
  tm.left = (tm.end - Date.now()) / 1000;
  if (tm.left <= 0) { tm.left = 0; tmStop(); toast("Temps écoulé. Relis ton introduction avec la grille."); render(); return; }
  const el = document.getElementById("tmr"); if (el) el.textContent = fmtT(tm.left);
}
function tmStart(){ if (tm.left <= 0) tm.left = tm.dur; tm.end = Date.now() + tm.left * 1000; tm.running = true; if (!tm.iv) tm.iv = setInterval(tick, 250); render(); const t = $("#sj-notes"); if (t) t.focus(); }
function tmPause(){ tick(); tmStop(); render(); }
function tmReset(){ tmStop(); tm.left = tm.dur; }
function chkGet(sid){ try { return JSON.parse(noteGet("c:" + sid) || "[]"); } catch (e) { return []; } }

function drawSubject(){
  if (fb.ctl) { fb.ctl.abort(); fb.ctl = null; }
  tmReset();
  const pool = (sj.epr === "e2" ? SUBJECTS2 : SUBJECTS).filter(s => sj.axe === "Tous" || s.th === sj.axe);
  const others = pool.filter(s => !sj.cur || s.id !== sj.cur.id);
  const list = others.length ? others : pool;
  sj.cur = list[Math.floor(Math.random() * list.length)] || null; sj.shown = false;
}
function renderSujets(){
  const e2 = sj.epr === "e2";
  const eprChips = `<div class="seg sj-epr" role="tablist" aria-label="Écrit">${[["e1", "Écrit 1 : dissertation"], ["e2", "Écrit 2 : composition"]].map(([k, l]) => `<button role="tab" data-sjepr="${k}" aria-selected="${k === sj.epr}"${k === sj.epr ? "" : ' tabindex="-1"'}>${esc(l)}</button>`).join("")}</div>`;
  const chips = eprChips + `<div class="chips era-chips" aria-label="Thème des sujets">` + [["Tous", e2 ? "Tous les thèmes" : "Tous les axes"]].concat((e2 ? ["AM","EF","EX","DA","IN"] : ["T","G","D"]).map(k => [k, THEMES[k]]))
    .map(([k, l]) => `<button class="chip" data-sjaxe="${k}" aria-pressed="${k === sj.axe}">${esc(l)}</button>`).join("") + `</div>`;
  const modes = `<div class="modes" role="group" aria-label="Type d'entraînement"><button class="chip" data-sjmode="plan" aria-pressed="${sj.mode === "plan"}">Plan complet</button><button class="chip" data-sjmode="intro" aria-pressed="${sj.mode === "intro"}">Introduction chronométrée</button><button class="chip" data-sjmode="para" aria-pressed="${sj.mode === "para"}">${e2 ? "Partie illustrée" : "Paragraphe argumenté"}</button></div>`;
  let body;
  if (!sj.cur) {
    body = e2 ? (sj.mode === "para"
      ? `<p class="lead">Tire un sujet et rédige une partie illustrée : analyse les comportements d'élèves d'un épisode, explique-les avec des connaissances scientifiques, puis propose et justifie une mise en œuvre concrète dans l'APSA.</p>`
      : sj.mode === "intro"
      ? `<p class="lead">Tire un sujet et rédige son introduction en temps limité : enjeu, notions définies et reliées, problématique, prise en compte du contexte, annonce du plan.</p>`
      : `<p class="lead">${SUBJECTS2.length} sujets d'entraînement à la composition de l'écrit 2, chacun avec un contexte d'établissement et des épisodes de classe. Construis ta problématique et ton plan, puis affiche les connaissances utiles.</p>`)
      : sj.mode === "para"
      ? `<p class="lead">Tire un sujet et rédige un seul paragraphe argumenté, la brique de base de la dissertation : une idée, un argument, un exemple précis et daté, une nuance, un lien au sujet. Compte une quinzaine de minutes.</p>`
      : sj.mode === "intro"
      ? `<p class="lead">Tire un sujet et rédige son introduction en temps limité (20 minutes par défaut). Vérifie ensuite les six éléments attendus avec la grille, et demande un retour si tu veux.</p>`
      : `<p class="lead">${SUBJECTS.length} sujets d'entraînement rédigés sur les trois axes de l'écrit 1. Tire un sujet, cherche ta problématique et ton plan, puis affiche les cartes du paquet qui peuvent nourrir tes arguments.</p>`;
    body += `<div class="row-btns actions"><button class="btn primary" data-act="sj-draw">Tirer un sujet</button></div>`;
  } else {
    const s = sj.cur;
    const cards = s.c.map(byId).filter(Boolean).sort((a, b) => pIdx(a.p) - pIdx(b.p));
    let work;
    if (sj.mode === "intro") {
      const key = "i:" + s.id, chk = chkGet(s.id);
      const started = tm.left < tm.dur && tm.left > 0;
      work = `<div class="timer">
          <span id="tmr" class="tmr${tm.left <= 0 ? " over" : ""}" role="timer" aria-label="Temps restant">${fmtT(tm.left)}</span>
          <div class="row-btns">${tm.running ? `<button class="btn" data-act="tm-pause">Pause</button>` : `<button class="btn primary" data-act="tm-start">${started ? "Reprendre" : tm.left <= 0 ? "Recommencer" : "Démarrer"}</button>`}<button class="btn" data-act="tm-reset">Réinitialiser</button></div>
          ${tm.running || started ? "" : `<div class="chips" role="group" aria-label="Durée">${[15, 20, 30].map(m => `<button class="chip" data-tdur="${m}" aria-pressed="${tm.dur === m * 60}">${m} min</button>`).join("")}</div>`}
        </div>
        <label for="sj-notes" class="sj-help" style="display:block">Ton introduction. Elle reste sur cet appareil.</label>
        <textarea id="sj-notes" class="sj-notes intro" data-sid="${key}" placeholder="${isE2(s) ? "Enjeu, définition et mise en relation des notions, problématique, contexte et élèves, annonce du plan…" : "Accroche, définition des termes, bornes chronologiques, enjeu, problématique, annonce du plan…"}">${esc(noteGet(key))}</textarea>
        <fieldset class="grid-chk"><legend>Ta grille d'auto-évaluation</legend>${(isE2(s) ? INTRO2_CRIT : INTRO_CRIT).map((c, i) => `<label class="chk"><input type="checkbox" data-chk="${i}" data-sid="${s.id}"${chk.includes(i) ? " checked" : ""}> ${esc(c)}</label>`).join("")}</fieldset>
        ${fbBlock(s, "intro")}`;
    } else if (sj.mode === "para") {
      const key = "p:" + s.id, chk = chkGet("p-" + s.id);
      work = `<p class="sj-help">${isE2(s) ? "Choisis un épisode. Analyse ce que font les élèves, explique-le avec des connaissances précises, puis propose une mise en œuvre concrète et justifiée dans l'APSA." : "Choisis une idée qui répond au sujet et développe-la en un paragraphe. Appuie-toi sur un exemple précis, avec sa date et ses acteurs."}</p>
        <label for="sj-notes" class="sj-help" style="display:block">${isE2(s) ? "Ta partie illustrée" : "Ton paragraphe"}. Il reste sur cet appareil.</label>
        <textarea id="sj-notes" class="sj-notes intro" data-sid="${key}" placeholder="${isE2(s) ? "Comportements observés. Interprétation (auteur, date). Principe d'intervention. Situation, consignes, critères de réussite. Effets attendus et lien au sujet." : "Idée directrice. Argument. Exemple précis et daté. Nuance ou limite. Retour au sujet."}">${esc(noteGet(key))}</textarea>
        <fieldset class="grid-chk"><legend>Ta grille d'auto-évaluation</legend>${(isE2(s) ? ILLU_CRIT : PARA_CRIT).map((c, i) => `<label class="chk"><input type="checkbox" data-chk="${i}" data-sid="p-${s.id}"${chk.includes(i) ? " checked" : ""}> ${esc(c)}</label>`).join("")}</fieldset>
        ${fbBlock(s, "para")}`;
    } else {
      work = `<label for="sj-notes" class="sj-help" style="display:block">Tes idées : problématique, plan, exemples. Elles restent sur cet appareil.</label>
        <textarea id="sj-notes" class="sj-notes" data-sid="${s.id}" placeholder="${isE2(s) ? "Notions et liens entre elles…&#10;Problématique…&#10;I. … (épisode, APSA)&#10;II. …" : "Problématique…&#10;I. …&#10;II. …"}">${esc(noteGet(s.id))}</textarea>
        ${fbBlock(s, "plan")}`;
    }
    body = `<article class="bristol qui"><div class="band"><span class="period">${esc(s.label || "Sujet d'entraînement · " + THEMES[s.th])}</span></div><p class="q">${esc(s.t)}</p>${s.ctx ? `<dl class="sj-ctx"><dt>Contexte</dt><dd>${esc(s.ctx)}</dd>${s.ep.map((e, i) => `<dt>Épisode ${i + 1}</dt><dd>${esc(e)}</dd>`).join("")}</dl>` : isE2(s) && s.annale ? `<p class="sj-help">Le contexte d'établissement et les épisodes sont dans le sujet officiel : ouvre-le depuis l'onglet Annales.</p>` : ""}</article>
      ${work}
      ${sj.shown
        ? `<div class="sect" style="margin-top:20px"><h3>${cards.length} cartes utiles${isE2(s) ? "" : ", dans l'ordre chronologique"}</h3><ul class="list">${cards.map(c => `<li class="item"><div class="ip">${esc(pLabel(c))}</div><div class="iq">${esc(c.q)}</div><div class="ia">${esc(c.a)}</div></li>`).join("")}</ul></div>
           <div class="row-btns actions"><button class="btn primary" data-act="sj-revise">Réviser ces ${cards.length} cartes</button><button class="btn" data-act="sj-draw">Autre sujet</button></div>`
        : `<div class="row-btns actions" style="margin-top:16px"><button class="btn primary" data-act="sj-show">Afficher les cartes utiles</button><button class="btn" data-act="sj-draw">Autre sujet</button></div>`}`;
  }
  $("#panel-sujets").innerHTML = `<div class="chips era-chips" aria-label="Axe des sujets">${chips}</div>${modes}${body}
    <p class="sj-help">${sj.cur && sj.cur.annale ? "Sujet officiel de concours. Le retour de Claude est un premier regard, pas le corrigé du jury : relis aussi le rapport du jury dans l'onglet Annales." : "Ces sujets sont écrits pour l'entraînement ; ce ne sont pas des sujets officiels."} Les cartes proposées sont des points d'appui, pas un plan.</p>`;
}

const normTxt = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function refCite(r){ return `${r.au}, ${r.ti}, ${r.y}.`; }
function refMatches(r){
  if (rf.g !== "tous" && r.g !== rf.g) return false;
  if (!rf.q) return true;
  const qs = QUOTES.filter(x => x.ref === r.id).map(x => x.text).join(" ");
  const hay = normTxt([r.au, r.ti, r.y, r.id2, r.us, qs].join(" "));
  return normTxt(rf.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function quoteHTML(x){
  return `<figure class="quote"><blockquote>« ${esc(x.text)} »</blockquote><figcaption>${esc(x.author)}, ${esc(x.work)}${x.src_url ? ` · <a href="${esc(x.src_url)}" target="_blank" rel="noopener">${esc(x.src_label)}</a>` : ""}</figcaption>${x.context ? `<p class="opt">${esc(x.context)}</p>` : ""}</figure>`;
}
function refHTML(r){
  const qs = QUOTES.filter(x => x.ref === r.id);
  return `<li class="ref"><div class="ref-h"><b>${esc(r.au)}</b><span class="ref-y">${r.y}</span></div>
    <p class="ref-t">${esc(r.ti)}</p>
    <p>${esc(r.id2)}</p>
    <p class="ref-us"><span>Pour ta copie :</span> ${esc(r.us)}</p>
    ${qs.map(quoteHTML).join("")}
    <button class="linkbtn" data-refcopy="${r.id}">Copier la référence</button></li>`;
}
function renderRefs(){
  const el = $("#panel-refs"); if (!el) return;
  const list = REFS.filter(refMatches);
  const free = QUOTES.filter(x => !x.ref || !REFS.some(r => r.id === x.ref)).filter(x => (rf.g === "tous" || rf.g === "e1") && (!rf.q || normTxt([x.author, x.text, x.work].join(" ")).includes(normTxt(rf.q))));
  const chips = [["tous", "Tout"], ["e1", "Écrit 1 : histoire"], ["e2", "Écrit 2 : sciences"]]
    .map(([k, l]) => `<button class="chip" data-rfg="${k}" aria-pressed="${k === rf.g}">${esc(l)}</button>`).join("");
  const nQ = QUOTES.length;
  const head = document.getElementById("rf-search");
  if (!head) {
    el.innerHTML = `<p class="lead">Les ouvrages et les auteurs à citer dans tes copies, avec l'idée à retenir et l'usage possible. Les citations sont reproduites mot pour mot et vérifiées sur leur source.</p>
      <div class="rf-bar"><label class="sr-only" for="rf-search">Chercher une référence</label><input id="rf-search" type="search" placeholder="Chercher un auteur, un ouvrage, une idée…" value="${esc(rf.q)}" autocomplete="off"><div class="chips" id="rf-chips"></div></div>
      <p class="rf-count" id="rf-count" aria-live="polite"></p><div id="rf-list"></div>`;
  }
  $("#rf-chips").innerHTML = chips;
  $("#rf-count").textContent = `${list.length} référence${list.length > 1 ? "s" : ""}${nQ ? `, ${nQ} citation${nQ > 1 ? "s" : ""} vérifiée${nQ > 1 ? "s" : ""}` : ""}`;
  $("#rf-list").innerHTML = list.length || free.length
    ? `${list.length ? `<ul class="ref-list">${list.map(refHTML).join("")}</ul>` : ""}${free.length ? `<div class="sect"><h3>Textes officiels et autres citations</h3>${free.map(quoteHTML).join("")}</div>` : ""}`
    : `<div class="empty"><h2>Aucune référence trouvée.</h2><p>Essaie un autre mot : un nom d'auteur, une date, une notion.</p></div>`;
}

"t": "« Si la nécessité de faire bouger les enfants et les adolescents est désormais reconnue, les moyens d'y parvenir restent à développer. Chez l'enfant comme chez l'adulte, la pratique régulière d'une activité physique, favorise le maintien ou l'amélioration de la forme physique, procure des bénéfices sur le plan psychologique et social et a un effet favorable sur plusieurs aspects de la santé… La pratique régulière d'activité physique pendant l'enfance et l'adolescence dépasse ses effets immédiats sur la santé, pour au moins deux raisons : pratiquée avec plaisir, elle prédit le niveau de pratique d'activité physique du futur adulte ; nombre de bienfaits de l'activité physique pratiquée pendant l'enfance se prolongent jusqu'à l'âge adulte, indépendamment du degré d'activité de ce dernier. …Plus largement, la pratique d'activités physiques favorise la cohésion et l'intégration sociale dès lors qu'elles sont organisées dans un cadre facilitant l'accès à tous et la mixité des publics. En favorisant la concentration et la confiance en soi, elles pourraient, de plus, contribuer à de meilleurs résultats scolaires. » Etude de l'institut national de prévention et d'éducation pour la santé (INPES), « Promouvoir l'activité physique des jeunes », 2011. L'EPS actuellement enseignée au lycée prépare-t-elle suffisamment les lycéens à poursuivre une activité physique régulière, dont nous connaissons tous les bénéfices, quelle que soit la situation dans laquelle ils vont se retrouver après leurs études secondaires ? A partir d'exemples concrets, vous justifierez votre prise de position et illustrerez vos propositions en vous appuyant, en tant que de besoin, sur les données contextuelles proposées en annexe.",

function bucket(list){

  list.forEach(x => { const p = progress[x.id]; if (!p) e++; else if (p.b === 5) m++; else c++; });
  return { m, c, e, n: list.length };
}
function barRow(label, s){

    <div class="bar" role="img" aria-label="${esc(label)} : ${s.m} maîtrisées, ${s.c} en cours, ${s.e} jamais vues sur ${s.n}">${seg("m", s.m, "maîtrisées")}${seg("c", s.c, "en cours")}${seg("e", s.e, "jamais vues")}</div></div>`;
}
function weakCards(){
  return allCards().filter(c => progress[c.id] && progress[c.id].l > 0)
    .sort((a, b) => (progress[b.id].l - progress[a.id].l) || (progress[a.id].b - progress[b.id].b)).slice(0, 8);
}
function heatmapHTML(){
  const WEEKS = 12, today = startOfDay();
  const dow = (today.getDay() + 6) % 7;               /* lundi = 0 */
  const start = new Date(today); start.setDate(start.getDate() - dow - (WEEKS - 1) * 7);
  const lvl = a => a <= 0 ? 0 : a < 10 ? 1 : a < 25 ? 2 : a < 50 ? 3 : 4;
  let cells = "", active = 0, total = 0;
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (d > today) { cells += `<span class="hm-cell hm-out"></span>`; continue; }
    const a = (log[dayKey(d)] || {}).a || 0; if (a) { active++; total += a; }
    const lab = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " : " + (a ? a + " réponse" + (a > 1 ? "s" : "") : "aucune révision");
    cells += `<span class="hm-cell hm-${lvl(a)}" title="${esc(lab)}"></span>`;
  }
  const st = streaks();
  return `<div class="sect rd"><h3>Régularité</h3>
    <div class="kpis hm-kpis">
      <div class="kpi"><b>${st.cur}</b><span>jour${st.cur > 1 ? "s" : ""} d'affilée en ce moment</span></div>
      <div class="kpi"><b>${st.best}</b><span>meilleure série</span></div>
      <div class="kpi"><b>${active}</b><span>jours actifs sur 12 semaines</span></div>
    </div>
    <div class="hm-wrap"><div class="hm-days" aria-hidden="true"><span>lun.</span><span></span><span>mer.</span><span></span><span>ven.</span><span></span><span>dim.</span></div>
      <div class="hm" role="img" aria-label="Calendrier des 12 dernières semaines : ${active} jours de révision, ${total} réponses au total.">${cells}</div></div>
    <p class="legend-row hm-legend"><span>Moins</span><i class="hm-cell hm-0"></i><i class="hm-cell hm-1"></i><i class="hm-cell hm-2"></i><i class="hm-cell hm-3"></i><i class="hm-cell hm-4"></i><span>Plus (50 réponses et plus)</span></p>
  </div>`;
}

async function deriveKey(email, password){
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);

  let data = {}; try { data = await res.json(); } catch (e) {}

}

async function pullAndMerge(){
  const r = await api("GET", "/api/progress");
  if (r.status === 401) { signedOut(); return; }
  if (r.status !== 200) { setStatus("offline"); return; }
  const remote = normRemote(r.data.data);
  const m = merge(remote);
  applyMerged(m);
  srv.base = r.data.updatedAt || 0;
  if (!sameData(normRemote(m), remote)) { srv.dirty = true; await srvFlush(); } else setStatus("cloud");

async function srvFlush(){
  if (srv.saving || !srv.dirty || acct.status !== "in") return;
  srv.saving = true; srv.dirty = false;
  const r = await api("PUT", "/api/progress", { data: syncPayload(), base: srv.base });

  if (r.status === 200) { srv.base = r.data.updatedAt; srv.retries = 0; setStatus("cloud"); }

    srv.retries++;

    srv.base = r.data.updatedAt; srv.dirty = true;
    if (done === 0 && !flipped) buildQueue();

      <p class="w-lead">Ton compte et ta progression enregistrée seront effacés définitivement. Ta progression restera seulement dans ce navigateur.</p>
      <form class="acct-form" data-acctform="delete" novalidate>${acct.hasPassword ? acctField("acct-pw", "Mot de passe, pour confirmer", "password", "current-password") : acctField("acct-confirm", "Tape SUPPRIMER pour confirmer", "text", "off", 'spellcheck="false"')}
      ${msg}<div class="row-btns"><button class="btn danger" type="submit"${busy}>${acct.busy ? "Suppression…" : "Supprimer définitivement"}</button><button class="btn" type="button" data-act="acct-view" data-v="profile">Annuler</button></div></form>`;
  } else if (acct.status === "in") {
    body = `<h2 id="account-title">Mon compte</h2>
      <p class="w-lead">Connecté avec <strong>${esc(acct.email)}</strong>${acct.viaGoogle ? " (compte Google)" : ""}. Ta progression, tes cartes, tes références et tes scores se synchronisent sur tous les appareils où tu te connectes. Tes notes de dissertation restent sur chaque appareil.</p>
      ${msg}<div class="row-btns"><button class="btn" data-act="acct-logout"${busy}>Se déconnecter</button><button class="btn" data-act="acct-view" data-v="delete">Supprimer mon compte</button><button class="btn" data-act="acct-close">Fermer</button></div>`;
  } else if (acct.view === "recover") {
    body = `<h2 id="account-title">Mot de passe oublié</h2>
      <p class="w-lead">Saisis la clé de secours reçue à la création de ton compte, puis choisis un nouveau mot de passe.</p>
      <form class="acct-form" data-acctform="recover" novalidate>
        ${acctField("acct-email", "E-mail", "email", "email")}
        ${acctField("acct-rk", "Clé de secours", "text", "off", 'spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX"')}
        ${acctField("acct-pw", "Nouveau mot de passe (10 caractères minimum)", "password", "new-password")}
        ${msg}<div class="row-btns"><button class="btn primary" type="submit"${busy}>${acct.busy ? "Vérification…" : "Changer mon mot de passe"}</button><button class="btn" type="button" data-act="acct-view" data-v="login">Retour</button></div>
      </form>`;
  } else {
    const reg = acct.view === "register";
    body = `<h2 id="account-title">${reg ? "Créer un compte" : "Se connecter"}</h2>
      <p class="w-lead">Un compte te permet de retrouver ta progression sur tous tes appareils. Ce que tu as déjà fait sur cet appareil y sera ajouté.</p>
      <div class="seg" role="tablist" aria-label="Connexion ou inscription">
        <button role="tab" data-act="acct-view" data-v="login" aria-selected="${!reg}">Se connecter</button>
        <button role="tab" data-act="acct-view" data-v="register" aria-selected="${reg}">Créer un compte</button>
      </div>
      ${acct.google ? `<div class="g-wrap"><a class="btn wide g-btn" href="/api/auth/google/start">Continuer avec Google</a><p class="or"><span>ou avec ton e-mail</span></p></div>` : ""}
      <form class="acct-form" data-acctform="${reg ? "register" : "login"}" novalidate>
        ${acctField("acct-email", "E-mail", "email", "email")}
        ${acctField("acct-pw", reg ? "Mot de passe (10 caractères minimum)" : "Mot de passe", "password", reg ? "new-password" : "current-password")}
        ${reg ? acctField("acct-pw2", "Confirme le mot de passe", "password", "new-password") : ""}
        ${msg}<div class="row-btns"><button class="btn primary" type="submit"${busy}>${acct.busy ? (reg ? "Création…" : "Connexion…") : (reg ? "Créer mon compte" : "Me connecter")}</button>${reg ? "" : `<button class="btn" type="button" data-act="acct-view" data-v="recover">Mot de passe oublié ?</button>`}<button class="btn" type="button" data-act="acct-close">Fermer</button></div>
      </form>`;
  }
  el.innerHTML = body;
}
function openAccount(view){
  acct.open = true; acct.msg = ""; acct.view = view || (acct.status === "in" ? "profile" : "login");
  $("#account").hidden = false; renderAccount();
  const t = $("#account-title"); if (t) { t.tabIndex = -1; t.focus(); }
  try { window.scrollTo({ top: 0 }); } catch (e) {}
}
function closeAccount(){ acct.open = false; $("#account").hidden = true; const b = $("#account-open"); if (b) b.focus(); }
function acctSetMsg(m, kind){ acct.msg = m; acct.msgKind = kind || "bad"; }

async function submitAccount(kind){
  const email = (($("#acct-email") || {}).value || "").trim().toLowerCase();
  const pw = ($("#acct-pw") || {}).value || "";
  const confirmTxt = (($("#acct-confirm") || {}).value || "").trim();
  const keepEmail = email;
  const fail = (m) => { acct.busy = false; acctSetMsg(m); renderAccount(); const e = $("#acct-email"); if (e) e.value = keepEmail; };
  if (kind !== "delete" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Saisis une adresse e-mail valide.");
  if ((kind === "register" || kind === "recover") && pw.length < 10) return fail("Le mot de passe doit faire au moins 10 caractères.");
  if (kind === "register" && pw !== (($("#acct-pw2") || {}).value || "")) return fail("Les deux mots de passe ne sont pas identiques.");
  if ((kind === "login" || (kind === "delete" && acct.hasPassword)) && !pw) return fail("Saisis ton mot de passe.");
  const rk = kind === "recover" ? (($("#acct-rk") || {}).value || "") : "";
  if (kind === "recover" && rk.replace(/[^A-Za-z0-9]/g, "").length !== 25) return fail("La clé de secours compte 25 caractères (5 groupes de 5).");
  acct.busy = true; acct.msg = ""; renderAccount();
  const key = (kind === "delete" && !acct.hasPassword) ? "" : await deriveKey(kind === "delete" ? acct.email : email, pw);
  let r;
  if (kind === "login") r = await api("POST", "/api/auth/login", { email, key });
  else if (kind === "register") r = await api("POST", "/api/auth/register", { email, key });
  else if (kind === "recover") r = await api("POST", "/api/auth/recover", { email, key, recoveryKey: rk });
  else r = await api("POST", "/api/auth/delete", acct.hasPassword ? { key } : { confirm: confirmTxt });
  acct.busy = false;
  if (r.status < 200 || r.status >= 300) return fail(acctErr(r));
  if (kind === "delete") { signedOut(); acctSetMsg("Ton compte a été supprimé.", "ok"); acct.view = "login"; renderAccount(); toast("Compte supprimé."); return; }
  if (r.data.recoveryKey) { acct.recoveryKey = r.data.recoveryKey; acct.view = "recovery-shown"; }
  else acct.view = "profile";
  await signedIn(r.data.email, { hasPassword: true, google: false });
  acctSetMsg(kind === "register" ? "Compte créé. Ta progression est maintenant synchronisée." : kind === "recover" ? "Mot de passe changé." : "Connecté. Ta progression est synchronisée.", "ok");
  renderAccount();
  toast(kind === "register" ? "Compte créé." : "Connecté.");
}
async function logoutAccount(){
  acct.busy = true; renderAccount();
  if (srv.dirty) await srvFlush();
  await api("POST", "/api/auth/logout", {});
  acct.busy = false;
  /* Sur un appareil partagé, on ne laisse pas la progression du compte derrière soi. */
  progress = {}; custom = []; gone = []; games = normGames(); refs = {}; log = {}; prefs = normPrefs(); ach = normAch(); mine = normMine(); localSave();
  signedOut(); done = 0; buildQueue(); render();
  acct.view = "login"; acctSetMsg("Déconnecté. Ta progression reste enregistrée dans ton compte.", "ok"); renderAccount();
}
async function initAccount(){
  if (!STANDALONE) return;
  renderAccountBtn();
  let ret = null;
  try {
    const u = new URL(location.href); ret = { c: u.searchParams.get("connexion"), r: u.searchParams.get("raison"), lie: u.searchParams.get("lie"), detail: u.searchParams.get("detail") };
    if (ret.c) history.replaceState(null, "", u.pathname + u.hash);
  } catch (e) {}
  const cfg = await api("GET", "/api/auth/config");
  acct.google = cfg.status === 200 && !!cfg.data.google;
  const r = await api("GET", "/api/auth/me");
  if (r.status === 200) await signedIn(r.data.email, r.data);
  else { acct.status = "out"; renderAccountBtn(); }
  if (ret && ret.c === "google" && acct.status === "in") {
    if (welcomeSeen() === false) hideWelcome();
    if (ret.lie) { openAccount("profile"); acctSetMsg("Ton compte est maintenant relié à Google. Pour ta sécurité, l'ancien mot de passe est désactivé : connecte-toi désormais avec Google.", "ok"); renderAccount(); }
    else toast("Connecté avec Google. Ta progression est synchronisée.");
  }
  else if (ret && ret.c === "erreur") {
    const D = { invalid_client: "Google refuse le secret client : vérifie GOOGLE_CLIENT_SECRET dans Cloudflare.",
      redirect_uri_mismatch: "L'adresse de retour n'est pas déclarée dans la console Google.",
      invalid_grant: "Le code de connexion a expiré ou a déjà servi. Réessaie.",
      unauthorized_client: "Ce client Google n'est pas autorisé pour ce type de connexion." };
    const base = GOOGLE_ERR[ret.r] || D[ret.detail] || "La connexion avec Google a échoué. Réessaie.";
    openAccount("login"); acctSetMsg(base + (ret.detail && !D[ret.detail] ? ` (code : ${ret.r}${ret.detail ? " / " + ret.detail : ""})` : ret.detail ? ` (code : ${ret.detail})` : ""), "bad"); renderAccount();
  }
}

/* Accueil et prise en main */
const WELCOME_KEY = "bristol-eps-welcome";
function welcomeSeen(){ try { return localStorage.getItem(WELCOME_KEY) === "1"; } catch (e) { return false; } }
function welcomeSetSeen(){ try { localStorage.setItem(WELCOME_KEY, "1"); } catch (e) {} }
const REL_GRP = { "capeps-int": ["tx", "e2"] };
const relGroups = () => REL_GRP[prefs.concours] || ["e1", "e2", "tx"];
function onbHTML(){
  const c = concById(prefs.concours);
  if (c) return `<p class="w-mine">Ton concours : <b>${esc(c.t)}</b>${c.d ? `, écrits le ${esc(fmtDay(c.d))}` : ""}. <button class="linkbtn" data-onb-change="1">Changer</button></p>`;
  return `<div class="w-onb"><p class="w-sub">Pour commencer, quel concours prépares-tu ?</p>
    <div class="w-conc">${CONCOURS.map(x => `<button class="btn" data-onb="${x.id}"><b>${esc(x.t)}</b><span>${esc(x.tag)}</span></button>`).join("")}<button class="btn" data-onb="none"><b>Je ne sais pas encore</b><span>Tout afficher</span></button></div>
    <p class="w-note">Le site règle ensuite le compte à rebours sur la date de tes écrits et met en avant les annales, la méthode et les épreuves de ton concours. Tu pourras changer à tout moment.</p></div>`;
}
function renderWelcome(){
  const el = $("#welcome");
  const n = allCards().length;
  el.innerHTML = `<h2 id="welcome-title">Bienvenue sur Bristol EPS</h2>
    ${onbHTML()}
    <p class="w-lead">Un outil pour préparer les écrits du CAPEPS et de l'agrégation d'EPS : ${n} fiches pour l'écrit 1 (histoire), l'écrit 2 (sciences et intervention) et les textes officiels, des récits de synthèse et des entraînements à la dissertation.</p>
    <p class="w-sub">Cinq espaces</p>
    <ul class="w-spaces">
      <li class="w-space"><b>Aujourd'hui</b><span>Ton programme du jour : une séance de cartes par épreuve, un paragraphe à rédiger, une frise. Et le compte à rebours si tu as fixé la date du concours.</span></li>
      <li class="w-space"><b>Réviser</b><span>Les fiches du jour, épreuve par épreuve : écrit 1, écrit 2, textes officiels. Celles que tu rates reviennent vite, celles que tu sais reviennent de plus en plus tard.</span></li>
      <li class="w-space"><b>Apprendre</b><span>Les fils rouges qui relient les faits sur un thème, les références et citations à placer en copie, les concours et leurs épreuves, toutes les fiches, et tes propres cartes.</span></li>
      <li class="w-space"><b>S'entraîner</b><span>Frise, quiz « Qui ? », sujets d'écrit 1 et d'écrit 2 avec retour de Claude, annales des concours et méthode des écrits.</span></li>
      <li class="w-space"><b>Progrès</b><span>Ton niveau de préparation par axe, ta régularité et tes succès.</span></li>
    </ul>
    <div class="w-cols"><div>
    <p class="w-sub">Ta première séance</p>
    <ol class="w-steps">
      <li>Lis la question et cherche la réponse dans ta tête.</li>
      <li>Retourne la carte (bouton ou touche Espace).</li>
      <li>Sois honnête : Raté, Hésité ou Su (touches 1, 2 ou 3).</li>
    </ol>
    <p class="w-note">Dix nouvelles cartes par jour, dans l'ordre chronologique (ou le rythme calculé d'après la date de ton concours). Ta progression est enregistrée automatiquement${STANDALONE ? " dans ce navigateur ; crée un compte (bouton « Se connecter ») pour la retrouver sur tous tes appareils" : ""}.${STANDALONE ? " Le retour de Claude sur tes plans et tes introductions demande un code d'accès bêta." : ""}</p>
    </div><div>
    <p class="w-sub">Bon à savoir</p>
    <p class="w-note">Les trois premiers thèmes reprennent les axes du programme de l'écrit 1 du CAPEPS externe 2027 : « L'évolution de l'EPS depuis la fin du XIXe siècle ». Le classement de chaque carte dans un axe est un choix de travail, à discuter. Une carte sue revient après 1, 3, 7 puis 15 jours. Le contenu de base est à recouper avec tes ouvrages de préparation.</p>
    </div></div>
    <div class="row-btns"><button class="btn primary" data-act="welcome-start">Commencer ma première séance</button><button class="btn" data-act="welcome-close">Fermer</button></div>`;
}
/* Le bloc de bienvenue ne s'affiche que sur l'accueil. */
let welcomeOpen = false;
function showWelcome(focus){ welcomeOpen = true; renderWelcome(); $("#welcome").hidden = view !== "home"; if (focus) { const h = $("#welcome-title"); h.tabIndex = -1; h.focus(); } }
function hideWelcome(){ welcomeOpen = false; $("#welcome").hidden = true; welcomeSetSeen(); }

/* Taille du texte */
const BIG_KEY = "bristol-eps-big";
function applyBig(on){ document.documentElement.classList.toggle("big", on); $("#textsize").setAttribute("aria-pressed", String(on)); }
try { applyBig(localStorage.getItem(BIG_KEY) === "1"); } catch (e) {}
$("#textsize").addEventListener("click", () => { const on = !document.documentElement.classList.contains("big"); applyBig(on); try { localStorage.setItem(BIG_KEY, on ? "1" : "0"); } catch (e) {} });
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (view === "qui") {
    if (!qz.ans && ["1","2","3","4"].includes(e.key)) { const w = qz.opts[+e.key - 1]; if (w) { e.preventDefault(); answerQui(w); } }
    else if (qz.ans && (e.key === "Enter" || e.key === " ") && !e.target.closest("button")) { e.preventDefault(); newQui(); render(); }
    return;
  }
  if (view !== "revise") return;
  if (!queue.length) return;
  if (!flipped && (e.key === " " || e.key === "Enter")) { if (e.target.closest("button")) return; e.preventDefault(); flipped = true; render(true); return; }
  if (flipped && ["1","2","3"].includes(e.key)) { e.preventDefault(); grade({ "1": "rate", "2": "hesite", "3": "su" }[e.key]); }
});
$("#f-p").innerHTML = PERIODS.concat([NONE_P]).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
$("#f-p").value = NONE_P;
$("#f-t").innerHTML = EPR.map(g => `<optgroup label="${esc(g.t)}">${g.th.map(k => `<option value="${k}">${esc(THEMES[k])}</option>`).join("")}</optgroup>`).join("") + `<option value="">${NONE_T}</option>`;
$("#f-t").value = "";
document.addEventListener("submit", e => {
  if (e.target.dataset && e.target.dataset.goalform) {
    e.preventDefault();
    const v = ($("#exam-date") || {}).value || "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Choisis une date valide."); return; }
    prefs = Object.assign({}, prefs, { examDate: v, t: Date.now() }); goalEdit = false; persist(); done = 0; buildQueue(); render();
    const g = goalInfo(); toast(g && g.newPerDay ? `Objectif : ${g.newPerDay} nouvelles cartes par jour.` : "Date enregistrée.");
    return;
  }
  if (e.target.dataset && e.target.dataset.acctform) { e.preventDefault(); submitAccount(e.target.dataset.acctform); return; }
  if (!e.target.dataset || !e.target.dataset.codeform) return;
  e.preventDefault();
  const v = ($("#access-code").value || "").trim();
  if (!v) { $("#access-code").focus(); return; }
  codeSet(v); fb.note = ""; if (fb.status === "error") fb.status = "idle";
  render(); toast("Code enregistré.");
  const b = $('[data-act="fb-ask"]'); if (b) b.focus({ preventScroll: true });
});
$("#add-form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("#f-q").value.trim(), a = $("#f-a").value.trim(), x = $("#f-x").value.trim(), p = $("#f-p").value, th = $("#f-t").value;
  if (!q || !a) { $("#f-err").hidden = false; return; }
  $("#f-err").hidden = true;
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  custom = custom.concat([{ id, th, p, q, a, x }]);
  const r = $("#f-r").value.trim().slice(0, 300); if (r) refs[id] = { v: r, t: Date.now() };
  persist();
  $("#f-q").value = ""; $("#f-a").value = ""; $("#f-x").value = ""; $("#f-r").value = "";
  toast("Carte ajoutée. Elle apparaîtra dans ta prochaine séance."); $("#f-q").focus();
});

localLoad(); backfillWritten(); checkAch(true); localSave(); buildQueue(); render();
if (!welcomeSeen() && !Object.keys(progress).length) showWelcome(false);
connect().catch(() => { if (!store.ref) setStatus("local"); });
initAccount().catch(() => {});
</script>
