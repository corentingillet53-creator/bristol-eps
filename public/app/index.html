{id:"po31",th:"PO",p:"",q:"Que prévoit le décret n°88-977 du 11 octobre 1988 sur le contrôle médical des inaptitudes à l'EPS ?",a:"Un élève qui invoque une inaptitude doit la justifier par un certificat médical indiquant son caractère total ou partiel, valable au plus pour l'année scolaire en cours. Le médecin de santé scolaire est destinataire des certificats lorsque l'inaptitude dépasse trois mois.",x:"L'arrêté du 13 septembre 1989 fournit le modèle de certificat. Il prévoit un suivi particulier par le médecin scolaire au-delà de trois mois, en lien avec le médecin traitant."},
{id:"po32",th:"PO",p:"",q:"Quel principe la circulaire n°90-107 du 17 mai 1990 pose-t-elle en matière d'inaptitude ?",a:"Tout élève est présumé apte. La notion de dispense est remplacée par celle d'inaptitude, et les contre-indications de l'inaptitude partielle sont formulées « en termes d'incapacités fonctionnelles » (types de mouvements ou d'efforts), et non en activités interdites.",x:"La circulaire affirme le principe de « la participation de tous les élèves aux cours d'éducation physique et sportive ». Cela fonde l'adaptation de l'enseignement plutôt que l'exclusion, dans la ligne de la loi n°2005-102 du 11 février 2005 sur le handicap."},
{id:"po33",th:"PO",p:"",q:"Quelles solutions la note de service de 2026 sur le bac GT prévoit-elle pour les élèves inaptes ou en situation de handicap ?",a:"En cas d'inaptitude temporaire : épreuve adaptée, évaluation différée, certification sur deux épreuves ou sur une seule, ou dispense (le coefficient est alors neutralisé). Des épreuves adaptées sont prévues pour les candidats en situation de handicap ou d'inaptitude partielle.",x:"La logique d'inclusion conduit à maintenir l'élève dans une certification aménagée plutôt qu'à le dispenser. Même en cas d'inaptitude partielle ou temporaire, l'évaluation ne peut reposer sur les seuls AFL2 et AFL3."},
{id:"po34",th:"PO",p:"",q:"Quel article du Code de l'éducation impose une association sportive dans chaque établissement du second degré, et comment est-elle organisée ?",a:"L'article L552-2 : « Une association sportive est créée dans tous les établissements du second degré. » Selon l'article R552-2, elle est affiliée à l'UNSS, administrée par un comité directeur présidé par le chef d'établissement, et animée par les enseignants d'EPS de l'établissement.",x:"Le secrétaire de l'AS est choisi parmi les enseignants d'EPS ; le trésorier doit être majeur. L'AS est un lieu privilégié d'engagement et de prise de responsabilités (jeunes officiels, élèves dirigeants)."},
{id:"po35",th:"PO",p:"",q:"Quel texte inclut le forfait de trois heures d'AS dans le service des enseignants d'EPS, et quelles en sont les modalités ?",a:"Le décret n°2014-460 du 7 mai 2014, précisé par la note de service n°2016-043 du 21 mars 2016 : trois heures forfaitaires consacrées à l'organisation et au développement de l'AS sont inscrites dans le service de chaque enseignant d'EPS.",x:"La note juge nécessaire la libération du mercredi après-midi pour les activités de l'AS. Un enseignant peut demander, au plus tard le 15 février, à effectuer des heures d'enseignement à la place, sous réserve de l'accord du recteur."},
{id:"po36",th:"PO",p:"",q:"Quel texte encadre aujourd'hui les sections sportives scolaires et les dispositifs sport-études ?",a:"La circulaire du 15 décembre 2023 (BO n°48 du 21 décembre 2023), qui abroge celle du 10 avril 2020. Une SSS offre trois heures hebdomadaires de pratique supplémentaire. Les dispositifs sport-études (classe ou aménagement individuel) remplacent les sections d'excellence sportive et permettent un allègement allant jusqu'à 4 h 30 par semaine.",x:"Une SSS est ouverte par décision du recteur, sur proposition du chef d'établissement et après avis du conseil d'administration. Elle est évaluée tous les quatre ans au collège et tous les trois ans au lycée."},
{id:"po37",th:"PO",p:"",q:"Qu'est-ce que le dispositif « Deux heures de sport en plus au collège », et quel est son cadre en 2026-2027 ?",a:"Deux heures hebdomadaires d'activité physique, gratuites et hors temps scolaire, proposées en complément de l'EPS et de l'AS, prioritairement aux collégiens peu actifs et sans licence (attention portée aux filles et aux élèves à besoins éducatifs particuliers). Selon l'instruction du 23 juillet 2026 (BO spécial n°2 du 25 août 2026), il est ouvert à tous les collèges publics volontaires.",x:"En 2024-2025, le dispositif avait été recentré sur les seuls collèges REP/REP+ (BO n°42 du 7 novembre 2024). Il est financé par le ministère des Sports, à hauteur de 150 € par séance au maximum, et animé par des clubs partenaires."},
{id:"po38",th:"PO",p:"",q:"Quel texte encadre aujourd'hui l'enseignement de la natation scolaire, et qu'a-t-il remplacé ?",a:"La note de service du 28 février 2022 « Contribution de l'École à l'aisance aquatique » (BO n°9 du 3 mars 2022). Elle abroge la circulaire n°2017-127 du 22 août 2017.",x:"L'aisance aquatique y est définie comme « une première expérience positive de l'eau ». Elle vise surtout les moins de 7 ans, dès la maternelle. Le test d'aisance aquatique des accueils collectifs de mineurs devient le « Pass-nautique »."},
{id:"po39",th:"PO",p:"",q:"Qu'est-ce que l'ASNS, quel texte la crée, et quand doit-elle être validée ?",a:"L'attestation du savoir-nager en sécurité, créée par l'arrêté du 28 février 2022. Elle remplace l'attestation scolaire du savoir-nager (ASSN, arrêté du 9 juillet 2015) et se valide prioritairement à la fin du cycle 3 (CM1, CM2 ou 6e), mais elle peut être obtenue plus tard, jusqu'au lycée.",x:"Le parcours se nage sans lunettes, sur environ 50 m, sans appui ni limite de temps. Dans le second degré, l'attestation est signée par le professeur d'EPS."},
{id:"po40",th:"PO",p:"",q:"Quelles recommandations horaires la note de service de 2022 donne-t-elle pour la natation au primaire ?",a:"Trois à quatre séquences d'apprentissage de 10 à 12 séances chacune, au moins une séance par semaine, avec environ 40 à 45 minutes de pratique effective dans l'eau par séance.",x:"Elle fixe aussi les taux d'encadrement au primaire (par exemple au moins deux adultes, dont l'enseignant, pour moins de 20 élèves). Dans le second degré, l'enseignement est assuré par le professeur d'EPS, avec un personnel de surveillance qualifié."},
{id:"po41",th:"PO",p:"",q:"Quand les 30 minutes d'activité physique quotidienne (APQ) à l'école primaire ont-elles été généralisées, et quel est leur lien avec l'EPS ?",a:"À la rentrée 2022, par la note de service du 27 juillet 2022 (BO n°30 du 28 juillet 2022), après une première phase lancée par la circulaire du 12 janvier 2022 (BO n°3 du 20 janvier 2022). Le dispositif est « distinct et complémentaire » des trois heures hebdomadaires d'EPS.",x:"Il s'inscrit dans la démarche « École promotrice de santé », la Stratégie nationale sport-santé et le label Génération 2024. La même circulaire de janvier 2022 lance le partenariat « Une école, un club »."},
{id:"po42",th:"PO",p:"",q:"Que doit contenir le projet pédagogique d'EPS au collège, selon les ressources d'accompagnement du cycle 4 ?",a:"Issu d'une réflexion collective de l'équipe EPS et ancré dans le projet d'établissement, il comprend un volet disciplinaire et un volet interdisciplinaire. Le premier couvre l'offre de formation (tous les champs rencontrés sur le cycle), les attendus de fin de cycle, les apprentissages prioritaires, les fiches APSA et les modalités d'évaluation. Le second couvre les EPI, l'accompagnement personnalisé et les parcours.",x:"Le projet établit « la cohérence des choix » de l'équipe en fonction du contexte, du programme et des besoins des élèves. Dans la voie professionnelle, le programme le rend explicitement obligatoire : il spécifie les AFLP de chaque APSA et les indicateurs d'évaluation."},
{id:"po43",th:"PO",p:"",q:"Quels sont les quatre parcours éducatifs auxquels l'EPS contribue, et leurs textes de référence ?",a:"Parcours avenir (arrêté du 1er juillet 2015) ; parcours citoyen (circulaire n°2016-092 du 20 juin 2016) ; parcours éducatif de santé (circulaire n°2016-008 du 28 janvier 2016) ; parcours d'éducation artistique et culturelle (circulaire n°2013-073 du 3 mai 2013).",x:"Les programmes du lycée demandent que le projet pédagogique montre la contribution de l'EPS aux parcours. Le parcours éducatif de santé est le levier le plus directement lié au CA5 et à l'objectif de santé."},
{id:"ki01",th:"PO",p:"",q:"Que dit l'article L401-1 du Code de l'éducation sur le projet d'établissement ?",a:"Élaboré avec la communauté éducative, il définit les modalités particulières de mise en œuvre des programmes nationaux. Le conseil d'administration l'adopte pour trois à cinq ans.",x:"Il fixe aussi la façon d'évaluer les résultats atteints. Dans l'étude de cas, c'est le premier texte à mobiliser : chaque proposition en EPS doit se raccrocher à un axe du projet d'établissement du dossier."},
{id:"ki02",th:"PO",p:"",q:"Quel est le rôle du conseil pédagogique dans un collège ou un lycée ?",a:"Créé par la loi du 23 avril 2005 (art. L421-5) et présidé par le chef d'établissement, il favorise la concertation entre professeurs et prépare la partie pédagogique du projet d'établissement.",x:"Il réunit au moins un professeur principal par niveau et un professeur par champ disciplinaire. Son rôle est consultatif : c'est le conseil d'administration qui adopte le projet. L'équipe EPS y fait entendre ses choix."},
{id:"ki03",th:"PO",p:"",q:"Dans quel cadre s'exerce la liberté pédagogique de l'enseignant (art. L912-1-1 du Code de l'éducation) ?",a:"Dans le respect des programmes et des instructions du ministre, dans le cadre du projet d'école ou d'établissement, avec le conseil et sous le contrôle des corps d'inspection.",x:"Article issu de la loi du 23 avril 2005. Il sert à justifier un choix didactique personnel : tu es libre de tes démarches, à condition qu'elles restent cohérentes avec les programmes et le projet de l'établissement."},
{id:"ki04",th:"PO",p:"",q:"Quand un établissement a-t-il un coordonnateur d'EPS, et quel est son rôle ?",a:"Dès qu'au moins 3 enseignants d'EPS y assurent au moins 50 heures de service par semaine (circulaire n°2015-058 du 29 avril 2015). Il anime le travail collectif de l'équipe et coordonne le projet pédagogique EPS.",x:"C'est une mission rémunérée par une indemnité pour mission particulière (IMP). Le coordonnateur aide aussi le chef d'établissement à organiser les installations et les emplois du temps de l'équipe EPS."},
{id:"ki05",th:"PO",p:"",q:"Qu'est-ce que le conseil école-collège ?",a:"Prévu par l'article L401-4 (loi du 8 juillet 2013) et organisé par le décret du 24 juillet 2013, il associe un collège et les écoles de son secteur pour la continuité pédagogique. Il se réunit au moins deux fois par an.",x:"Coprésidé par le principal et l'IEN, il adopte chaque année un programme d'actions, soumis au conseil d'administration du collège et aux conseils d'école. En EPS, c'est le cadre naturel d'un projet de liaison CM2-6e au cycle 3."},
{id:"ki06",th:"PO",p:"",q:"Quelle circulaire de 2010 organise le développement du sport scolaire, et que dit-elle du projet d'AS ?",a:"La circulaire n°2010-125 du 18 août 2010 (BO n°31 du 2 septembre 2010). Le projet de l'association sportive doit faire partie intégrante du projet d'école et du projet d'établissement.",x:"Elle présente le sport scolaire comme un complément de l'EPS ouvert aux élèves volontaires. Dans l'étude de cas, relier le projet d'AS aux axes du projet d'établissement montre une vision d'ensemble de ton action."},
{id:"ki07",th:"PO",p:"",q:"Que demande la circulaire de 2010 sur le sport scolaire à propos du mercredi après-midi ?",a:"Les chefs d'établissement doivent préserver le mercredi après-midi dans l'emploi du temps des élèves, pour les activités de l'association sportive et les compétitions.",x:"Argument à reprendre si le dossier décrit une AS peu fréquentée parce que des cours ont été placés le mercredi après-midi."},
{id:"ki08",th:"PO",p:"",q:"Qu'est-ce que la journée nationale du sport scolaire ?",a:"Instituée par la circulaire du 18 août 2010, elle fait connaître les activités des associations sportives aux élèves, aux familles et au monde sportif local. Sa date est fixée chaque année par une note de service.",x:"C'est une occasion concrète de recruter de nouveaux licenciés, en particulier des élèves peu sportifs, et de faire vivre le lien entre l'AS et le projet d'établissement."},
{id:"ki09",th:"PO",p:"",q:"Que prévoit la circulaire de 2010 sur le sport scolaire pour les jeunes officiels UNSS ?",a:"Leur formation est systématiquement encouragée et donne lieu à la remise d'un diplôme.",x:"La circulaire du 27 août 2025 cite encore les jeunes dirigeants, jeunes officiels et ambassadeurs. Arbitrer, juger ou organiser fait travailler les responsabilités et la citoyenneté, en lien avec le domaine 3 du socle."},
{id:"ki10",th:"PO",p:"",q:"Qui préside l'UNSS, et quelle est sa mission ?",a:"Le ministre de l'Éducation nationale. Fédération multisports chargée d'une mission de service public, elle organise et développe la pratique sportive des élèves des AS du second degré.",x:"Environ 40 % de ses licenciés sont des filles : un point à reprendre si le dossier décrit une AS peu féminisée."},
{id:"ki11",th:"IN",p:"",q:"Qu'est-ce que le sport partagé à l'UNSS ?",a:"Une formule de compétition qui réunit dans les mêmes équipes des élèves valides et des élèves en situation de handicap, par exemple deux et deux.",x:"Réponse concrète pour un élève d'ULIS ou en situation de handicap dans l'étude de cas : l'AS devient elle aussi un lieu d'inclusion, pas seulement le cours d'EPS."},
{id:"ki12",th:"PO",p:"",q:"Comment le programme d'EPS du lycée GT (2019) présente-t-il l'association sportive ?",a:"Elle s'inscrit en prolongement de l'EPS obligatoire et est accessible à tous les élèves. Elle permet une pratique régulière, l'exercice de responsabilités et la découverte de la vie associative.",x:"Elle contribue aussi à l'éducation à la santé et à la citoyenneté et favorise les rencontres avec d'autres établissements. C'est le texte qui justifie un lien explicite entre ton projet EPS et l'AS."},
{id:"ki13",th:"PO",p:"",q:"Que dit le programme d'EPS du lycée GT (2019) de l'accueil des élèves inaptes ou en situation de handicap ?",a:"« Le lycée doit accueillir tous les élèves quel que soit leur degré d'aptitude partielle ou de handicap. » L'équipe EPS propose des traitements didactiques adaptés à tous les élèves.",x:"Le programme laisse à l'enseignant toute latitude pour concevoir et adapter son enseignement. Dans l'étude de cas, c'est la phrase à citer avant toute adaptation proposée au lycée."},
{id:"ki14",th:"PO",p:"",q:"Que dit le programme d'EPS du cycle 4 (2015) sur l'inclusion ?",a:"« Elle assure l'inclusion, dans la classe, des élèves à besoins éducatifs particuliers ou en situation de handicap. »",x:"Le même texte vise tous les élèves, « filles et garçons ensemble et à égalité, a fortiori les plus éloignés de la pratique physique et sportive ». Ces deux phrases fondent toute adaptation proposée au collège."},
{id:"ki15",th:"PO",p:"",q:"Comment la loi du 11 février 2005 définit-elle le handicap ?",a:"Toute limitation d'activité ou restriction de participation à la vie en société subie dans son environnement, due à une altération substantielle, durable ou définitive d'une ou plusieurs fonctions.",x:"Fonctions physiques, sensorielles, mentales, cognitives ou psychiques, polyhandicap ou trouble de santé invalidant (art. L114 du Code de l'action sociale et des familles). Le mot « environnement » compte : en EPS, adapter la situation réduit le handicap."},
{id:"ki16",th:"PO",p:"",q:"Qu'est-ce que le PPS, et qui l'élabore ?",a:"Le projet personnalisé de scolarisation d'un élève reconnu handicapé. L'équipe pluridisciplinaire de la MDPH l'élabore ; la CDAPH décide (orientation, aide humaine, matériel).",x:"Cadre : circulaire n°2016-117 du 8 août 2016. Le PPS est révisé au moins à chaque changement de cycle. L'équipe pédagogique, donc aussi le professeur d'EPS, le met en œuvre."},
{id:"ki17",th:"IN",p:"",q:"Qu'est-ce que l'équipe de suivi de la scolarisation (ESS) ?",a:"Les professionnels qui mettent en œuvre le PPS. Animée par l'enseignant référent, elle se réunit au moins une fois par an pour l'évaluer.",x:"Le professeur d'EPS, membre de l'équipe pédagogique, peut y apporter ses observations de pratique. Elle se tient avec l'élève ou, s'il est mineur, avec ses représentants légaux."},
{id:"ki18",th:"PO",p:"",q:"À quels élèves s'adresse le plan d'accompagnement personnalisé (PAP) ?",a:"Aux élèves dont les difficultés scolaires durables viennent de troubles des apprentissages (dys, TDAH), sans recours à la MDPH. Le médecin de l'Éducation nationale donne son avis.",x:"Circulaire n°2015-016 du 22 janvier 2015. Le chef d'établissement le rédige ; les enseignants le mettent en œuvre, coordonnés par le professeur principal. Il est révisé chaque année et remplace un éventuel PPRE."},
{id:"ki19",th:"PO",p:"",q:"Qu'est-ce que le projet d'accueil individualisé (PAI), et quel texte l'encadre ?",a:"Un projet pour l'élève atteint d'un trouble de santé durable (asthme, allergie…), à la demande de la famille. Cadre : circulaire du 10 février 2021 (BO n°9 du 4 mars 2021).",x:"Il est établi avec le médecin de l'Éducation nationale et peut prévoir des aménagements, un traitement ou un protocole d'urgence. Le professeur d'EPS doit en connaître le contenu, surtout pour un élève asthmatique ou allergique."},
{id:"ki20",th:"IN",p:"",q:"Qu'est-ce qu'un PPRE ?",a:"Un programme personnalisé de réussite éducative, pour l'élève qui risque de ne pas maîtriser les attendus. Obligatoire en cas de redoublement.",x:"C'est une réponse pédagogique de courte durée, sans avis médical. Ne pas le confondre avec le PAP, réservé aux troubles des apprentissages."},
{id:"ki21",th:"IN",p:"",q:"Quel dispositif pour quel élève : asthmatique, dys sans MDPH, handicap reconnu, difficultés scolaires ?",a:"Asthme ou allergie : PAI. Trouble dys sans MDPH : PAP. Handicap reconnu par la MDPH : PPS. Difficultés sans trouble identifié : PPRE.",x:"Nommer le bon dispositif dans l'étude de cas montre que tu connais l'établissement de l'intérieur. Un PAI reste possible en plus d'un PAP si une pathologie le justifie."},
{id:"ki22",th:"PO",p:"",q:"Comment fonctionnent les ULIS selon la circulaire de 2015 ?",a:"Circulaire n°2015-129 du 21 août 2015. L'orientation relève de la CDAPH. Les élèves suivent des cours en classe ordinaire et se regroupent en ULIS. Au collège, l'effectif ne dépasse pas dix.",x:"Le coordonnateur, enseignant spécialisé, enseigne lors des regroupements, coordonne avec les partenaires et conseille la communauté éducative : c'est la personne ressource du professeur d'EPS."},
{id:"ki23",th:"PO",p:"",q:"Quels sont les trois domaines d'activité des AESH ?",a:"Accompagner l'élève dans les actes de la vie quotidienne, dans l'accès aux activités d'apprentissage, et dans les activités de la vie sociale et relationnelle.",x:"Circulaire n°2017-084 du 3 mai 2017. Le but est de favoriser l'autonomie de l'élève. Les AESH sans diplôme du secteur suivent une formation d'adaptation à l'emploi de 60 heures."},
{id:"ki24",th:"PO",p:"",q:"Que sont les pôles d'appui à la scolarité (PAS) ?",a:"Des pôles qui donnent une première réponse rapide aux élèves à besoins éducatifs particuliers, sans notification MDPH préalable. Ils remplacent peu à peu les PIAL (circulaire du 1er septembre 2025).",x:"Les parents, un professeur ou le chef d'établissement peuvent le saisir. Il associe un coordonnateur de l'Éducation nationale et un éducateur spécialisé. La MDPH reste seule compétente pour reconnaître le handicap."},
{id:"ki25",th:"PO",p:"",q:"Quelle place la circulaire de 2012 sur les élèves allophones donne-t-elle à l'EPS ?",a:"Circulaire n°2012-141 du 2 octobre 2012 : l'inclusion en classe ordinaire est la règle. Pour les élèves peu scolarisés, elle commence par les cours où l'écrit compte moins, comme l'EPS.",x:"Ces élèves suivent en parallèle un enseignement de français en UPE2A. L'EPS est donc souvent l'un des premiers lieux d'inclusion, ce qui demande des consignes très visuelles."},
{id:"ki26",th:"PO",p:"",q:"Un élève peut-il refuser l'EPS pour un motif religieux ?",a:"Non. La circulaire du 18 mai 2004, prise pour la loi du 15 mars 2004, précise que les convictions religieuses ne peuvent justifier un absentéisme sélectif, par exemple en EPS.",x:"Les consignes d'hygiène et de sécurité ne peuvent pas non plus être aménagées pour ce motif. La loi s'applique à toutes les activités sous la responsabilité de l'établissement, à la piscine comme au gymnase."},
{id:"ki27",th:"IN",p:"",q:"Qu'a jugé la CEDH dans l'arrêt Osmanoğlu et Kocabaş c. Suisse (10 janvier 2017) ?",a:"Imposer la natation mixte à des élèves musulmanes ne viole pas la liberté de religion : l'obligation de suivre toute la scolarité l'emporte.",x:"Arrêt utile face à une famille qui refuse la natation mixte : il conforte la règle française, qui n'admet pas de dispense pour motif religieux."},
{id:"ki28",th:"PO",p:"",q:"Que dit la circulaire n°2004-138 du 13 juillet 2004 sur la sécurité en EPS ?",a:"L'enseignant est « le premier artisan de la sécurité des élèves ». L'organisation de l'EPS doit garantir leur sécurité et contribuer à l'éducation à la sécurité.",x:"Elle signale les activités soumises à des règles de sécurité particulières : activités aquatiques, sur la voie publique, en montagne, avec équipements de protection individuelle. À citer dès que tu proposes une de ces APSA."},
{id:"ki29",th:"PO",p:"",q:"Quel texte fixe le référentiel des compétences des professeurs, et comment est-il organisé ?",a:"L'arrêté du 1er juillet 2013 (BO n°30 du 25 juillet 2013) : 14 compétences communes aux professeurs et personnels d'éducation, puis 5 compétences propres aux professeurs (P1 à P5).",x:"Au CAPEPS interne, il permet de relier une proposition à une compétence professionnelle, par exemple la compétence 4, « Prendre en compte la diversité des élèves »."},
{id:"ki30",th:"PO",p:"",q:"Quelles compétences du référentiel de 2013 portent sur la conduite de classe et l'évaluation ?",a:"P3 : construire, mettre en œuvre et animer des situations d'enseignement et d'apprentissage. P4 : organiser le fonctionnement du groupe. P5 : évaluer les progrès et les acquisitions des élèves.",x:"Elles structurent naturellement une étude de cas : concevoir les situations, organiser la classe, évaluer les acquis."},
{id:"ki31",th:"PO",p:"",q:"Quelle circulaire de 2025 fixe la place de l'activité physique et du sport à l'école, et que prévoit-elle ?",a:"La circulaire du 27 août 2025 (BO n°33 du 4 septembre 2025). Elle donne aux professeurs d'EPS un outil commun de mesure des aptitudes physiques et veut généraliser les 30 minutes d'APQ, les jours sans EPS.",x:"Elle cible aussi les élèves les plus éloignés de la pratique, avec le dispositif « Deux heures de sport en plus » en éducation prioritaire."},
{id:"ki32",th:"PO",p:"",q:"Que demande la circulaire du 27 août 2025 à propos des certificats d'inaptitude ?",a:"Promouvoir auprès des familles l'usage des certificats d'inaptitude physique partielle, au lieu des certificats d'inaptitude totale.",x:"Le même texte demande d'assurer l'inclusion des élèves à besoins éducatifs particuliers, dont les aménagements sont suivis dans le livret de parcours inclusif (LPI)."},
{id:"ki33",th:"PO",p:"",q:"Que pose l'article D312-1 du Code de l'éducation sur l'EPS ?",a:"L'EPS fait partie des programmes et horaires de l'enseignement public. Elle doit être adaptée à l'âge et aux possibilités individuelles, déterminées par un contrôle médical.",x:"C'est la base juridique de l'EPS adaptée : un certificat d'inaptitude n'entraîne pas automatiquement l'absence en cours d'EPS."},
{id:"ki34",th:"IN",p:"",q:"Quelle différence entre inaptitude et dispense en EPS ?",a:"L'inaptitude est un constat médical (certificat). La dispense relève du chef d'établissement : un certificat ne vaut pas dispense automatique.",x:"L'élève inapte partiel reste donc en principe en cours, avec une pratique adaptée à ce qu'il peut faire."},
{id:"ki35",th:"IN",p:"",q:"Sur quelles variables jouer pour adapter la pratique d'un élève inapte partiel ou en situation de handicap ?",a:"Le temps, l'espace, les règles et consignes, les rôles et statuts, en gardant l'élève dans le groupe classe autant que possible.",x:"Le certificat d'inaptitude partielle est rédigé en termes d'incapacités fonctionnelles : il dit ce que l'élève ne peut pas faire, et le professeur construit le reste."}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fr = { era: "all", items: [], picks: [], checked: false, good: 0, total: 0 };
const qz = { item: null, opts: [], ans: null, good: 0, total: 0, last: null };

function friseEras(){ const y0 = CY0[prefs.concours] || 0; return ERAS.filter(e => !y0 || e[0] === "all" || (e[2] >= y0 && !(e[3] >= 9999 && e[2] - y0 < 10))).map(e => e[0] === "all" && y0 ? ["all", "Depuis " + y0, y0, 9999] : e); }
function newFrise(){
  const eras = friseEras(), era = eras.find(e => e[0] === fr.era) || eras[0], y0 = CY0[prefs.concours] || 0;
  fr.era = era[0];
  const pool = shuffle(EVENTS.filter(e => e.y >= Math.max(era[2], y0) && e.y <= era[3]));
  const used = new Set(), items = [];
  for (const e of pool) { if (!used.has(e.y)) { used.add(e.y); items.push(e); } if (items.length === 5) break; }
  fr.items = items; fr.picks = []; fr.checked = false;
}
function renderFrise(){
  if (!fr.items.length) newFrise();
  const chips = friseEras().length < 2 ? "" : friseEras().map(([k, l]) => `<button class="chip" data-era="${k}" aria-pressed="${k === fr.era}">${esc(l)}</button>`).join("");
  let body;
  if (!fr.checked) {
    body = `<p class="lead">Touche les événements du plus ancien au plus récent. Touche un événement déjà numéroté pour reprendre à partir de lui.</p>
      <ol class="frise-list">${fr.items.map((e, i) => { const n = fr.picks.indexOf(i); return `<li><button class="fr-item" data-fr="${i}" aria-pressed="${n >= 0}"><span class="badge">${n >= 0 ? n + 1 : ""}</span><span>${esc(e.t)}</span></button></li>`; }).join("")}</ol>
      <div class="row-btns actions"><button class="btn primary" data-act="fr-check"${fr.picks.length < fr.items.length ? " disabled" : ""}>Vérifier</button><button class="btn" data-act="fr-new">Autre frise</button></div>`;
  } else {
    const sorted = fr.items.map((e, i) => i).sort((a, b) => fr.items[a].y - fr.items[b].y);
    const good = sorted.filter((i, rank) => fr.picks[rank] === i).length;
    const y1 = fr.items[sorted[0]].y, y2 = fr.items[sorted[sorted.length - 1]].y, span = Math.max(1, y2 - y1);
    const axis = `<div class="fr-axis" aria-hidden="true"><div class="fr-rail"></div>${sorted.map((i, rank) => { const e = fr.items[i], ok = fr.picks[rank] === i; return `<span class="fr-dot ${rank % 2 ? "dn" : "up"} ${ok ? "ok" : "ko"}" style="left:${(4 + 92 * (e.y - y1) / span).toFixed(1)}%"><b>${e.y}</b></span>`; }).join("")}</div>`;
    body = `<p class="lead"><strong>${good} sur ${fr.items.length}</strong> à la bonne place. Voici l'ordre exact, à l'échelle du temps :</p>${axis}
      <ol class="frise-list">${sorted.map((i, rank) => { const e = fr.items[i], ok = fr.picks[rank] === i; return `<li class="fr-res"><span class="yr">${e.y}</span><span>${esc(e.t)}</span><span class="verdict ${ok ? "ok" : "ko"}">${ok ? "Bien placé" : "Tu l'avais mis en n° " + (fr.picks.indexOf(i) + 1)}</span></li>`; }).join("")}</ol>
      <div class="row-btns actions"><button class="btn primary" data-act="fr-new">Nouvelle frise</button></div>`;
  }
  $("#panel-frise").innerHTML = `${chips ? `<div class="chips era-chips" role="group" aria-label="Période de la frise">${chips}</div>` : ""}
    ${fr.total ? `<p class="scoreline">Cette session : ${fr.good} / ${fr.total} événements bien placés</p>` : ""}${body}`;
}
function newQui(){
  let it;
  do { it = PEOPLE[Math.floor(Math.random() * PEOPLE.length)]; } while (it === qz.last);
  const others = shuffle(Array.from(new Set(PEOPLE.filter(p => p.g === it.g && p.w !== it.w).map(p => p.w)))).slice(0, 3);
  qz.item = it; qz.last = it; qz.opts = shuffle([it.w].concat(others)); qz.ans = null;
}
function renderQui(){
  if (!qz.item) newQui();
  const it = qz.item;
  $("#panel-qui").innerHTML = `<p class="scoreline">${qz.total ? "Cette session : " + qz.good + " / " + qz.total + " bonnes réponses" : "Qui a écrit, fondé ou porté cela ?"}</p>
    <article class="bristol qui">
      <div class="band"><span class="period">${it.g === "A" ? "Auteurs et praticiens" : "Acteurs politiques et institutionnels"}</span></div>
      <p class="q">${esc(it.d)}</p>
      ${qz.ans ? `<div class="reveal"><p class="a">${esc(it.w)}</p></div>` : ""}
    </article>
    <div class="qui-opts">${qz.opts.map((w, i) => { let cls = ""; if (qz.ans) { if (w === it.w) cls = " right"; else if (w === qz.ans) cls = " wrong"; } return `<button class="btn qopt${cls}" data-qa="${esc(w)}"${qz.ans ? " disabled" : ""}><span class="k">${i + 1}</span>${esc(w)}</button>`; }).join("")}</div>
    ${qz.ans ? `<div class="actions"><p class="hint">${qz.ans === it.w ? "Bonne réponse." : "Raté : la réponse est " + esc(it.w) + "."}</p><button class="btn primary wide" data-act="qui-next">Question suivante <span class="k">Entrée</span></button></div>` : ""}`;
}
function answerQui(w){
  if (qz.ans || !qz.item) return;
  qz.ans = w; qz.total++; if (w === qz.item.w) qz.good++;
  games.qui.t++; if (w === qz.item.w) games.qui.g++; persist();
  render(true);
}

/* La grille d'un exercice (intro, para, plan) : même choix pour l'affichage et pour le suivi des compétences. */
function gridKey(x, kind){
  const e = subjEpr(x), f = skFmt(e), c = prefs.concours;
  if (kind === "plan") return f === "b3e1" ? "B1P" : f === "cint" ? "CIPL" : null;

  return f === "b3e1" ? "B1" : f === "b3e2" ? "B2I" : f === "cint" ? "CII" : f === "ai2" ? "AI2" : c === "agreg-int" ? "AI1" : c === "agreg-ext" ? (e === "e2" ? "AE" : "AEC") : e === "e2" ? "INTRO2" : "INTRO";
}

function gridHTML(x, kind, sid, legend){
  const k = gridKey(x, kind); if (!k) return "";
  const chk = chkGet(sid);
  return `<fieldset class="grid-chk"><legend>${esc(legend || "Ta grille d'auto-évaluation")}</legend>${gridCrit(k).map((c, i) => `<label class="chk"><input type="checkbox" data-chk="${i}" data-sid="${sid}"${chk.includes(i) ? " checked" : ""}> ${esc(c)}</label>`).join("")}</fieldset>`;
}

const FB_FMT_OF = { "capeps-int": "cint", "agreg-int": "aint", "agreg-ext": "aext" };

const annDossier = a => !!a && (a.e === "ei" || (a.e === "e2" && a.f === "aint" && /annexe|dossier|présentée?s? ci-dessous|décrite?s? ci-dessous/i.test(a.t)));
const annSrc = a => a && a.src ? (Array.isArray(a.src) ? a.src[1] : a.src) : "";
function fbCtx(x){
  const a = annOf(x);
  if (!a) return ctxText(x);

  return d ? "Éléments du dossier d'établissement relevés par le candidat (le sujet officiel complet n'est pas reproduit ici) :\n" + d.slice(0, 3000)

}

/* Champ « Dossier du sujet » : le candidat y relève ce que dit l'annexe, pour lui et pour le retour de Claude. */
function dossierHTML(x){
  const a = annOf(x); if (!annDossier(a)) return "";
  const v = txGet("d:" + x.id) || "", src = annSrc(a);
  return `<details class="sj-dos"${v.trim() ? "" : " open"}><summary>Le dossier du sujet${v.trim() ? " · " + plural(wordCount(v), "mot") : ""}</summary>

}

  }
  $("#panel-sujets").innerHTML = `<div class="chips era-chips" role="group" aria-label="Axe des sujets">${chips}</div>${modes}${body}
    <p class="sj-help">${sj.cur && sj.cur.annale ? "Sujet officiel de concours. Le retour de Claude est un premier regard, pas le corrigé du jury : relis aussi le rapport du jury dans l'onglet Annales." : (sj.cur && isB3(sj.cur) ? "Sujet conçu par Bristol EPS sur le modèle du sujet officiel de 2026 ; ce n'est pas un sujet de concours." : !sj.cur && sj.src === "ann" ? "Sujets officiels de ton concours. Le retour de Claude est un premier regard, pas le corrigé du jury." : "Ces sujets sont écrits pour l'entraînement ; ce ne sont pas des sujets officiels.")} Les cartes proposées sont des points d'appui, pas un plan.</p>`;

"t": "« Si la nécessité de faire bouger les enfants et les adolescents est désormais reconnue, les moyens d'y parvenir restent à développer. Chez l'enfant comme chez l'adulte, la pratique régulière d'une activité physique, favorise le maintien ou l'amélioration de la forme physique, procure des bénéfices sur le plan psychologique et social et a un effet favorable sur plusieurs aspects de la santé… La pratique régulière d'activité physique pendant l'enfance et l'adolescence dépasse ses effets immédiats sur la santé, pour au moins deux raisons : pratiquée avec plaisir, elle prédit le niveau de pratique d'activité physique du futur adulte ; nombre de bienfaits de l'activité physique pratiquée pendant l'enfance se prolongent jusqu'à l'âge adulte, indépendamment du degré d'activité de ce dernier. …Plus largement, la pratique d'activités physiques favorise la cohésion et l'intégration sociale dès lors qu'elles sont organisées dans un cadre facilitant l'accès à tous et la mixité des publics. En favorisant la concentration et la confiance en soi, elles pourraient, de plus, contribuer à de meilleurs résultats scolaires. » Etude de l'institut national de prévention et d'éducation pour la santé (INPES), « Promouvoir l'activité physique des jeunes », 2011. L'EPS actuellement enseignée au lycée prépare-t-elle suffisamment les lycéens à poursuivre une activité physique régulière, dont nous connaissons tous les bénéfices, quelle que soit la situation dans laquelle ils vont se retrouver après leurs études secondaires ? A partir d'exemples concrets, vous justifierez votre prise de position et illustrerez vos propositions en vous appuyant, en tant que de besoin, sur les données contextuelles proposées en annexe.",

async function pullAndMerge(){
  const r = await api("GET", "/api/progress");
  if (r.status === 401) { signedOut(); return; }
  if (r.status !== 200) { setStatus("offline"); return; }
  const remote = normRemote(r.data.data);
  const m = merge(remote);
  applyMerged(m);
  srv.base = r.data.updatedAt || 0;
  if (!sameData(normRemote(m), remote)) { srv.dirty = true; await srvFlush(); } else setStatus("cloud");
  if (done === 0 && !flipped) buildQueue();
  render();
}
function srvSchedule(){
  if (acct.status !== "in") return;
  srv.dirty = true; setStatus("saving");

async function srvFlush(){
  if (srv.saving || !srv.dirty || acct.status !== "in") return;
  srv.saving = true; srv.dirty = false;
  const r = await api("PUT", "/api/progress", { data: syncPayload(), base: srv.base });
  srv.saving = false;
  if (r.status === 200) { srv.base = r.data.updatedAt; srv.retries = 0; setStatus("cloud"); }
  else if (r.status === 409 && srv.retries < 3) {
    /* Un autre appareil a écrit entre-temps : on fusionne, puis on renvoie. */
    srv.retries++;
    applyMerged(merge(normRemote(r.data.data)));
    srv.base = r.data.updatedAt; srv.dirty = true;
    if (done === 0 && !flipped) buildQueue();
    render();
  }
  else if (r.status === 401) { signedOut(); return; }
  else { setStatus("offline"); srv.dirty = true; clearTimeout(srv.timer); srv.timer = setTimeout(srvFlush, 15000); return; }

}

async function submitAccount(kind){

  const pw = ($("#acct-pw") || {}).value || "";
  const confirmTxt = (($("#acct-confirm") || {}).value || "").trim();
  const keepEmail = email;
  const fail = (m) => { acct.busy = false; acctSetMsg(m); renderAccount(); const e = $("#acct-email"); if (e) e.value = keepEmail; };
  if (kind !== "delete" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Saisis une adresse e-mail valide.");
  if ((kind === "register" || kind === "recover") && pw.length < 10) return fail("Le mot de passe doit faire au moins 10 caractères.");

  if (kind === "recover" && rk.replace(/[^A-Za-z0-9]/g, "").length !== 25) return fail("La clé de secours compte 25 caractères (5 groupes de 5).");

  let r;
  if (kind === "login") r = await api("POST", "/api/auth/login", { email, key });
  else if (kind === "register") r = await api("POST", "/api/auth/register", { email, key });
  else if (kind === "recover") r = await api("POST", "/api/auth/recover", { email, key, recoveryKey: rk });

  if (kind === "register" && r.data && r.data.error === "email_taken") { acct.view = "login"; renderAccount(); const e = $("#acct-email"); if (e) e.value = email; acctSetMsg("Un compte existe déjà avec cet e-mail : saisis ton mot de passe pour te connecter.", "ok"); renderAccount(); const e2 = $("#acct-email"); if (e2) e2.value = email; const p2 = $("#acct-pw"); if (p2) p2.focus(); return; }

  if (kind === "delete") { signedOut(); acctSetMsg("Ton compte a été supprimé.", "ok"); acct.view = "login"; renderAccount(); toast("Compte supprimé."); return; }

  else acct.view = "profile";
  await signedIn(r.data.email, { hasPassword: true, google: false });
  acctSetMsg(kind === "register" ? "Compte créé. Ta progression est maintenant synchronisée." : kind === "recover" ? "Mot de passe changé." : "Connecté. Ta progression est synchronisée.", "ok");
  renderAccount();
  toast(kind === "register" ? "Compte créé." : "Connecté.");
}

    const u = new URL(location.href); ret = { c: u.searchParams.get("connexion"), r: u.searchParams.get("raison"), lie: u.searchParams.get("lie"), detail: u.searchParams.get("detail") };

  const cfg = await api("GET", "/api/auth/config");

  /* Hors ligne : on garde l'accès connu (planCache) jusqu'au retour du réseau. */
  billingReturn();
  if (ret && ret.c === "google" && acct.status === "in") {
    if (welcomeSeen() === false) hideWelcome();

  }
}

    <div class="row-btns w-go">${ptLast() ? `<button class="btn primary" data-act="welcome-start">Commencer ma première séance</button>` : `<button class="btn primary" data-act="pt-start">Faire le test de positionnement (3 min)</button><button class="btn" data-act="welcome-start">Commencer directement</button>`}<button class="btn" data-act="welcome-close">Fermer</button></div>
    <details class="w-more"${welcomeHelp ? " open" : ""}><summary>Comment ça marche</summary>
    <p class="w-lead">${(() => { const c = CONCOURS.find(x => x.id === prefs.concours); const G = { e1: "écrit 1", e2: prefs.concours === "capeps-int" ? "connaissances pour justifier tes propositions" : "écrit 2", tx: "textes officiels" }; const g = ["e1", "e2", "tx"].filter(relHas).map(k => G[k]); const lst = g.length > 1 ? g.slice(0, -1).join(", ") + " et " + g[g.length - 1] : g[0] || ""; const ex = isB3Conc() ? "des entraînements au format de ton concours (questions, étude d'épisodes)" : prefs.concours === "capeps-int" ? "des entraînements à l'étude de cas sur les annales" : "des entraînements à la dissertation"; return `Pour ${esc(c ? c.t : "ton concours")} : ${concCards().length} fiches (${lst})${relHas("e1") ? ", des récits de synthèse" : ""} et ${ex}.`; })()}</p>
    <p class="w-sub">Quatre espaces</p>
    <ul class="w-spaces">
      <li class="w-space"><b>Accueil</b><span>Le compte à rebours jusqu'à tes écrits, ta séance du jour en un bouton${relHas("e1") ? " (les écrits s'enchaînent)" : ""} et un exercice d'écriture.</span></li>
      <li class="w-space"><b>Réviser</b><span>La séance de cartes, toutes les fiches, la frise, le quiz « Qui ? », les fils rouges et les références à citer. Celles que tu rates reviennent vite, celles que tu sais reviennent au moment où tu risques de les oublier.</span></li>
      <li class="w-space"><b>Écrire</b><span>Sujets d'entraînement avec retour de Claude, concours blanc chronométré, annales de ton concours et méthode des écrits.</span></li>
      <li class="w-space"><b>Progrès</b><span>Ton niveau, ta couverture du programme, ton plan jusqu'aux écrits, les rappels, tes succès, ton concours et d'où vient le contenu.</span></li>
    </ul>
    <p><button class="linkbtn" data-act="go-sources">D'où vient le contenu ?</button></p>
    <div class="w-cols"><div>
    <p class="w-sub">Ta première séance</p>
    <ol class="w-steps">
      <li>Lis la question et cherche la réponse dans ta tête.</li>
      <li>Retourne la carte (bouton ou touche Espace).</li>
      <li>Sois honnête : Raté, Hésité ou Su (touches 1, 2 ou 3).</li>
    </ol>
    <p class="w-note">${isPremium() ? "De nouvelles cartes chaque jour, au rythme calculé d'après la date de ton concours (dix par jour sans date)." : FREE_NEW + " nouvelles cartes par jour sur un écrit en version découverte ; l'accès complet ouvre tous les écrits, au rythme calculé d'après la date de ton concours."} Ta progression est enregistrée automatiquement${STANDALONE ? " dans ce navigateur ; crée un compte (bouton « Se connecter ») pour la retrouver sur tous tes appareils" : ""}.${STANDALONE ? " Le retour de Claude sur tes plans et tes introductions fait partie de l'accès complet." : ""}</p>
    </div><div>
    <p class="w-sub">Bon à savoir</p>
    <p class="w-note">${relHas("e1") ? "Les thèmes de l'écrit 1 regroupent les cartes d'histoire de l'EPS par grands axes, et seules les périodes au programme de ton concours sont proposées. Le classement de chaque carte dans un axe est un choix de travail, à discuter. " : prefs.concours === "capeps-int" ? "Les fiches suivent le programme de l'écrit : les textes officiels, et les connaissances d'intervention et d'évaluation qui servent à justifier tes propositions. " : ""}Chaque carte revient juste avant le moment où tu risques de l'oublier (algorithme FSRS) : quelques jours au début, puis des semaines. Le contenu de base est à recouper avec tes ouvrages de préparation.</p>
    </div></div>
    ${welcomeHelp ? helpExtraHTML() : ""}
    <details class="w-lex" id="w-lex"><summary>Les sigles du concours (${LEX_ALL.length})</summary>${lexHTML()}</details>
    ${installHTML()}
    <div class="w-disp"><p class="w-sub">Affichage</p>${themeChipsHTML()}</div>
    </details>`;
  if (welcomeHelp) {
    /* Mode Aide : une vraie page d'aide, sans les boutons de démarrage. */
    const t = el.querySelector("#welcome-title"); if (t) t.textContent = "Aide";
    const p = el.querySelector(".w-pos"); if (p) p.textContent = "Comment fonctionne le site, les raccourcis, les questions fréquentes et les sigles. Tu peux aussi tout chercher avec la loupe.";
    const go = el.querySelector(".w-go"); if (go) go.innerHTML = `<button class="btn" data-act="gs-open">Rechercher dans le site</button><button class="btn" data-act="welcome-close">Fermer l'aide</button>`;
    const m = el.querySelector(".w-more summary"); if (m) m.textContent = "Comment ça marche";
  }
}
function helpExtraHTML(){
  const touch = typeof matchMedia === "function" && matchMedia("(pointer:coarse)").matches;
  const faq = [
    ["Où sont gardées ma progression et mes copies ?", "Sur cet appareil, et dans ton compte si tu te connectes : tu les retrouves alors sur tous tes appareils. Rien n'est publié."],
    ["Quand mon texte est-il envoyé à Claude ?", "Seulement quand tu demandes un retour ou une correction. Le serveur ne garde pas le texte à cette occasion."],
    ["Le site marche-t-il sans connexion ?", "Oui pour les fiches, les sujets et la méthode. Les retours de Claude et la synchronisation demandent une connexion."],
    ["Comment changer de concours ?", "Avec « Changer » à côté du nom de ton concours, ou depuis l'accueil. Tout le site se règle alors sur le nouveau concours ; ta progression est gardée."],
    ["Comment régler mon plan ?", "Dans Progrès, indique ton temps en semaine et le week-end : le plan règle le nombre de nouvelles cartes et la place des sujets et des concours blancs."],
    ["J'ai trouvé une erreur dans une fiche.", "Au dos de la fiche, « Signaler une erreur » : chaque signalement est lu, et tu peux laisser ton adresse pour être prévenu de la correction."]
  ];
  return `<details class="w-more w-help" open><summary>Questions fréquentes</summary>${faq.map(([q, a]) => `<details class="w-faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}
    <p><button class="linkbtn" data-act="go-sources">D'où vient le contenu, qui est derrière le site, proposer une relecture</button></p></details>
    ${touch ? `<details class="w-more w-help"><summary>Gestes</summary><ul class="w-steps"><li>Touche la carte pour la retourner.</li><li>Glisse-la à droite pour « Su », à gauche pour « Raté ».</li></ul></details>`
      : `<details class="w-more w-help"><summary>Raccourcis clavier</summary><ul class="keys hk"><li><span class="k">Espace</span>Retourner la carte</li><li><span class="k">1</span><span class="k">2</span><span class="k">3</span>Raté, Hésité, Su</li><li><span class="k">U</span>Annuler la dernière réponse</li><li><span class="k">Entrée</span>Question suivante du test</li><li><span class="k">Échap</span>Fermer une fenêtre</li></ul></details>`}`;
}
/* ---------- Application installable et hors ligne (site uniquement) ---------- */
let installEvt = null;
const isInstalled = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installHTML(){
  if (!STANDALONE || isInstalled()) return "";
  const how = installEvt ? `<button class="btn" data-act="install">Installer l'application</button>`
    : isIOS() ? `<span>Sur iPhone ou iPad, dans Safari : bouton Partager, puis « Sur l'écran d'accueil ».</span>`
    : `<span>Dans le menu du navigateur : « Installer l'application » ou « Ajouter à l'écran d'accueil ».</span>`;
  return `<div class="w-install"><p class="w-sub">Sur ton téléphone</p><p class="w-note">Installe Bristol EPS comme une application : elle s'ouvre en plein écran et tes révisions de cartes marchent sans connexion (le retour de Claude et la synchronisation reprennent au retour du réseau).</p><p class="w-inst-how">${how}</p></div>`;
}
if (STANDALONE) {
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!$("#welcome").hidden) renderWelcome(); });
  window.addEventListener("appinstalled", () => { installEvt = null; if (!$("#welcome").hidden) renderWelcome(); toast("Bristol EPS est installé."); });
  window.addEventListener("offline", () => { setStatus("offline"); toast("Hors ligne : tes révisions restent enregistrées ici."); });
  window.addEventListener("online", () => { if (acct.status === "in") pullAndMerge().then(txPull).catch(() => {}); else setStatus("local"); });
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
  }
}
/* Le bloc de bienvenue ne s'affiche que sur l'accueil. */
let welcomeOpen = false, welcomeHelp = false;
function showWelcome(focus){ welcomeOpen = true; welcomeHelp = !!focus; renderWelcome(); $("#welcome").hidden = view !== "home"; renderHome(); if (focus) { const h = $("#welcome-title"); h.tabIndex = -1; h.focus(); } }
function hideWelcome(){ welcomeOpen = false; $("#welcome").hidden = true; welcomeSetSeen(); renderHome(); }

/* Taille du texte */
const BIG_KEY = "bristol-eps-big";
function applyBig(on){ document.documentElement.classList.toggle("big", on); $("#textsize").setAttribute("aria-pressed", String(on)); }
try { applyBig(localStorage.getItem(BIG_KEY) === "1"); } catch (e) {}
$("#textsize").addEventListener("click", () => { const on = !document.documentElement.classList.contains("big"); applyBig(on); try { localStorage.setItem(BIG_KEY, on ? "1" : "0"); } catch (e) {} });
document.addEventListener("keydown", e => {
  if (view === "revise" && lastGrade && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.target.closest("input, textarea, select")) { e.preventDefault(); undoGrade(); return; }
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (view === "qui") {
    if (!qz.ans && ["1","2","3","4"].includes(e.key)) { const w = qz.opts[+e.key - 1]; if (w) { e.preventDefault(); answerQui(w); } }
    else if (qz.ans && (e.key === "Enter" || e.key === " ") && !e.target.closest("button")) { e.preventDefault(); newQui(); render(); }
    return;
  }
  if (view !== "revise") return;
  if (listen.on) {
    const k = e.key;
    if (k === "1" || k === "3") { e.preventDefault(); listenGrade(k === "1" ? "rate" : "su"); }
    else if (k === " " && !e.target.closest("button")) { e.preventDefault(); listen.paused ? listenRun() : listenPause(); }
    else if (k === "r" || k === "R") { e.preventDefault(); listenRun(); }
    else if (k === "Escape") { e.preventDefault(); listenStop(false); }
    return;
  }
  if ((e.key === "u" || e.key === "U") && lastGrade) { e.preventDefault(); undoGrade(); return; }
  if (!queue.length) return;
  if (!flipped && (e.key === " " || e.key === "Enter")) { if (e.target.closest("button")) return; e.preventDefault(); flipped = true; render(); flipFocus(); return; }
  if (flipped && ["1","2","3"].includes(e.key)) { e.preventDefault(); grade({ "1": "rate", "2": "hesite", "3": "su" }[e.key]); }
});
$("#f-p").innerHTML = PERIODS.concat([NONE_P]).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
$("#f-p").value = NONE_P;
$("#f-t").innerHTML = EPR.map(g => `<optgroup label="${esc(g.t)}">${g.th.map(k => `<option value="${k}">${esc(THEMES[k])}</option>`).join("")}</optgroup>`).join("") + `<option value="">${NONE_T}</option>`;
$("#f-t").value = "";
document.addEventListener("submit", e => {
  if (e.target.dataset && e.target.dataset.goalform) {
    e.preventDefault();
    const v = ($("#exam-date") || {}).value || "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast("Choisis une date valide."); return; }
    prefs = Object.assign({}, prefs, { examDate: v, t: Date.now() }); goalEdit = false; persist(); done = 0; buildQueue(); render();
    const g = goalInfo(); toast(g && g.newPerDay ? `Objectif : ${g.newPerDay} nouvelles cartes par jour.` : "Date enregistrée.");
    return;
  }
  if (e.target.dataset && e.target.dataset.pwwait) { e.preventDefault(); const v = (($("#pw-wait-in") || {}).value || "").trim(); if (v) pwWait(v); return; }
  if (e.target.dataset && e.target.dataset.pwcode) { e.preventDefault(); const v = (($("#pw-code-in") || {}).value || "").trim(); if (v) pwRedeem(v); return; }
  if (e.target.dataset && e.target.dataset.reportform) { e.preventDefault(); reportSend(e.target); return; }
  if (e.target.dataset && e.target.dataset.relform) {
    e.preventDefault();
    const role = $("#rel-role").value.trim(), mail = $("#rel-mail").value.trim(), msg = $("#rel-msg").value.trim(), er = $("#rel-err");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) || msg.length < 5) { er.hidden = false; er.textContent = "Indique ton adresse e-mail et quelques mots sur ce que tu proposes."; $(!/@/.test(mail) ? "#rel-mail" : "#rel-msg").focus(); return; }
    api("POST", "/api/report", { card: "relecteur", kind: "relecture", msg: `${role} | ${mail} | ${msg}`.slice(0, 1000), q: "" }).then(r => {
      if (r.status === 200) { relSent = true; renderSources(); toast("Merci : ton message est arrivé."); }
      else { er.hidden = false; er.textContent = r.status === 429 ? "Trop d'envois pour l'instant. Réessaie dans une heure." : "L'envoi n'a pas abouti. Réessaie dans un instant."; }
    });
    return;
  }
  if (e.target.dataset && e.target.dataset.icsform) { e.preventDefault(); icsDownload(e.target); return; }
  if (e.target.dataset && e.target.dataset.acctform) { e.preventDefault(); submitAccount(e.target.dataset.acctform); return; }
  if (!e.target.dataset || !e.target.dataset.codeform) return;
  e.preventDefault();
  const v = ($("#access-code").value || "").trim();
  if (!v) { $("#access-code").focus(); return; }
  codeSet(v); fb.note = ""; if (fb.status === "error") fb.status = "idle";
  render(); toast("Code enregistré.");
  const b = $('[data-act="fb-ask"]'); if (b) b.focus({ preventScroll: true });
});
$("#add-form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("#f-q").value.trim(), a = $("#f-a").value.trim(), x = $("#f-x").value.trim(), p = $("#f-p").value, th = $("#f-t").value;
  if (!q || !a) { $("#f-err").hidden = false; return; }
  $("#f-err").hidden = true;
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  custom = custom.concat([{ id, th, p, q, a, x }]);
  const r = $("#f-r").value.trim().slice(0, 300); if (r) refs[id] = { v: r, t: Date.now() };
  persist();
  $("#f-q").value = ""; $("#f-a").value = ""; $("#f-x").value = ""; $("#f-r").value = "";
  toast("Carte ajoutée. Elle apparaîtra dans ta prochaine séance."); $("#f-q").focus();
});

localLoad(); txLoad(); backfillWritten(); checkAch(true); localSave();
/* Le sujet en cours d'écriture est retrouvé après un rechargement (le brouillon, lui, est déjà enregistré). */
try {
  const k = JSON.parse(localStorage.getItem("bristol-eps-sj") || "null");
  if (k && k.id) {
    const an = ANNALES.find(x => x.id === k.id);
    const s = SUBJECTS.concat(SUBJECTS2, SUBJECTS_B1, SUBJECTS_B2).find(x => x.id === k.id) || (an && annSubject(an));
    if (s && relHas(s.epr === "e2" ? "e2" : "e1")) { sj.cur = s; sj.epr = s.epr === "e2" ? "e2" : "e1"; if (["plan", "intro", "para"].includes(k.mode)) sj.mode = k.mode; if (an) sj.src = "ann"; }
  }
} catch (e) {}
try { const u = new URL(location.href), q = u.searchParams.get("concours"); if (q) { u.searchParams.delete("concours"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); if (concById(q) && prefs.concours !== q) chooseConcours(q); } } catch (e) {}
buildQueue(); render(); blancCheck();
{ const v0 = routeFromHash(); if (v0 && v0 !== "home" && prefs.concours) { routeSilent = true; try { setView(v0); } finally { routeSilent = false; } } }
if (!welcomeSeen() && !Object.keys(progress).length) showWelcome(false);
connect().catch(() => { if (!store.ref) setStatus("local"); });
initAccount().catch(() => {});
track("open");
</script>
