{id:"n233",th:"R",p:"Depuis 2000",q:"Quelles écoles remplacent les IUFM en 2013 ?",a:"Les écoles supérieures du professorat et de l'éducation (ESPE), créées par la loi d'orientation et de programmation pour la refondation de l'école de la République du 8 juillet 2013.",x:"Elles portent les masters MEEF (métiers de l'enseignement, de l'éducation et de la formation), qui associent formation universitaire, stages et alternance en deuxième année."},
{id:"n234",th:"R",p:"Depuis 2000",q:"Que deviennent les ESPE avec la loi pour une école de la confiance du 26 juillet 2019 ?",a:"Elles deviennent les instituts nationaux supérieurs du professorat et de l'éducation (INSPÉ), à la rentrée 2019.",x:"La réforme qui suit replace le concours en fin de deuxième année de master et ajoute un oral d'entretien."},
{id:"n235",th:"R",p:"Depuis 2000",q:"Que change la réforme de 2025 pour le recrutement des professeurs d'EPS ?",a:"Le CAPEPS externe se passe désormais en licence (bac+3) ; les lauréats suivent ensuite deux années de formation rémunérée qui mènent au master.",x:"Décret du 17 avril 2025 : première session en 2026. Un concours transitoire à bac+5 a sa dernière session en 2027."},
{id:"n236",th:"R",p:"Depuis 2000",q:"Comment le contrôle en cours de formation d'EPS au baccalauréat général et technologique est-il organisé à partir de la session 2013 ?",a:"Trois épreuves dans trois compétences propres différentes, dont au moins deux activités de la liste nationale ; le niveau 4 des programmes est exigible pour l'enseignement commun.",x:"Arrêté du 21 décembre 2011 et circulaire du 8 juin 2012. La note est la moyenne des trois épreuves, harmonisée par une commission académique."},
{id:"n237",th:"R",p:"Depuis 2000",q:"Comment l'EPS est-elle évaluée au baccalauréat général et technologique depuis la session 2022 ?",a:"Par un contrôle en cours de formation de trois épreuves, sur trois activités relevant de trois champs d'apprentissage différents, co-évaluées par deux enseignants.",x:"Arrêté du 28 juin 2019, circulaire du 26 septembre 2019 et note de service du 28 juillet 2021. L'AFL1 est évalué le jour de l'épreuve, les AFL2 et AFL3 au fil de la séquence."},
{id:"n238",th:"R",p:"Depuis 2000",q:"Comment l'EPS est-elle évaluée dans la voie professionnelle selon l'arrêté du 11 juillet 2005 ?",a:"En contrôle en cours de formation pendant l'année terminale : trois épreuves pour le baccalauréat professionnel, deux pour le CAP et le BEP, chacune notée sur 20.",x:"Applicable à partir de la session 2006. Examen terminal pour les candidats individuels ; épreuves adaptées pour les candidats en situation de handicap ou d'inaptitude partielle."},
{id:"n239",th:"T",p:"Depuis 2000",q:"Quelles compétences structurent les programmes d'EPS du lycée de 2010 ?",a:"Cinq compétences propres à l'EPS (CP1 à CP5) et trois compétences méthodologiques et sociales (CMS).",x:"BO spécial n° 4 du 29 avril 2010. Les CP vont de la performance motrice maximale (CP1) à l'entretien de soi (CP5) ; les programmes de 2019 les remplacent par cinq champs d'apprentissage."},
{id:"n240",th:"R",p:"Depuis 2000",q:"Combien de compétences compte le socle commun de connaissances et de compétences de 2006 ?",a:"Sept, dont « les compétences sociales et civiques » et « l'autonomie et l'initiative ».",x:"Prévu par la loi d'orientation et de programme pour l'avenir de l'école du 23 avril 2005 et défini par le décret du 11 juillet 2006 ; remplacé en 2015 par un socle à cinq domaines."},
{id:"n241",th:"H",p:"1981-2000",q:"Quel historien publie en 1991 Sport et éducation sous Vichy (1940-1944) ?",a:"Jean-Louis Gay-Lescot.",x:"Ouvrage de référence sur la politique sportive et d'éducation physique du régime de Vichy, toujours cité par les travaux récents sur la période."},
{id:"n242",th:"H",p:"1981-2000",q:"Quel sociologue analyse en 1995 l'essor des sports de glisse dans Génération glisse ?",a:"Alain Loret.",x:"Il y voit de nouveaux rapports au corps et à la nature, centrés sur le jeu, le plaisir et le défi personnel plus que sur la compétition : le sport passerait d'une utilité publique à une utilité ludique."},
{id:"n243",th:"H",p:"Depuis 2000",q:"Quelle historienne étudie la place des femmes dans l'alpinisme de 1874 à 1919 ?",a:"Cécile Ottogalli-Mazzacavallo, dans Femmes et alpinisme. Un genre de compromis (2006).",x:"Un livre issu d'une thèse, utile pour les sujets sur le genre et l'accès des femmes aux pratiques physiques."},
{id:"n244",th:"H",p:"Depuis 2000",q:"Quelle synthèse d'histoire du sport Patrick Clastres et Paul Dietschy publient-ils en 2006 ?",a:"Sport, culture et société en France du XIXe siècle à nos jours (Hachette, collection Carré histoire).",x:"Une synthèse universitaire qui relie l'histoire du sport et de l'éducation physique à celle de la société française."},
{id:"n245",th:"H",p:"Depuis 2000",q:"Quelle biographie Jean-Michel Delaplace consacre-t-il à Georges Hébert en 2005 ?",a:"Georges Hébert, sculpteur de corps (Vuibert).",x:"Plus de 400 pages sur le fondateur de la méthode naturelle : de quoi situer Hébert dans son époque plutôt que de le réduire à quelques formules."},
{id:"n246",th:"H",p:"1981-2000",q:"Quel ouvrage collectif dirigé par Pierre Arnaud et Thierry Terret interroge en 1996 l'identité du sport féminin ?",a:"Histoire du sport féminin (L'Harmattan), dont le premier tome s'intitule Le sport au féminin : histoire et identité.",x:"Issu d'un colloque tenu à Lyon en 1994 : l'émergence du sport féminin, les résistances qu'il rencontre et leurs conséquences pour l'EPS."},
{id:"n247",th:"H",p:"1967-1981",q:"Quelle synthèse d'histoire de l'enseignement Antoine Prost publie-t-il en 1968 ?",a:"Histoire de l'enseignement en France, 1800-1967 (Armand Colin).",x:"Pour replacer l'histoire de l'EPS dans celle de l'école : obligation scolaire, ordres d'enseignement, démocratisation."},
/* ---------- Écrit 2 : apprentissage moteur et techniques corporelles ---------- */
{id:"am01",th:"AM",p:"",q:"Quelles sont les trois étapes de l'apprentissage moteur selon Fitts et Posner (1967) ?",a:"L'étape cognitive, l'étape associative, puis l'étape autonome.",x:"Au fil des étapes, le contrôle attentionnel diminue : l'habileté s'automatise et libère l'attention pour l'environnement et la tactique."},
{id:"am02",th:"AM",p:"",q:"Que postule la théorie du schéma de Schmidt (1975) ?",a:"Le sujet construit des programmes moteurs généralisés, paramétrés grâce à un schéma de rappel et contrôlés par un schéma de reconnaissance.",x:"Conséquence pédagogique majeure : la variabilité de la pratique renforce le schéma et favorise le transfert à des situations nouvelles."},
{id:"am03",th:"AM",p:"",q:"Quel problème Nikolaï Bernstein (1967) a-t-il formulé à propos du contrôle du mouvement ?",a:"Le problème des degrés de liberté : comment le système nerveux maîtrise un nombre immense d'articulations et de muscles.",x:"Le débutant « gèle » les degrés de liberté (raideur), puis les libère progressivement et finit par exploiter les forces passives et réactives."},
{id:"am04",th:"AM",p:"",q:"Qu'oppose-t-on sous les termes de contrôle en boucle fermée et en boucle ouverte ?",a:"La boucle fermée corrige le mouvement en cours grâce aux rétroactions ; la boucle ouverte exécute un programme préétabli sans correction en cours de route.",x:"Adams (1971) défend un modèle en boucle fermée. Les gestes très rapides (frappe, lancer) relèvent surtout de la boucle ouverte."},
{id:"am05",th:"AM",p:"",q:"Quelle différence fait-on entre connaissance du résultat (CR) et connaissance de la performance (CP) ?",a:"La CR informe sur le résultat de l'action par rapport au but ; la CP informe sur la façon dont le mouvement a été réalisé.",x:"Ce sont deux formes de feedback extrinsèque. En EPS, la CP aide à corriger la technique, la CR à évaluer l'efficacité."},
{id:"am06",th:"AM",p:"",q:"Qu'est-ce que l'hypothèse du guidage (Salmoni, Schmidt et Walter, 1984) ?",a:"Un feedback trop fréquent améliore la performance immédiate mais crée une dépendance qui nuit à l'apprentissage durable.",x:"D'où l'intérêt de réduire progressivement la fréquence des retours (feedback estompé) et de laisser l'élève s'autoévaluer."},
{id:"am07",th:"AM",p:"",q:"Qu'a montré l'effet d'interférence contextuelle (Shea et Morgan, 1979) ?",a:"Une pratique aléatoire de plusieurs tâches donne de moins bons résultats pendant l'acquisition, mais une meilleure rétention et un meilleur transfert qu'une pratique en blocs.",x:"Il faut distinguer performance immédiate et apprentissage : ce qui paraît efficace dans la séance ne l'est pas forcément à long terme."},
{id:"am08",th:"AM",p:"",q:"Que distingue-t-on entre pratique massée et pratique distribuée ?",a:"La pratique massée enchaîne les essais avec peu de repos ; la pratique distribuée les espace dans le temps.",x:"La pratique distribuée favorise en général la rétention : un argument pour revenir sur une habileté sur plusieurs leçons plutôt que de tout concentrer."},
{id:"am09",th:"AM",p:"",q:"Quels sont l'intérêt et la limite d'une méthode analytique d'apprentissage ?",a:"Elle décompose le geste en éléments travaillés séparément : utile pour une tâche complexe mais peu organisée, elle risque de perdre la coordination de l'ensemble.",x:"La méthode globale conserve le sens et la coordination de l'action. Le choix dépend de la complexité et de l'organisation de la tâche."},
{id:"am10",th:"AM",p:"",q:"Qu'est-ce qu'une affordance selon James Gibson (1979) ?",a:"Une possibilité d'action offerte par l'environnement et perçue directement par le sujet en fonction de ses capacités.",x:"Fondement de l'approche écologique : on apprend en s'accordant aux informations de l'environnement plutôt qu'en appliquant des représentations."},
{id:"am11",th:"AM",p:"",q:"Comment l'approche dynamique conçoit-elle l'apprentissage moteur ?",a:"Comme la transformation de coordinations spontanées stables (attracteurs) en nouvelles coordinations, par des phases d'instabilité.",x:"Issue des travaux de Kelso, elle a été diffusée en EPS notamment par Didier Delignières : apprendre, c'est déstabiliser une coordination existante."},
{id:"am12",th:"AM",p:"",q:"Quelles sont les trois catégories de contraintes décrites par Newell (1986) ?",a:"Les contraintes liées à l'organisme, à l'environnement et à la tâche.",x:"Le comportement moteur émerge de leur interaction. L'enseignant agit surtout sur les contraintes de la tâche et du milieu."},
{id:"am13",th:"AM",p:"",q:"Quel type de focalisation attentionnelle favorise l'apprentissage selon les travaux de Gabriele Wulf ?",a:"Une focalisation externe, sur l'effet du mouvement, plutôt qu'interne, sur les parties du corps.",x:"Exemple : viser la trajectoire du ballon plutôt que penser au poignet. Les consignes de l'enseignant peuvent orienter cette focalisation."},
{id:"am14",th:"AM",p:"",q:"Quel avantage les travaux de Masters (1992) attribuent-ils à l'apprentissage implicite ?",a:"Une habileté apprise avec peu de connaissances explicites résiste mieux à la pression et au stress.",x:"À l'inverse, un apprentissage très verbalisé peut favoriser un contrôle conscient qui se dégrade sous la pression (« choking »)."},
{id:"am15",th:"AM",p:"",q:"Quels processus Bandura (1977) identifie-t-il dans l'apprentissage par observation ?",a:"L'attention, la rétention, la reproduction motrice et la motivation.",x:"Une démonstration est d'autant plus efficace que le modèle est proche de l'élève et que l'attention est orientée vers les éléments essentiels."},
{id:"am16",th:"AM",p:"",q:"Qu'est-ce que la répétition mentale (imagerie motrice) ?",a:"La simulation mentale d'un mouvement sans l'exécuter, qui active une partie des réseaux nerveux du mouvement réel.",x:"Elle complète la pratique physique sans la remplacer ; elle est utile pour mémoriser un enchaînement ou se préparer à une performance."},
{id:"am17",th:"AM",p:"",q:"Comment Marcel Mauss définit-il les techniques du corps (1936) ?",a:"Comme les façons dont les hommes, dans chaque société, savent se servir de leur corps de manière traditionnelle.",x:"Mauss y voit des techniques acquises, efficaces et transmises : le corps est le « premier instrument » de l'homme, façonné par la culture."},
{id:"am18",th:"AM",p:"",q:"Qu'oppose-t-on entre habileté ouverte et habileté fermée ?",a:"L'habileté fermée s'exerce dans un milieu stable et prévisible ; l'habileté ouverte dans un milieu changeant qui exige adaptation et prise d'information.",x:"Distinction attribuée à Poulton (1957). Elle oriente l'enseignement : stabiliser un geste ou développer l'adaptation au contexte."},
{id:"am19",th:"AM",p:"",q:"Quelle typologie des tâches Jean-Pierre Famose a-t-il proposée (1983) ?",a:"Les tâches définies, semi-définies et non définies, selon la précision avec laquelle le but, le dispositif et les opérations sont fixés.",x:"Elle aide l'enseignant à choisir entre guider précisément l'élève ou lui laisser construire ses propres solutions."},
{id:"am20",th:"AM",p:"",q:"Quels mécanismes distingue le modèle du traitement de l'information de Marteniuk (1976) ?",a:"Les mécanismes perceptifs, décisionnels et effecteurs.",x:"Ce modèle cognitiviste permet d'analyser la difficulté d'une tâche et d'agir sur chaque étape : prise d'information, choix, exécution."},
{id:"am21",th:"AM",p:"",q:"Que dit la loi de Hick (1952) ?",a:"Le temps de réaction de choix augmente avec le logarithme du nombre d'alternatives possibles.",x:"En sports collectifs, réduire ou augmenter le nombre d'options est une variable didactique pour doser l'incertitude."},
{id:"am22",th:"AM",p:"",q:"Que décrit la loi de Fitts (1954) ?",a:"Le compromis vitesse-précision : plus la cible est petite et lointaine, plus le mouvement pour l'atteindre est lent.",x:"Elle justifie de jouer sur la taille et la distance des cibles pour faire évoluer la difficulté."},
{id:"am23",th:"AM",p:"",q:"Qu'est-ce que la période réfractaire psychologique (Welford, 1952) ?",a:"Le délai supplémentaire de réponse à un second stimulus présenté très peu de temps après un premier.",x:"Elle explique l'efficacité des feintes : l'adversaire, qui a réagi au premier signal, répond en retard au second."},
{id:"am24",th:"AM",p:"",q:"Comment évolue la performance avec la pratique selon la « loi de la pratique » (Newell et Rosenbloom, 1981) ?",a:"Selon une fonction puissance : progrès rapides au début, puis de plus en plus lents.",x:"Ces ralentissements peuvent décourager les élèves : il faut rendre visibles les progrès et varier les objectifs."},
{id:"am25",th:"AM",p:"",q:"Qu'est-ce qu'un transfert d'apprentissage négatif ?",a:"Un apprentissage antérieur qui gêne l'acquisition d'une nouvelle habileté.",x:"Exemple : des habitudes de frappe au tennis qui perturbent le badminton. Le transfert peut aussi être positif, et c'est une visée de l'école."},
{id:"am26",th:"AM",p:"",q:"Quels facteurs la théorie OPTIMAL de Wulf et Lewthwaite (2016) place-t-elle au cœur de l'apprentissage moteur ?",a:"Des attentes de réussite renforcées, l'autonomie laissée à l'apprenant et une focalisation attentionnelle externe.",x:"Ces facteurs motivationnels et attentionnels renforceraient le lien entre le but et l'action. En EPS : présenter la tâche comme à la portée de l'élève, lui laisser des choix, orienter son attention vers l'effet du geste plutôt que vers son corps."},
{id:"am27",th:"AM",p:"",q:"Que montre la méta-analyse de McKay et al. (2022) sur la pratique autocontrôlée (l'apprenant choisit par exemple quand recevoir un retour) ?",a:"Une fois corrigé le biais de publication, le bénéfice moyen sur l'apprentissage devient très faible et ne se distingue pas de zéro.",x:"Effet brut g = 0,44 sur 52 études, ramené à environ 0,11 après correction ; seules les études publiées montraient un bénéfice. À citer pour nuancer l'autonomie comme levier « automatique » d'apprentissage moteur : son intérêt motivationnel reste, ses effets sur la rétention sont discutés."},
{id:"am28",th:"AM",p:"",q:"Qu'est-ce que la pédagogie non linéaire (Chow, Davids, Button et Renshaw) ?",a:"Une approche qui considère l'élève, l'environnement et l'enseignant comme un système complexe : l'enseignant agit sur les contraintes de la tâche pour faire émerger des solutions motrices fonctionnelles.",x:"Elle prolonge les contraintes de Newell et la dynamique écologique : on modifie l'espace, les règles ou le matériel plutôt que de prescrire un modèle technique unique, et l'on accepte des solutions individuelles."},
{id:"am29",th:"AM",p:"",q:"Que désigne la conception représentative des apprentissages (Pinder, Davids, Renshaw et Araújo, 2011) ?",a:"Le principe selon lequel une situation d'apprentissage doit rester fidèle à l'action visée, en conservant les informations que l'élève utilisera en situation de référence.",x:"Notion reprise de Brunswik. Un exercice trop décontextualisé (balles lancées par une machine, plots fixes) prive l'élève des informations du jeu réel : argument pour des situations de jeu réduites plutôt que des gammes isolées."},
{id:"am30",th:"AM",p:"",q:"Qu'est-ce que l'apprentissage différentiel (Schöllhorn) ?",a:"Une méthode qui introduit volontairement des variations, sans répétition à l'identique, autour du geste visé.",x:"Schöllhorn et al. (2006) rapportent des progrès en passe et en tir au football supérieurs à ceux de la répétition du geste cible, et avancent l'hypothèse de la « résonance stochastique ». Les auteurs eux-mêmes appellent à d'autres recherches."},
{id:"am31",th:"AM",p:"",q:"Que montrent Maxwell, Masters, Kerr et Weedon (2001) sur l'apprentissage « sans erreurs » ?",a:"Limiter les erreurs pendant l'apprentissage réduit les tests d'hypothèses conscients et favorise un apprentissage implicite, qui résiste mieux quand l'attention est sollicitée ailleurs.",x:"Au putting de golf, les apprenants qui ont peu échoué ont gardé leur niveau en double tâche, contrairement aux autres. En EPS : une difficulté progressive pour les élèves anxieux ou soumis à la pression."},

/* ---------- Écrit 2 : effort, santé et bien-être ---------- */
{id:"ef01",th:"EF",p:"",q:"Quelles sont les trois filières de production d'énergie musculaire ?",a:"La filière anaérobie alactique, la filière anaérobie lactique et la filière aérobie.",x:"Elles fonctionnent toujours simultanément, mais leur part varie selon l'intensité et la durée : quelques secondes, de l'ordre de la minute, au-delà de quelques minutes."},
{id:"ef02",th:"EF",p:"",q:"Qu'est-ce que la VO2max ?",a:"La consommation maximale d'oxygène, c'est-à-dire la quantité maximale d'oxygène que l'organisme peut utiliser par minute.",x:"Elle exprime la puissance maximale aérobie. La vitesse maximale aérobie (VMA) est la vitesse de course qui lui correspond."},
{id:"ef03",th:"EF",p:"",q:"Quel test progressif Luc Léger a-t-il conçu pour estimer la VO2max sur le terrain ?",a:"Le test navette de 20 mètres, à vitesse croissante par paliers.",x:"Mis au point au début des années 1980, il est très utilisé en milieu scolaire. Le VAMEVAL (Cazorla) estime la VMA sur piste."},
{id:"ef04",th:"EF",p:"",q:"À quoi sert l'échelle de Borg ?",a:"À mesurer l'effort perçu par le sujet, sur une échelle chiffrée.",x:"Gunnar Borg l'a proposée en 1970. En EPS, elle aide l'élève à relier ses sensations à l'intensité réelle de l'effort."},
{id:"ef05",th:"EF",p:"",q:"Qu'est-ce que la surcompensation ?",a:"Le rebond des capacités au-dessus du niveau initial pendant la récupération qui suit une charge d'entraînement.",x:"Elle fonde les principes de progressivité, de surcharge et de récupération : sans repos suffisant, la fatigue s'accumule au lieu de produire des progrès."},
{id:"ef06",th:"EF",p:"",q:"Quels sont les grands régimes de contraction musculaire ?",a:"Concentrique, excentrique, isométrique et pliométrique.",x:"L'excentrique produit le plus de force mais provoque davantage de courbatures ; le pliométrique enchaîne étirement et raccourcissement (bonds)."},
{id:"ef07",th:"EF",p:"",q:"Que recommande l'OMS (2020) en matière d'activité physique pour les 5-17 ans ?",a:"Au moins 60 minutes par jour en moyenne sur la semaine d'activité d'intensité modérée à soutenue, essentiellement aérobie ; des activités aérobies d'intensité soutenue et des activités de renforcement musculaire et osseux au moins 3 jours par semaine.",x:"L'OMS recommande aussi de limiter la sédentarité, en particulier le temps de loisir passé devant les écrans."},
{id:"ef08",th:"EF",p:"",q:"Quelle différence fait-on entre sédentarité et inactivité physique ?",a:"La sédentarité désigne le temps passé assis ou allongé avec une très faible dépense d'énergie ; l'inactivité physique, le fait de ne pas atteindre les recommandations d'activité.",x:"On peut être actif et très sédentaire à la fois : les deux risques s'additionnent."},
{id:"ef09",th:"EF",p:"",q:"Quel constat l'ANSES a-t-elle publié en 2020 sur les 11-17 ans ?",a:"Environ deux tiers d'entre eux présentent un risque sanitaire préoccupant, cumulant sédentarité élevée et activité physique insuffisante.",x:"Un argument fort pour justifier les finalités de santé de l'EPS et de l'association sportive."},
{id:"ef10",th:"EF",p:"",q:"Comment l'OMS définit-elle la santé dans sa constitution de 1946 ?",a:"Comme un état de complet bien-être physique, mental et social, qui ne consiste pas seulement en une absence de maladie ou d'infirmité.",x:"Une définition positive et globale, qui dépasse l'approche médicale et sert souvent de point de départ aux copies sur la santé en EPS."},
{id:"ef11",th:"EF",p:"",q:"Qu'apporte la charte d'Ottawa (1986) ?",a:"Elle définit la promotion de la santé comme le processus qui confère aux populations les moyens d'assurer un plus grand contrôle sur leur propre santé.",x:"Elle déplace la santé vers l'autonomie et l'éducation : l'EPS doit rendre l'élève capable de gérer sa propre activité physique."},
{id:"ef12",th:"EF",p:"",q:"Quelles conceptions du bien-être distinguent Ryan et Deci (2001) ?",a:"Le bien-être hédonique, lié au plaisir et à la satisfaction, et le bien-être eudémonique, lié à l'accomplissement de soi et au sens.",x:"En EPS, le plaisir immédiat ne suffit pas : le bien-être se construit aussi par les progrès et la maîtrise."},
{id:"ef13",th:"EF",p:"",q:"Qu'est-ce que la littératie physique (Margaret Whitehead) ?",a:"La motivation, la confiance, la compétence physique, le savoir et la compréhension qui permettent de s'engager durablement dans l'activité physique.",x:"Concept diffusé à partir des années 2000, il donne une visée de long terme à l'EPS : un pratiquant autonome toute sa vie."},
{id:"ef14",th:"EF",p:"",q:"Que suggèrent les études sur l'évolution de la condition cardio-respiratoire des jeunes ?",a:"Une baisse marquée depuis plusieurs décennies dans de nombreux pays.",x:"Les travaux de Grant Tomkinson l'ont documentée ; la Fédération française de cardiologie a relayé en 2016 une perte d'environ un quart de la capacité des collégiens en quarante ans."},
{id:"ef15",th:"EF",p:"",q:"Quels sont les effets d'un échauffement bien conduit ?",a:"Élévation de la température musculaire, meilleure efficacité neuromusculaire, préparation cardio-respiratoire et mentale.",x:"Il doit être progressif et adapté à l'activité. C'est aussi un savoir à transmettre pour l'autonomie de l'élève."},
{id:"ef16",th:"EF",p:"",q:"Quel effet immédiat les étirements statiques prolongés ont-ils avant un effort de force ou de vitesse ?",a:"Ils peuvent diminuer temporairement la performance.",x:"On privilégie donc des étirements dynamiques à l'échauffement et on garde les étirements statiques pour d'autres moments."},
{id:"ef17",th:"EF",p:"",q:"Quels paramètres l'élève fait-il varier en musculation pour viser un objectif ?",a:"La charge, le nombre de répétitions, le nombre de séries, la récupération et la vitesse d'exécution.",x:"Au lycée, le champ d'apprentissage 5 demande de construire un projet d'entraînement cohérent avec un mobile personnel (forme, puissance, volume)."},
{id:"ef18",th:"EF",p:"",q:"Quel est le principe du travail intermittent de type 30-30 ?",a:"Alterner 30 secondes de course à vitesse élevée, proche de la VMA, et 30 secondes de récupération.",x:"Popularisé par Georges Gacon, il permet de solliciter longtemps la puissance aérobie avec une fatigue limitée, ce qui convient aux élèves."},
{id:"ef19",th:"EF",p:"",q:"D'où viennent les courbatures ressenties un à deux jours après un effort inhabituel ?",a:"De micro-lésions musculaires et de l'inflammation qui suit, surtout après des contractions excentriques.",x:"Elles ne viennent pas de l'acide lactique, idée reçue fréquente."},
{id:"ef20",th:"EF",p:"",q:"Quelles qualités physiques distingue-t-on classiquement ?",a:"L'endurance, la force, la vitesse, la souplesse et la coordination.",x:"Leur développement en EPS doit rester au service des apprentissages et de la santé, pas d'un entraînement sportif spécialisé."},
{id:"ef21",th:"EF",p:"",q:"Pourquoi la formule « 220 moins l'âge » doit-elle être utilisée avec prudence ?",a:"Elle ne donne qu'une estimation moyenne de la fréquence cardiaque maximale, avec de forts écarts individuels.",x:"Mieux vaut croiser la fréquence cardiaque avec les sensations et la capacité à parler pendant l'effort."},
{id:"ef22",th:"EF",p:"",q:"Que désignent la puissance et la capacité d'une filière énergétique ?",a:"La puissance est la quantité d'énergie produite par unité de temps ; la capacité, la quantité totale d'énergie disponible.",x:"La filière alactique est très puissante mais de faible capacité ; la filière aérobie est peu puissante mais de capacité quasi illimitée."},
{id:"ef23",th:"EF",p:"",q:"Pourquoi apprendre à l'élève à « s'entraîner » est-il une finalité de l'EPS ?",a:"Pour qu'il devienne capable de concevoir et de réguler seul une activité physique adaptée à ses besoins.",x:"C'est l'enjeu du champ d'apprentissage 5 au lycée et de l'éducation à la santé : passer de l'exécution à l'autonomie."},
{id:"ef24",th:"EF",p:"",q:"Quelles sensations l'élève peut-il apprendre à interpréter pour réguler son effort ?",a:"L'essoufflement, la fréquence cardiaque, la chaleur, la sensation musculaire de brûlure ou de fatigue, la facilité à parler.",x:"Relier sensations et données objectives (chronomètre, cardiofréquencemètre) permet une autorégulation fine."},
{id:"ef25",th:"EF",p:"",q:"Pourquoi le plaisir est-il un levier de santé à long terme ?",a:"Parce que les expériences positives de pratique favorisent l'engagement durable dans une activité physique régulière.",x:"Les recherches sur la motivation suggèrent qu'un élève qui associe l'activité à l'échec ou à l'humiliation risque davantage de s'en détourner, y compris à l'âge adulte."},
{id:"ef26",th:"EF",p:"",q:"Quels effets la méta-analyse de Costigan et al. (2015) attribue-t-elle au travail intermittent à haute intensité (HIIT) chez les adolescents ?",a:"Un effet important sur la capacité cardio-respiratoire et un effet moyen sur la composition corporelle.",x:"Interventions d'au moins quatre semaines chez des 13-18 ans ; pas d'effet significatif sur le tour de taille ni sur la condition musculaire. Une forme de travail efficace en peu de temps, précieuse quand le temps d'engagement moteur est compté."},
{id:"ef27",th:"EF",p:"",q:"Quelle part des adolescents scolarisés ne suit pas la recommandation d'une heure d'activité physique par jour selon Guthold et al. (2020) ?",a:"Plus de 80 % en 2016 : 78 % des garçons et 85 % des filles, d'après 1,6 million d'élèves de 11 à 17 ans dans 146 pays.",x:"Étude conduite par l'OMS (The Lancet Child & Adolescent Health, 2020). L'écart entre filles et garçons nourrit les sujets sur l'égalité et sur le désengagement des filles."},
{id:"ef28",th:"EF",p:"",q:"Que conclut la revue de Donnelly et al. (2016) sur l'activité physique et la réussite scolaire des enfants ?",a:"Des associations positives entre activité physique, condition physique, cognition et réussite scolaire, et aucun signe qu'augmenter l'activité physique nuise aux résultats.",x:"Les auteurs soulignent des preuves encore limitées et parfois incohérentes : le type, la quantité et le moment de l'activité restent à préciser. Un argument mesuré pour défendre l'horaire d'EPS sans surpromettre."},
{id:"ef29",th:"EF",p:"",q:"Que propose le modèle développemental de Stodden et al. (2008) ?",a:"Des relations réciproques entre compétence motrice, compétence perçue, condition physique, activité physique et poids, qui se renforceraient avec l'âge.",x:"Robinson et al. (2015) confirment que la compétence motrice est associée à la compétence perçue et à plusieurs aspects de la santé, sans trancher sur le renforcement dans le temps. Enjeu : un élève peu compétent risque d'éviter la pratique, d'où l'importance des habiletés motrices fondamentales."},

/* ---------- Écrit 2 : émotions, motivation et interactions ---------- */
{id:"ex01",th:"EX",p:"",q:"Quels sont les trois besoins psychologiques fondamentaux selon la théorie de l'autodétermination (Deci et Ryan) ?",a:"Les besoins d'autonomie, de compétence et de proximité sociale (appartenance).",x:"Autonomie et compétence sont posées dès 1985 ; l'appartenance sociale est formalisée ensuite (Deci et Ryan, 2000). Plus ces besoins sont satisfaits, plus la motivation est autodéterminée. En EPS : laisser des choix, rendre les progrès visibles, favoriser la coopération."},
{id:"ex02",th:"EX",p:"",q:"Comment la théorie de l'autodétermination ordonne-t-elle les formes de motivation ?",a:"Sur un continuum : amotivation, régulations externe, introjectée, identifiée et intégrée, puis motivation intrinsèque.",x:"Un élève peut s'engager pour une note (externe) ou parce qu'il juge l'activité utile pour lui (identifiée) : l'enjeu est de faire progresser l'élève sur ce continuum."},
{id:"ex03",th:"EX",p:"",q:"Quels deux types de buts d'accomplissement Nicholls (1984) distingue-t-il ?",a:"Les buts orientés vers la tâche (maîtrise, progrès personnel) et les buts orientés vers l'ego (se comparer, surpasser les autres).",x:"L'implication dans la tâche est associée à un engagement plus durable, surtout chez les élèves qui se perçoivent peu compétents."},
{id:"ex04",th:"EX",p:"",q:"Qu'est-ce qu'un climat motivationnel de maîtrise (Ames, 1992) ?",a:"Un climat de classe qui valorise l'effort, le progrès et l'apprentissage plutôt que la comparaison et le classement.",x:"Ames s'appuie sur les dimensions TARGET (Epstein, 1989) : tâche, autorité, reconnaissance, groupement, évaluation, temps."},
{id:"ex05",th:"EX",p:"",q:"Quelles sont les quatre sources du sentiment d'efficacité personnelle selon Bandura ?",a:"Les expériences de maîtrise, les expériences vicariantes, la persuasion verbale, et les états physiologiques et émotionnels.",x:"Les expériences de réussite sont la source la plus puissante : d'où l'importance de tâches à la portée de chaque élève."},
{id:"ex06",th:"EX",p:"",q:"Qu'est-ce que l'expérience optimale ou « flow » (Csikszentmihalyi) ?",a:"Un état d'absorption totale dans l'activité, quand le défi est à la hauteur des compétences.",x:"Il suppose des buts clairs et un retour immédiat. Trop facile, l'élève s'ennuie ; trop difficile, il s'angoisse."},
{id:"ex07",th:"EX",p:"",q:"De quelles composantes une émotion est-elle faite selon les modèles actuels ?",a:"Une évaluation de la situation, des réactions physiologiques, une expression, une tendance à l'action et un ressenti subjectif.",x:"Modèle multicomposante de Klaus Scherer. Les émotions ne sont pas un parasite de l'apprentissage : elles orientent l'attention et l'engagement."},
{id:"ex08",th:"EX",p:"",q:"Qu'énonce la loi de Yerkes et Dodson (1908) ?",a:"La performance augmente avec le niveau d'activation jusqu'à un optimum, puis diminue : la relation a la forme d'un U inversé.",x:"Formulée à l'origine à partir d'expériences sur des souris (intensité d'un choc électrique et vitesse d'apprentissage d'une discrimination), elle a ensuite été réinterprétée en termes d'activation (Hebb, 1955). L'optimum est plus bas pour les tâches complexes ou fines ; le modèle reste un repère classique mais discuté."},
{id:"ex09",th:"EX",p:"",q:"Que distingue-t-on entre anxiété cognitive et anxiété somatique ?",a:"L'anxiété cognitive renvoie aux inquiétudes et pensées négatives ; l'anxiété somatique aux manifestations corporelles (tension, rythme cardiaque).",x:"Distinction issue des travaux sur l'anxiété (Liebert et Morris, 1967 ; Davidson et Schwartz, 1976), appliquée au sport par Martens et ses collaborateurs (1990) avec le questionnaire CSAI-2. Elles ne réclament pas les mêmes stratégies de régulation."},
{id:"ex10",th:"EX",p:"",q:"Quelles stratégies de faire face (coping) distinguent Lazarus et Folkman (1984) ?",a:"Le coping centré sur le problème, qui agit sur la situation, et le coping centré sur l'émotion, qui agit sur le ressenti.",x:"Le stress naît de l'évaluation que fait le sujet de la menace et de ses ressources pour y faire face."},
{id:"ex11",th:"EX",p:"",q:"Qu'est-ce que la résignation apprise (Seligman) ?",a:"Un état de passivité qui s'installe quand le sujet croit que ses actions n'ont aucun effet sur les résultats.",x:"En EPS, des échecs répétés sans perspective de progrès peuvent conduire un élève à « ne plus essayer »."},
{id:"ex12",th:"EX",p:"",q:"Selon quelles dimensions Weiner classe-t-il les attributions causales ?",a:"Le lieu de causalité (interne ou externe), la stabilité et la contrôlabilité.",x:"Attribuer un échec à un manque d'effort (interne, instable, contrôlable) préserve la motivation ; l'attribuer à un manque de don la détruit."},
{id:"ex13",th:"EX",p:"",q:"Qu'est-ce que l'effet Pygmalion (Rosenthal et Jacobson, 1968) ?",a:"L'influence des attentes de l'enseignant sur les performances des élèves.",x:"Les attentes se transmettent par des comportements discrets (temps de parole, feedbacks, exigences) et peuvent devenir des prophéties autoréalisatrices."},
{id:"ex14",th:"EX",p:"",q:"Qu'est-ce que la menace du stéréotype (Steele et Aronson, 1995) ?",a:"La baisse de performance d'une personne quand elle craint de confirmer un stéréotype négatif visant son groupe.",x:"En EPS, des travaux (Chalabaev notamment) montrent cet effet chez les filles dans des tâches présentées comme masculines."},
{id:"ex15",th:"EX",p:"",q:"Qu'est-ce que le conflit sociocognitif (Doise et Mugny, 1981) ?",a:"La confrontation de points de vue divergents entre pairs, qui oblige chacun à réorganiser sa pensée.",x:"Il fonde l'intérêt des travaux de groupe et de l'observation mutuelle en EPS."},
{id:"ex16",th:"EX",p:"",q:"Quelles conditions rendent l'apprentissage coopératif efficace selon Johnson et Johnson ?",a:"Une interdépendance positive, une responsabilité individuelle et des interactions stimulantes entre élèves, complétées par l'apprentissage d'habiletés sociales et un retour réflexif du groupe sur son fonctionnement.",x:"Mettre les élèves en groupe ne suffit pas : il faut que chacun ait besoin des autres et rende compte de sa propre part."},
{id:"ex17",th:"EX",p:"",q:"Que distingue-t-on entre risque objectif et risque perçu ?",a:"Le risque objectif est le danger réel de la situation ; le risque perçu est l'appréciation subjective qu'en fait l'élève.",x:"En escalade ou en natation, la peur dépend du risque perçu : l'enseignant agit sur la sécurité réelle et sur la confiance."},
{id:"ex18",th:"EX",p:"",q:"Quelle stratégie de régulation émotionnelle est jugée la plus adaptée selon James Gross ?",a:"La réévaluation cognitive, qui change le sens donné à la situation, plutôt que la suppression de l'expression émotionnelle.",x:"Gross (1998) décrit un processus de régulation : sélectionner ou modifier la situation, orienter l'attention, réévaluer, moduler la réponse."},
{id:"ex19",th:"EX",p:"",q:"Quelle différence la psychologie du travail fait-elle entre tâche et activité ?",a:"La tâche est ce qui est à faire ; l'activité est ce que le sujet fait réellement pour y répondre.",x:"Distinction de Leplat et Hoc (1983), reprise en didactique de l'EPS : analyser l'activité réelle de l'élève, pas seulement la tâche prescrite."},
{id:"ex20",th:"EX",p:"",q:"Quelles dimensions de l'engagement scolaire distingue Fredricks (2004) ?",a:"L'engagement comportemental, émotionnel et cognitif.",x:"Un élève peut être actif physiquement sans être engagé cognitivement : la seule quantité de pratique ne garantit pas l'apprentissage."},
{id:"ex21",th:"EX",p:"",q:"Comment Susan Harter relie-t-elle compétence perçue et motivation ?",a:"Plus l'enfant se perçoit compétent dans un domaine, plus il est motivé à s'y engager.",x:"En EPS, la perception de compétence physique baisse souvent à l'adolescence, surtout chez les filles."},
{id:"ex22",th:"EX",p:"",q:"Que désignent les compétences psychosociales ?",a:"Des capacités cognitives, émotionnelles et sociales qui permettent de faire face aux exigences de la vie quotidienne.",x:"L'OMS les a définies en 1993 ; Santé publique France en a actualisé le cadre en 2022. L'EPS les mobilise dans les rôles sociaux et la coopération."},
{id:"ex23",th:"EX",p:"",q:"Pourquoi l'expérience vécue par l'élève est-elle au cœur de l'apprentissage selon John Dewey ?",a:"Parce qu'on apprend en agissant et en réfléchissant sur ce qu'on a fait.",x:"Dewey (Experience and Education, 1938) inspire les pédagogies actives : la pratique n'éduque que si elle est reprise et mise en sens."},
{id:"ex24",th:"EX",p:"",q:"Quel lien fait-on entre émotions positives et mémorisation ?",a:"Les émotions renforcent l'attention et la consolidation en mémoire des expériences vécues.",x:"Un excès de stress, en revanche, perturbe l'apprentissage : l'enseignant cherche un niveau d'émotion favorable."},
{id:"ex25",th:"EX",p:"",q:"Qu'apporte la tenue de rôles sociaux (arbitre, juge, observateur) en EPS ?",a:"Elle développe la responsabilité, la compréhension des règles et la capacité à analyser l'activité d'autrui.",x:"Les programmes de collège en font une compétence générale : partager des règles, assumer des rôles et des responsabilités."},
{id:"ex26",th:"EX",p:"",q:"Que postule la théorie contrôle-valeur des émotions d'accomplissement (Pekrun, 2006) ?",a:"Les émotions liées aux apprentissages naissent de deux évaluations : le contrôle que l'élève pense avoir sur l'activité et ses résultats, et la valeur qu'il leur accorde.",x:"Elle distingue les émotions liées à l'activité (plaisir, frustration, ennui) et celles liées aux résultats (fierté, espoir, anxiété, honte, colère…). En EPS : agir sur le contrôle (tâches accessibles, progrès visibles) et sur la valeur (sens de l'activité)."},
{id:"ex27",th:"EX",p:"",q:"Que dit la théorie « broaden-and-build » de Barbara Fredrickson (2001) ?",a:"Les émotions positives élargissent momentanément le répertoire de pensées et d'actions, et permettent de construire des ressources durables, physiques, intellectuelles, sociales et psychologiques.",x:"Un appui pour justifier le plaisir en EPS au-delà de l'instant : il favorise l'exploration et la construction de ressources sur le long terme."},
{id:"ex28",th:"EX",p:"",q:"Quels buts d'accomplissement le modèle 3 × 2 d'Elliot, Murayama et Pekrun (2011) distingue-t-il ?",a:"Six buts, en croisant trois références de la compétence (la tâche, soi-même, les autres) et deux valences (approche et évitement).",x:"Il sépare la référence à la tâche (réussir l'exercice) de la référence à soi (progresser par rapport à soi-même). Mascret, Elliot et Cury (2015) l'ont étendu au sport avec un questionnaire validé."},
{id:"ex29",th:"EX",p:"",q:"Que montre la méta-analyse de Vasconcellos et al. (2020) sur la théorie de l'autodétermination en EPS ?",a:"Sur 265 études, la satisfaction des besoins d'autonomie, de compétence et d'appartenance est fortement liée à la motivation autonome, elle-même liée à des effets positifs.",x:"Plus de 130 000 élèves. L'enseignant pèse davantage que les pairs sur l'autonomie et la compétence perçues ; l'appartenance dépend des deux. L'amotivation est fortement liée aux effets négatifs."},
{id:"ex30",th:"EX",p:"",q:"Que montre l'intervention de Tessier, Sarrazin et Ntoumanis (2010) auprès d'enseignants d'EPS débutants ?",a:"Formés au soutien de l'autonomie, à la structure et à l'implication, les enseignants ont fait évoluer leur style, et leurs élèves ont rapporté plus de besoins satisfaits, une motivation plus autodéterminée et plus d'engagement.",x:"Une séance d'information puis un accompagnement individualisé sur les quatre dernières leçons d'un cycle : le style motivationnel de l'enseignant peut s'apprendre."},
{id:"ex31",th:"EX",p:"",q:"Comment Chalabaev et al. (2013) expliquent-ils l'effet des stéréotypes de sexe en sport, au-delà de leur intériorisation ?",a:"Par l'approche situationnelle (la simple présence du stéréotype peut agir, comme dans la menace du stéréotype) et par l'approche du contenu des stéréotypes (ambivalents, ils peuvent justifier l'ordre social).",x:"Revue de chercheurs français parue dans Psychology of Sport and Exercise. En EPS : la façon de présenter une tâche peut suffire à modifier l'engagement et la performance des filles comme des garçons."},
{id:"ex32",th:"EX",p:"",q:"Quelles sources de l'intérêt situationnel en EPS distinguent les travaux d'Ang Chen ?",a:"La nouveauté, le défi, l'exigence d'attention, l'intention d'exploration et le plaisir immédiat.",x:"Chen, Darst et Pangrazi (2001) montrent que le plaisir immédiat est central et naît surtout de l'exploration, de l'exigence d'attention et de la nouveauté. Repris en contexte français par Roure et al. (2019)."},
{id:"ex33",th:"EX",p:"",q:"Que montre l'expérience nationale de Yeager et al. (2019) sur l'état d'esprit de développement (growth mindset) ?",a:"Une intervention en ligne de moins d'une heure, présentant les capacités comme développables, a amélioré les notes des élèves les plus faibles, surtout quand les normes des pairs allaient dans le même sens.",x:"Publiée dans Nature, menée aux États-Unis. L'effet dépend du contexte de l'établissement : à citer pour nuancer, pas comme une recette."},

/* ---------- Écrit 2 : développement des adolescents ---------- */
{id:"da01",th:"DA",p:"",q:"À quel âge survient en moyenne le pic de croissance staturale à la puberté ?",a:"Vers 12 ans chez les filles et vers 14 ans chez les garçons, avec de fortes variations individuelles.",x:"Dans une même classe, les élèves peuvent avoir plusieurs années d'écart d'âge biologique."},
{id:"da02",th:"DA",p:"",q:"Qu'est-ce que l'effet de l'âge relatif ?",a:"La surreprésentation, dans les sélections sportives, des jeunes nés en début d'année de compétition.",x:"Mis en évidence au hockey par Barnsley (1985). En classe, la maturité plus précoce de certains peut être prise à tort pour du talent."},
{id:"da03",th:"DA",p:"",q:"Pourquoi distinguer âge chronologique et âge biologique ?",a:"Parce que la maturation pubertaire ne suit pas le calendrier : deux élèves du même âge peuvent être à des stades très différents.",x:"Un argument pour la différenciation et pour une évaluation qui valorise les progrès."},
{id:"da04",th:"DA",p:"",q:"Quelles différences physiques entre filles et garçons s'accentuent après la puberté ?",a:"Chez les garçons, la masse musculaire et la force augmentent davantage ; chez les filles, la part de masse grasse est plus élevée.",x:"Avant la puberté, les écarts de performance sont faibles : ils ne justifient pas une séparation systématique."},
{id:"da05",th:"DA",p:"",q:"Qu'est-ce que la maladie d'Osgood-Schlatter ?",a:"Une douleur de la tubérosité tibiale, sous le genou, liée aux tractions du tendon rotulien sur un cartilage de croissance.",x:"Fréquente chez l'adolescent sportif en pleine croissance ; elle impose d'adapter les sauts et les courses."},
{id:"da06",th:"DA",p:"",q:"Quel stade du développement cognitif Piaget situe-t-il vers 11-12 ans ?",a:"Le stade des opérations formelles, marqué par le raisonnement hypothético-déductif.",x:"L'adolescent devient capable de raisonner sur des hypothèses : il peut construire et tester un projet d'action."},
{id:"da07",th:"DA",p:"",q:"Comment les neurosciences expliquent-elles la prise de risque à l'adolescence ?",a:"Par un décalage de maturation entre un système de récompense très réactif et un cortex préfrontal, siège du contrôle, encore immature.",x:"Modèle des systèmes duaux (Steinberg, Casey). La présence des pairs accentue la recherche de sensations."},
{id:"da08",th:"DA",p:"",q:"Quelle crise caractérise l'adolescence selon Erik Erikson ?",a:"La crise d'identité opposée à la confusion des rôles.",x:"L'adolescent cherche qui il est : l'image de soi et le regard des autres pèsent lourd dans les pratiques physiques."},
{id:"da09",th:"DA",p:"",q:"Quelles dimensions de l'estime de soi physique distinguent Fox et Corbin (1989) ?",a:"La compétence sportive, la condition physique, l'apparence physique et la force.",x:"Leur outil, le Physical Self-Perception Profile, montre que l'apparence pèse fortement chez les adolescents."},
{id:"da10",th:"DA",p:"",q:"Comment évolue l'activité physique des jeunes au cours de l'adolescence ?",a:"Elle diminue avec l'âge, et la baisse est plus marquée chez les filles.",x:"L'enquête internationale HBSC le confirme régulièrement : un enjeu majeur pour l'EPS au collège et au lycée."},
{id:"da11",th:"DA",p:"",q:"Pourquoi les adolescents ont-ils tendance à se coucher plus tard ?",a:"Parce que la sécrétion de mélatonine se décale à la puberté, ce qui retarde l'endormissement.",x:"Avec des réveils précoces, la dette de sommeil pèse sur l'attention, l'humeur et la récupération physique."},
{id:"da12",th:"DA",p:"",q:"Que faut-il penser des « périodes sensibles » pour développer les qualités physiques ?",a:"Elles sont souvent évoquées, mais leurs preuves scientifiques restent discutées.",x:"Le modèle de développement à long terme de l'athlète (Balyi et Hamilton, 2004) les a popularisées. En copie, mieux vaut les présenter avec prudence."},
{id:"da13",th:"DA",p:"",q:"D'où viennent surtout les gains de force chez l'enfant avant la puberté ?",a:"D'adaptations nerveuses (meilleure coordination et recrutement des fibres) plus que d'une augmentation du volume musculaire.",x:"Un renforcement musculaire encadré et progressif est sans danger chez l'enfant et l'adolescent, selon les consensus actuels."},
{id:"da14",th:"DA",p:"",q:"Pourquoi parle-t-on d'« âge d'or des apprentissages moteurs » avant la puberté ?",a:"Parce que les enfants de 8 à 12 ans environ acquièrent très vite de nouvelles coordinations.",x:"L'expression est souvent attribuée à Kurt Meinel. Elle plaide pour une large variété d'expériences motrices à l'école et en 6e."},
{id:"da15",th:"DA",p:"",q:"Quel rôle joue le groupe de pairs à l'adolescence ?",a:"Il devient une référence centrale pour l'identité, les goûts et les comportements.",x:"En EPS, la peur du jugement des pairs peut freiner l'engagement ; les groupes et les rôles doivent être pensés en conséquence."},
{id:"da16",th:"DA",p:"",q:"Pourquoi la puberté peut-elle s'accompagner d'une maladresse passagère ?",a:"Parce que la croissance rapide des segments modifie les repères corporels avant que la coordination ne s'ajuste.",x:"Ce phénomène est discuté et très variable, mais il invite à ne pas confondre baisse temporaire et absence de progrès."},
{id:"da17",th:"DA",p:"",q:"Comment l'adolescent vit-il souvent son corps en EPS ?",a:"Avec une forte sensibilité à l'image et au regard d'autrui, notamment dans les tenues, les vestiaires et les activités exposées.",x:"Les activités artistiques ou aquatiques sont particulièrement concernées : le climat de classe et l'organisation matérielle comptent."},
{id:"da18",th:"DA",p:"",q:"Quel besoin s'affirme à l'adolescence et doit être pris en compte dans l'enseignement ?",a:"Le besoin d'autonomie, c'est-à-dire d'avoir des choix et des responsabilités.",x:"Les élèves âgés acceptent mal un guidage permanent : les programmes de lycée misent sur des projets et des choix personnels."},
{id:"da19",th:"DA",p:"",q:"Que signifie l'hypothèse d'un « seuil » pubertaire de l'entraînabilité aérobie (Katch, 1983) ?",a:"L'idée que l'entraînement aérobie aurait peu d'effet avant la puberté.",x:"Elle est aujourd'hui nuancée : les enfants progressent aussi, même si les gains sont plus modestes que chez les adultes."},
{id:"da20",th:"DA",p:"",q:"Pourquoi les filles se désengagent-elles plus souvent de l'activité physique à l'adolescence ?",a:"Pour des raisons multiples : image du corps, stéréotypes de genre, offre d'activités, perception de compétence plus faible.",x:"L'EPS peut agir par le choix des activités, la mixité réfléchie, l'évaluation et le climat motivationnel."},
{id:"da21",th:"DA",p:"",q:"Qu'apporte la notion de capacité à se projeter dans le développement de l'adolescent ?",a:"Elle permet à l'élève de concevoir un projet, d'anticiper ses progrès et de s'engager dans un entraînement.",x:"Avec la pensée formelle, l'adolescent peut planifier : c'est une condition des démarches de projet en EPS."},
{id:"da22",th:"DA",p:"",q:"Quelle conséquence l'hétérogénéité de maturation a-t-elle sur les activités de combat ou d'opposition ?",a:"Elle impose de veiller aux écarts de gabarit et de force pour la sécurité et l'équité des rencontres.",x:"Groupements par gabarit, règles adaptées et rôles variés sont des réponses classiques."},
{id:"da23",th:"DA",p:"",q:"Pourquoi le développement de l'estime de soi est-il un enjeu de l'EPS à l'adolescence ?",a:"Parce que la discipline expose le corps et les compétences au regard d'autrui, ce qui peut renforcer ou fragiliser l'image de soi.",x:"Réussites accessibles, valorisation des progrès et climat de maîtrise protègent les élèves les plus vulnérables."},
{id:"da24",th:"DA",p:"",q:"Comment évolue la capacité d'attention et d'autorégulation au cours de l'adolescence ?",a:"Elle progresse avec la maturation du cortex préfrontal, qui se poursuit jusqu'au début de l'âge adulte.",x:"Les fonctions exécutives (planification, inhibition) se renforcent : l'élève peut de mieux en mieux réguler seul son activité."},
{id:"da25",th:"DA",p:"",q:"Pourquoi la diversité des expériences motrices est-elle recommandée chez les jeunes ?",a:"Parce qu'elle construit un répertoire moteur large, favorable aux apprentissages ultérieurs et à l'engagement durable.",x:"Elle s'oppose à une spécialisation précoce, associée à plus de blessures et d'abandons."},
{id:"da26",th:"DA",p:"",q:"Pourquoi Blakemore et Mills (2014) envisagent-elles l'adolescence comme une période sensible ?",a:"Le cerveau, en particulier les régions de la cognition sociale, se transforme pendant la deuxième décennie : l'adolescent serait particulièrement réceptif à son environnement social.",x:"Avec la sensibilité accrue aux signaux sociaux, cela éclaire le poids du groupe et du regard des autres en EPS : rôles sociaux, coopération, peur du jugement."},
{id:"da27",th:"DA",p:"",q:"Quelles sont les trois fonctions exécutives de base selon Adele Diamond (2013) ?",a:"L'inhibition (maîtrise de soi et contrôle de l'interférence), la mémoire de travail et la flexibilité cognitive.",x:"Elles sous-tendent l'autorégulation de l'élève : respecter une règle, garder une consigne en tête, changer de stratégie quand l'adversaire s'adapte."},
{id:"da28",th:"DA",p:"",q:"Qu'est-ce que le bio-banding (Cumming et al., 2017) ?",a:"Regrouper les jeunes sportifs selon leur croissance et leur maturation plutôt que selon leur âge chronologique.",x:"Les précoces doivent miser sur la technique et la tactique, les tardifs retrouvent des occasions de peser sur le jeu. Un complément, pas un remplacement, des groupes d'âge : transposable aux activités d'opposition en EPS."},
{id:"da29",th:"DA",p:"",q:"Que permet d'estimer l'équation de Mirwald et al. (2002) ?",a:"Le décalage de maturité (maturity offset) : le temps qui sépare un jeune de son pic de croissance staturale, à partir de mesures anthropométriques.",x:"L'estimation est moins précise chez les précoces et les tardifs, et mieux validée chez les garçons (Cumming et al., 2017)."},
{id:"da30",th:"DA",p:"",q:"Combien d'heures de sommeil l'Académie américaine de médecine du sommeil recommande-t-elle aux 13-18 ans ?",a:"8 à 10 heures par 24 heures (9 à 12 heures pour les 6-12 ans).",x:"Consensus de 2016 (Paruthi et al.). Dormir suffisamment est associé à une meilleure attention, mémoire et régulation émotionnelle : un thème d'éducation à la santé en EPS."},

/* ---------- Écrit 2 : intervention, évaluation et parcours ---------- */
{id:"in01",th:"IN",p:"",q:"Qui a introduit la distinction entre évaluation formative et évaluation sommative ?",a:"Michael Scriven, en 1967.",x:"Benjamin Bloom l'a reprise dans le cadre de la pédagogie de maîtrise : l'évaluation formative sert à réguler l'apprentissage en cours."},
{id:"in02",th:"IN",p:"",q:"Qu'est-ce que l'évaluation formatrice (Georgette Nunziati) ?",a:"Une évaluation conduite par l'élève lui-même, qui s'approprie les critères et apprend à s'autoévaluer.",x:"Elle vise l'autonomie : l'élève devient capable de piloter ses propres apprentissages."},
{id:"in03",th:"IN",p:"",q:"Quelle différence fait-on entre critères de réussite et critères de réalisation ?",a:"Les critères de réussite disent si le but est atteint ; les critères de réalisation disent comment s'y prendre pour l'atteindre.",x:"Les deux sont nécessaires : savoir si l'on a réussi et savoir quoi changer pour réussir."},
{id:"in04",th:"IN",p:"",q:"Comment Philippe Perrenoud définit-il une compétence (1997) ?",a:"Comme une capacité d'agir efficacement dans un type défini de situation, qui s'appuie sur des connaissances sans s'y réduire.",x:"Définition très citée pour aborder l'entrée par compétences des programmes."},
{id:"in05",th:"IN",p:"",q:"Quels niveaux de feedback distinguent Hattie et Timperley (2007) ?",a:"Le feedback sur la tâche, sur le processus, sur l'autorégulation et sur la personne.",x:"Le feedback centré sur la personne (« tu es doué ») est le moins efficace pour apprendre."},
{id:"in06",th:"IN",p:"",q:"Qu'appelle-t-on temps d'engagement moteur ?",a:"La part du temps de leçon pendant laquelle l'élève est réellement en activité motrice.",x:"Les travaux de Piéron et de Siedentop montrent qu'elle est souvent faible ; elle ne suffit pas, il faut aussi un temps de pratique adapté au niveau de l'élève."},
{id:"in07",th:"IN",p:"",q:"Qu'est-ce que la zone proximale de développement (Vygotski) ?",a:"L'écart entre ce que l'enfant réussit seul et ce qu'il peut réussir avec l'aide d'un adulte ou d'un pair plus avancé.",x:"L'enseignement efficace vise cette zone : ni trop facile, ni hors de portée."},
{id:"in08",th:"IN",p:"",q:"Quelles fonctions de l'étayage décrivent Wood, Bruner et Ross (1976) ?",a:"L'enrôlement, la réduction des degrés de liberté, le maintien de l'orientation, la signalisation des caractéristiques déterminantes, le contrôle de la frustration et la démonstration.",x:"L'étayage est une aide temporaire, retirée à mesure que l'élève devient autonome."},
{id:"in09",th:"IN",p:"",q:"Qu'est-ce qu'une situation-problème en didactique ?",a:"Une situation organisée autour d'un obstacle que l'élève doit franchir en construisant une nouvelle réponse.",x:"Philippe Meirieu l'a diffusée en France. L'obstacle doit être identifiable et franchissable."},
{id:"in10",th:"IN",p:"",q:"Qu'est-ce que le contrat didactique (Guy Brousseau) ?",a:"L'ensemble des attentes implicites réciproques entre l'enseignant et les élèves à propos du savoir.",x:"Il explique certains comportements d'élèves qui cherchent à deviner ce que veut l'enseignant plutôt qu'à apprendre."},
{id:"in11",th:"IN",p:"",q:"Qu'est-ce que la transposition didactique ?",a:"Le processus qui transforme un savoir savant ou une pratique sociale de référence en savoir à enseigner, puis en savoir enseigné.",x:"Notion introduite par Michel Verret (1975) et développée par Yves Chevallard (1985). En EPS, on parle de pratiques sociales de référence (Martinand)."},
{id:"in12",th:"IN",p:"",q:"Qu'a proposé Muska Mosston avec son « spectre » des styles d'enseignement ?",a:"Un continuum de styles, du commandement à la découverte, selon la part des décisions laissées à l'élève.",x:"Proposé en 1966, il aide à choisir un style selon l'objectif, plutôt qu'à opposer directif et non directif."},
{id:"in13",th:"IN",p:"",q:"Qu'a mis en évidence Jacob Kounin (1970) sur la gestion de classe ?",a:"L'importance de la vigilance (« withitness »), de la capacité à gérer plusieurs choses à la fois et de la fluidité des transitions.",x:"Les problèmes de discipline se préviennent par l'organisation de la leçon plus que par la sanction."},
{id:"in14",th:"IN",p:"",q:"Qu'est-ce que la métacognition (Flavell, 1976) ?",a:"La connaissance et le contrôle qu'un sujet a de ses propres processus cognitifs.",x:"En EPS : verbaliser ses choix, analyser ses erreurs, planifier un projet d'apprentissage."},
{id:"in15",th:"IN",p:"",q:"Sur quoi peut porter la différenciation pédagogique ?",a:"Sur les contenus, les processus d'apprentissage, les dispositifs et groupements, et les productions attendues.",x:"Elle répond à l'hétérogénéité des élèves sans renoncer aux mêmes objectifs de fin de cycle."},
{id:"in16",th:"IN",p:"",q:"Quel apport majeur John Hattie a-t-il revendiqué avec Visible Learning (2009) ?",a:"Une synthèse de plusieurs centaines de méta-analyses classant l'effet de nombreux facteurs sur la réussite des élèves.",x:"Le feedback et la clarté des objectifs y figurent parmi les leviers les plus puissants. L'ouvrage a aussi été critiqué pour sa méthode."},
{id:"in17",th:"IN",p:"",q:"Depuis quand le cycle 3 réunit-il le CM1, le CM2 et la sixième ?",a:"Depuis la rentrée 2016.",x:"Ce cycle de consolidation vise la continuité entre l'école et le collège, avec des programmes communs."},
{id:"in18",th:"IN",p:"",q:"Quelles lois fondent l'école inclusive en France ?",a:"La loi du 11 février 2005 pour l'égalité des droits et des chances des personnes handicapées, puis la loi de refondation de l'école du 8 juillet 2013.",x:"La loi de 2013 affirme que le service public reconnaît que tous les enfants partagent la capacité d'apprendre et de progresser, et veille à l'inclusion scolaire de tous."},
{id:"in19",th:"IN",p:"",q:"Qu'est-ce qu'une conception socioconstructiviste de l'apprentissage ?",a:"L'idée que l'élève construit ses savoirs par son activité, dans les interactions avec autrui.",x:"Elle s'oppose au béhaviorisme, centré sur le conditionnement et le renforcement des comportements observables."},
{id:"in20",th:"IN",p:"",q:"Qu'apporte le béhaviorisme à l'enseignement des habiletés motrices ?",a:"La décomposition des apprentissages en étapes et le renforcement des réponses correctes.",x:"Skinner en est la figure majeure. L'enseignement programmé en est issu ; on lui reproche de négliger le sens et l'activité de l'élève."},
{id:"in21",th:"IN",p:"",q:"Pourquoi la clarté des objectifs est-elle un levier d'apprentissage ?",a:"Parce qu'un élève qui sait ce qu'il doit apprendre et à quoi il reconnaîtra sa réussite s'engage mieux et s'autorégule.",x:"C'est le principe des attendus de fin de cycle et des critères partagés avec les élèves."},
{id:"in22",th:"IN",p:"",q:"Qu'est-ce qu'un groupe de besoin ?",a:"Un groupe temporaire d'élèves réunis pour travailler une difficulté ou un objectif commun.",x:"À la différence d'un groupe de niveau figé, il est souple et évolue au fil des apprentissages."},
{id:"in23",th:"IN",p:"",q:"Quel rôle joue l'observation entre pairs dans une leçon d'EPS ?",a:"Elle fournit des retours à l'élève observé et oblige l'observateur à s'approprier les critères.",x:"Elle suppose des outils simples (fiches, critères observables) et un apprentissage du rôle."},
{id:"in24",th:"IN",p:"",q:"Comment l'évaluation peut-elle soutenir la motivation plutôt que la menacer ?",a:"En valorisant les progrès, en rendant les critères transparents et en associant l'élève à l'évaluation.",x:"Une évaluation uniquement comparative renforce l'implication de l'ego et décourage les moins performants."},
{id:"in25",th:"IN",p:"",q:"Que signifie concevoir le parcours de formation de l'élève en EPS ?",a:"Organiser les apprentissages de façon cohérente et progressive sur l'ensemble de la scolarité, d'un cycle à l'autre.",x:"Il s'appuie sur la programmation des activités, le projet pédagogique EPS et la continuité école, collège, lycée."},
{id:"in26",th:"IN",p:"",q:"Qu'est-ce que le Teaching Games for Understanding (Bunker et Thorpe, 1982) ?",a:"Une alternative à l'enseignement des jeux centré sur la technique : partir du jeu et de sa compréhension tactique.",x:"Kirk et MacPhail (2002) le relisent à la lumière de l'apprentissage situé et des approches écologiques du contrôle moteur."},
{id:"in27",th:"IN",p:"",q:"Que recense la revue de Hastie, Martínez de Ojeda et Calderón (2011) sur le modèle d'éducation sportive de Siedentop ?",a:"38 études depuis 2004, dans des contextes de plus en plus variés, sur la mise en œuvre du modèle, la motivation des élèves et la formation des enseignants.",x:"Les auteurs appellent à mieux étudier l'enseignement entre pairs et le transfert vers le sport hors de l'école."},
{id:"in28",th:"IN",p:"",q:"Qu'appellent Casey et Kirk (2021) la pratique fondée sur les modèles (models-based practice) ?",a:"Placer des modèles pédagogiques au centre des programmes d'EPS, chacun organisant à sa manière les besoins cognitifs, sociaux, affectifs et moteurs des élèves.",x:"Les auteurs préfèrent « modèle pédagogique » à « modèle curriculaire » ou « d'enseignement », et estiment qu'une véritable pratique fondée sur les modèles reste à construire."},
{id:"in29",th:"IN",p:"",q:"Quels principes d'enseignement Barak Rosenshine (2012) tire-t-il de la recherche ?",a:"Dix principes : réviser brièvement, présenter par petites étapes, poser beaucoup de questions, donner des modèles, guider la pratique, vérifier la compréhension, viser un taux de réussite élevé, étayer puis retirer l'aide, faire pratiquer seul, réviser chaque semaine et chaque mois.",x:"Publiés dans American Educator. Utiles pour justifier démonstration, guidage et répétition, à articuler avec les démarches de découverte selon l'objectif visé."},
{id:"in30",th:"IN",p:"",q:"Que montre la méta-analyse de Wisniewski, Zierer et Hattie (2020) sur le feedback ?",a:"Un effet moyen d'environ d = 0,48 sur 435 études, d'autant plus fort que le feedback apporte de l'information (environ 0,99 pour les retours riches, 0,24 pour les récompenses et punitions).",x:"Effets très hétérogènes : le feedback n'est pas une recette uniforme. Sur les habiletés motrices, l'effet estimé est de 0,63, mais sur peu d'études."},
{id:"in31",th:"IN",p:"",q:"Que postule la théorie de la charge cognitive (Sweller, van Merriënboer et Paas) ?",a:"La mémoire de travail est très limitée, alors que la mémoire à long terme stocke des schémas : l'enseignement doit réduire la charge inutile et favoriser la construction de schémas.",x:"Formulée en 1998, actualisée en 2019. En EPS : consignes courtes, une information à la fois, démonstration plutôt que long discours pendant l'effort."},
/* ---------- Textes officiels ---------- */
{id:"po01",th:"PO",p:"",q:"Quel texte fixe les programmes d'EPS des cycles 2, 3 et 4 issus de la réforme du collège, et quelle version consolidée fait référence ?",a:"L'arrêté du 9 novembre 2015 (BO spécial n°11 du 26 novembre 2015), dont les annexes ont été remplacées par l'arrêté du 17 juillet 2020 (BO n°31 du 30 juillet 2020), en vigueur à la rentrée 2020.",x:"La version 2020 renforce surtout les enseignements liés au changement climatique, à la biodiversité et au développement durable. Pour l'EPS au cycle 4, c'est encore le texte de référence en 2026-2027."},
{id:"po02",th:"PO",p:"",q:"Quels sont les quatre champs d'apprentissage des programmes d'EPS de 2015 (cycles 2 à 4), selon leur formulation exacte ?",a:"1) Produire une performance optimale, mesurable à une échéance donnée ; 2) Adapter ses déplacements à des environnements variés ; 3) S'exprimer devant les autres par une prestation artistique et/ou acrobatique ; 4) Conduire et maîtriser un affrontement collectif ou interindividuel.",x:"Ces champs structurent l'offre de formation du collège. Ils restent en vigueur au cycle 4 en 2026-2027, ainsi qu'en CM2 et en 6e jusqu'à l'entrée en vigueur du programme de 2026."},
{id:"po03",th:"PO",p:"",q:"Quelles sont les cinq compétences générales travaillées en EPS au cycle 4, et à quels domaines du socle se rattachent-elles ?",a:"D1 : Développer sa motricité et apprendre à s'exprimer avec son corps. D2 : S'approprier seul ou à plusieurs par la pratique, les méthodes et outils pour apprendre. D3 : Partager des règles, assumer des rôles et des responsabilités. D4 : Apprendre à entretenir sa santé par une activité physique régulière. D5 : S'approprier une culture physique sportive et artistique pour construire progressivement un regard lucide sur le monde contemporain.",x:"Chaque compétence générale correspond terme à terme à un domaine du socle (décret de 2015), ce qui fait de l'EPS une discipline contributrice du socle. Le cycle 3 de 2015 décline des compétences analogues, mais leur formulation diffère légèrement."},
{id:"po04",th:"PO",p:"",q:"Que prévoit le programme de cycle 4 sur la couverture des compétences et des champs d'apprentissage au cours du cycle ?",a:"L'ensemble des compétences et des champs d'apprentissage est abordé pendant le cycle, et il revient à l'équipe pédagogique d'en planifier le choix et la progression.",x:"Chaque cycle (2, 3 et 4) doit permettre aux élèves de rencontrer les quatre champs d'apprentissage. Ce principe justifie le projet pédagogique d'EPS et la programmation sur trois ans."},
{id:"po05",th:"PO",p:"",q:"Quel est l'horaire hebdomadaire d'EPS au collège, et quel texte le fixe ?",a:"4 h en 6e ; 3 h en 5e, 4e et 3e. Il est fixé par l'arrêté du 19 mai 2015 relatif à l'organisation des enseignements au collège, modifié par l'arrêté du 16 juin 2017.",x:"La 6e garde une heure de plus, héritage de la logique de continuité école-collège du cycle 3. Le dispositif « 2 heures de sport en plus » ne modifie pas cet horaire : il se déroule hors temps scolaire."},
{id:"po06",th:"PO",p:"",q:"Quel texte publie les nouveaux programmes d'EPS des cycles 2 et 3, et selon quel calendrier entrent-ils en vigueur ?",a:"L'arrêté du 22 avril 2026 (BO n°22 du 28 mai 2026). Il s'applique en 2026-2027 au CP et au CM1, puis en 2027-2028 au CE1, au CE2, au CM2 et en 6e.",x:"En 2026-2027, l'ancien programme de cycle 3 (2015/2020) reste donc applicable en CM2 et en 6e. L'arrêté supprime les parties EPS des annexes de l'arrêté du 9 novembre 2015 pour les cycles 2 et 3."},
{id:"po10",th:"PO",p:"",q:"Où en est la réécriture du programme d'EPS du cycle 4 en 2026-2027 ?",a:"Le Conseil supérieur des programmes a publié un projet de programme d'EPS pour le cycle 4 le 26 juin 2025. En 2026-2027, c'est toujours le programme de 2015 (version 2020) qui s'applique en 5e, 4e et 3e.",x:"Le projet reprend quatre champs reformulés, par exemple « Conduire et maîtriser une confrontation collective ou interindividuelle pour rechercher la victoire ». Chaque champ comporte deux à quatre objectifs d'apprentissage. Le calendrier Eduscol des nouveaux programmes ne mentionne pas l'EPS au cycle 4."},
{id:"po11",th:"PO",p:"",q:"En quoi consiste l'évaluation des aptitudes physiques des élèves de 6e, et depuis quand existe-t-elle ?",a:"Elle est proposée depuis la rentrée 2025 aux établissements volontaires et comporte trois tests : endurance (test « Luc Léger »), force (saut en longueur sans élan) et vitesse (30 m plat). Elle est reconduite en 2026 et étendue pour la première fois à la seconde (GT et pro).",x:"En 2025, environ 267 000 élèves ont passé ces tests. Seuls 34,2 % atteignaient une maîtrise satisfaisante en endurance (46,3 % des garçons contre 21,6 % des filles), avec des écarts selon l'IPS de l'établissement. C'est un argument fort sur l'enjeu de santé et d'égalité."},
{id:"po12",th:"PO",p:"",q:"Quel décret définit le socle commun de connaissances, de compétences et de culture, et quels en sont les cinq domaines ?",a:"Le décret n°2015-372 du 31 mars 2015. Ses cinq domaines sont : 1) les langages pour penser et communiquer ; 2) les méthodes et outils pour apprendre ; 3) la formation de la personne et du citoyen ; 4) les systèmes naturels et les systèmes techniques ; 5) les représentations du monde et l'activité humaine.",x:"Il découle de la loi de refondation de l'école du 8 juillet 2013 (n°2013-595) et s'applique depuis la rentrée 2016. Le domaine 1 comprend notamment la composante « comprendre, s'exprimer en utilisant les langages des arts et du corps »."},
{id:"po13",th:"PO",p:"",q:"Quel texte fixe le programme d'EPS du lycée général et technologique (enseignement commun et option), et quand est-il entré en vigueur ?",a:"L'arrêté du 17 janvier 2019 (BO spécial n°1 du 22 janvier 2019). Il s'applique depuis la rentrée 2019 en seconde et en première, et depuis la rentrée 2020 en terminale.",x:"Ce programme accompagne la réforme du lycée et du baccalauréat portée par J.-M. Blanquer. L'annexe 2 (option) a été remplacée par l'arrêté du 2 juin 2021."},
{id:"po14",th:"PO",p:"",q:"Quelle est la finalité de l'EPS au lycée GT, et quels en sont les cinq objectifs généraux ?",a:"Finalité : « former, par la pratique physique, sportive, artistique, un citoyen épanoui, cultivé, capable de faire des choix éclairés ». Objectifs : développer sa motricité ; savoir se préparer et s'entraîner ; exercer sa responsabilité individuelle et au sein d'un collectif ; construire durablement sa santé ; accéder au patrimoine culturel.",x:"La voie professionnelle ajoute « et responsables » à la finalité et formule ses objectifs autrement (par exemple « accéder lucidement au patrimoine culturel »)."},
{id:"po15",th:"PO",p:"",q:"Quels sont les cinq champs d'apprentissage du programme d'EPS du lycée GT (2019), dans leur formulation exacte ?",a:"CA1 : Réaliser une performance motrice maximale mesurable à une échéance donnée. CA2 : Adapter son déplacement à des environnements variés ou incertains. CA3 : Réaliser une prestation corporelle destinée à être vue et appréciée. CA4 : Conduire et maîtriser un affrontement collectif ou interindividuel pour gagner. CA5 : Réaliser une activité physique pour développer ses ressources et s'entretenir.",x:"Le CA5 est la nouveauté du lycée : il n'existe pas au collège. Attention, la voie professionnelle formule ses CA un peu différemment (par exemple CA5 : « réalise et oriente son activité physique… »)."},
{id:"po16",th:"PO",p:"",q:"Combien de champs d'apprentissage un lycéen de la voie GT doit-il rencontrer, et comment les attendus de fin de lycée sont-ils structurés ?",a:"Les cinq : « Les cinq champs d'apprentissage constituent un passage obligé ». Chaque CA comporte trois attendus de fin de lycée (AFL). Au CA3, l'AFL1 se décline en deux versions : enchaînement à visée esthétique ou acrobatique, ou chorégraphie collective.",x:"Les AFL suivent une même logique : l'AFL1 est moteur, l'AFL2 porte sur la préparation et l'entraînement (méthodologique), l'AFL3 sur le choix et l'exercice de rôles (social). Le programme demande une attention particulière au CA5, qui exige « un temps long d'apprentissage »."},
{id:"po17",th:"PO",p:"",q:"Que doit contenir le projet pédagogique d'EPS selon le programme du lycée GT ?",a:"Conçu par l'équipe EPS, il formalise et planifie, de la seconde à la terminale, les acquisitions nécessaires pour atteindre les AFL. Il prévoit des outils communs d'évaluation des progrès des élèves et montre la contribution de l'EPS aux parcours éducatifs, dans une visée interdisciplinaire.",x:"Pour l'option, le projet précise en plus la programmation des APSA, les objectifs, l'organisation, les contenus, les outils d'évaluation et les critères de chaque attendu. Il est validé par l'inspection pédagogique régionale."},
{id:"po18",th:"PO",p:"",q:"Quels sont les horaires hebdomadaires d'EPS au lycée général et technologique ?",a:"Enseignement commun : 2 h en seconde, première et terminale. Enseignement optionnel : 3 h. Spécialité EPPCS : 4 h en première et 6 h en terminale générale.",x:"Le programme commun prend pour repère trois séquences d'enseignement par an, et un minimum de 20 heures pour un format en stage massé."},
{id:"po19",th:"PO",p:"",q:"Quel texte fixe le programme actuel de l'enseignement optionnel d'EPS en lycée GT, et quelles en sont les exigences de programmation ?",a:"L'arrêté du 2 juin 2021 (BO n°25 du 24 juin 2021), qui remplace l'annexe 2 de l'arrêté de 2019. Il s'applique depuis 2021-2022 en seconde et en première, et depuis 2022-2023 en terminale. L'élève y aborde de trois à six APSA sur le cursus, avec au moins deux APSA relevant de deux champs différents chaque année.",x:"L'option prolonge l'enseignement commun et vise davantage d'autonomie. Elle ajoute une compétence spécifique par niveau, par exemple en première : « Élaborer, mettre en œuvre et réguler un projet collectif »."},
{id:"po20",th:"PO",p:"",q:"Quand et par quel texte a été créé l'enseignement de spécialité « Éducation physique, pratiques et culture sportives » (EPPCS) ?",a:"Par l'arrêté du 17 février 2021 (BO n°15 du 15 avril 2021) : 4 h en première à la rentrée 2021, 6 h en terminale à la rentrée 2022, première session du bac en 2023. Son programme est fixé par un arrêté du 2 juin 2021 (BO n°25 du 24 juin 2021).",x:"Annoncée le 8 décembre 2020 dans la perspective de Paris 2024, la spécialité a d'abord ouvert dans une centaine d'établissements, soit un à trois par académie. L'épreuve terminale comprend un écrit de 3 h 30 et un oral de 30 min."},
{id:"po21",th:"PO",p:"",q:"Quel texte fixe le programme d'EPS de la voie professionnelle (CAP et bac pro), et quel en est le calendrier d'application ?",a:"L'arrêté du 3 avril 2019 (BO spécial n°5 du 11 avril 2019). Il s'applique depuis la rentrée 2019 en première année de CAP et en seconde bac pro, et depuis la rentrée 2020 en deuxième année de CAP et en première bac pro.",x:"Il accompagne la transformation de la voie professionnelle. Sa finalité est de former « un citoyen épanoui, cultivé, capable de faire des choix éclairés et responsables »."},
{id:"po22",th:"PO",p:"",q:"Quels sont les cinq objectifs généraux et les cinq champs d'apprentissage du programme d'EPS de la voie professionnelle ?",a:"Objectifs : développer sa motricité ; s'organiser pour apprendre et savoir s'entraîner ; exercer sa responsabilité dans un engagement personnel et solidaire ; construire durablement sa santé ; accéder lucidement au patrimoine culturel. Les CA sont formulés du point de vue de l'élève, qui : réalise sa performance motrice maximale, mesurable à une échéance donnée (CA1) ; adapte son déplacement à des environnements variés et/ou incertains (CA2) ; réalise une prestation corporelle destinée à être vue et appréciée (CA3) ; conduit un affrontement interindividuel ou collectif pour gagner (CA4) ; réalise et oriente son activité physique pour développer ses ressources et s'entretenir (CA5).",x:"Ces formulations diffèrent de celles du lycée GT, ce qui est un piège classique à l'écrit. Les attendus y sont des AFLP (attendus de fin de lycée professionnel)."},
{id:"po23",th:"PO",p:"",q:"Combien de champs d'apprentissage doivent être programmés en CAP et en bac pro ?",a:"En CAP, au moins trois CA, dont le CA5 sur au moins une année. En bac pro, les cinq CA sont à privilégier, avec un minimum de quatre ; le CA5 doit être programmé sur au moins deux séquences (au moins 20 heures).",x:"Le programme fait du savoir-nager « un enjeu national de santé publique » et demande que l'offre soit contextualisée au regard des gestes professionnels et des PFMP."},
{id:"po24",th:"PO",p:"",q:"Quel est le volume horaire annuel de référence en EPS dans la voie professionnelle ?",a:"CAP : 72 h 30 en première année et 65 h en deuxième année. Bac pro : 75 h en seconde, 70 h en première et 66 h en terminale.",x:"La voie professionnelle raisonne en volumes annuels de référence plutôt qu'en horaire hebdomadaire fixe. La terminale bac pro, dont la fin d'année est consacrée à des parcours différenciés (note de service du 4 mars 2024), a le volume le plus faible."},
{id:"po25",th:"PO",p:"",q:"Quel texte organise aujourd'hui l'évaluation de l'EPS aux baccalauréats général et technologique, et quel est le format du CCF ?",a:"La note de service du 20 février 2026 (BO n°9 du 26 février 2026), qui abroge et remplace la circulaire n°2019-129 à compter de la session 2026. Le CCF comporte trois épreuves relevant de trois champs d'apprentissage différents, évaluées en terminale ; la note finale est la moyenne des trois.",x:"Elle s'appuie sur l'arrêté du 21 décembre 2011 modifié. Les candidats individuels et ceux du CNED passent un examen ponctuel portant sur deux activités de deux champs différents."},
{id:"po26",th:"PO",p:"",q:"Comment les AFL sont-ils évalués au CCF du bac GT selon la note de service de 2026 ?",a:"L'AFL1 est évalué le jour de l'épreuve ; les AFL2 et AFL3 le sont au fil de la séquence. L'évaluation ne peut pas reposer sur les seuls AFL2 et AFL3, même en cas d'inaptitude partielle ou temporaire. Deux enseignants d'EPS co-évaluent chaque candidat.",x:"L'ensemble certificatif est choisi par le candidat parmi les menus de l'établissement. La troisième épreuve peut relever de la liste académique (cinq activités au plus) ou d'une activité d'établissement. La note est arrondie après harmonisation par la commission académique."},
{id:"po27",th:"PO",p:"",q:"Quel est le poids de l'EPS au baccalauréat général et technologique ?",a:"Coefficient 6, en terminale, au titre du contrôle continu (qui représente 40 % de la note finale). L'EPS est évaluée en CCF, et non par la moyenne des bulletins.",x:"Les textes de référence sont l'arrêté du 16 juillet 2018 modifié (contrôle continu) et l'arrêté du 21 décembre 2011 modifié (CCF d'EPS). Pour un candidat dispensé, le coefficient de l'EPS est neutralisé."},
{id:"po28",th:"PO",p:"",q:"Comment l'EPS est-elle certifiée au bac professionnel et au CAP ?",a:"Bac pro : CCF sur trois APSA relevant de trois CA, chacune notée sur 20 ; la note finale est la moyenne. CAP : CCF sur deux APSA relevant de deux CA. Dans les deux cas, l'évaluation a lieu au cours de la dernière année de formation.",x:"Textes : pour le bac pro, l'arrêté du 17 juin 2020 et la circulaire du 29 décembre 2020 (BO n°4 du 28 janvier 2021) ; pour le CAP, l'arrêté du 30 août 2019 et la circulaire du 27 août 2025 (BO n°36 du 25 septembre 2025), qui fixe le référentiel national."},
{id:"po29",th:"PO",p:"",q:"Comment l'EPS compte-t-elle au diplôme national du brevet à partir de la session 2026 ?",a:"Le contrôle continu représente 40 % de la note : c'est la moyenne des moyennes annuelles de 3e de chacun des enseignements obligatoires, dont l'EPS, tous au même coefficient. Les épreuves finales comptent pour 60 %. La maîtrise du socle n'entre plus dans le calcul.",x:"Textes : arrêté du 10 avril 2025 et note de service du 2 septembre 2025 (BO n°33 du 4 septembre 2025). Seules les dispenses réglementaires d'EPS sont admises (mention « Dispensé » dans le LSU). Ces règles s'appliquent aux 3e de 2026-2027 (session 2027)."},
{id:"po30",th:"PO",p:"",q:"Comment l'EPS comptait-elle au DNB jusqu'à la session 2025 ?",a:"Indirectement, par sa contribution à l'évaluation des huit composantes du socle (10, 25, 40 ou 50 points chacune), qui formaient 400 points de contrôle continu sur 800.",x:"C'était le régime de l'arrêté du 31 décembre 2015 modifié (notamment le 27 novembre 2017). L'EPS n'y avait donc pas de note propre. La réforme de 2025 lui redonne un poids direct par sa moyenne annuelle de 3e."},
